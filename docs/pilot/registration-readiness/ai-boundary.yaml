# Privacy and AI boundary (artifact 12). The institution is the system of record,
# and AI does not receive student records. Assistant behavior is source-bounded,
# labeled, and cannot take consequential actions.
ai_rules:
  allowed:
    - explain_student_visible_readiness_status
    - summarize_included_sources
    - draft_a_support_or_referral_message
    - help_find_the_correct_institutional_office
  prohibited:
    - decide_eligibility
    - override_a_hold
    - submit_or_confirm_registration
    - modify_institutional_records
    - infer_restricted_attributes
    - access_records_outside_current_authorized_scope

required_response_elements:
  - ai_assisted_label
  - data_scope_statement
  - source_list
  - uncertainty_statement_when_applicable
  - human_or_office_handoff_for_consequential_next_step

data_handling:
  student_records_to_external_model: prohibited
  approved_deidentified_evaluation: requires_documented_review
  prompt_logging: redacted_or_disabled_for_restricted_data
