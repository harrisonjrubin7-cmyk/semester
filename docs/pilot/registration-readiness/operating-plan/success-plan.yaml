# Operating plan object 2: success questions, indicators, and reporting rule.
# Source: "Success questions" section of the pilot operating plan brief.
success_questions:
  - question: Can students understand their next safe step?
    evidence: [completion_path, safe_next_step_selection, student_feedback, support_reasons]
    decision_enabled: continue_or_revise_student_experience
  - question: Can the institution trust the boundary?
    evidence: [source_labels, policy_and_RLS_tests, audit_receipts, reconciliations]
    decision_enabled: expand_maintain_or_narrow_scope
  - question: Can staff operate exceptions?
    evidence: [queue_volume, time_to_triage, escalation_outcomes, runbook_use]
    decision_enabled: resource_and_workflow_design
  - question: Can a connector work reliably enough?
    evidence: [freshness, failures, retries, mismatches, safe_state_behavior]
    decision_enabled: certify_remediate_or_replace_integration
  - question: Is Semester repeatable?
    evidence: [implementation_artifact_quality, config_changes, launch_effort]
    decision_enabled: prepare_second_implementation
  - question: Is there renewal value?
    evidence: [sponsor_evidence, adoption, support_impact, outcome_narrative]
    decision_enabled: renew_expand_or_conclude

leading_indicators:
  - eligible_students_can_authenticate
  - scoped_students_reach_readiness_workflow
  - outcomes_have_visible_source_and_freshness_context
  - safe_next_step_is_available_for_every_outcome
  - staff_handoffs_arrive_in_correct_queue
  - no_unapproved_cross_tenant_or_cross_role_access

decision_indicators:
  - student_understanding_evidence
  - institution_operator_confidence
  - connector_reliability_evidence
  - reconciliation_rate_and_resolution_pattern
  - support_burden_and_top_reasons
  - sponsor_renewal_or_expansion_decision

reporting_rule: >
  Every metric must state its numerator, denominator, observation period,
  scope, source, owner, and limitations. See measurement-plan.yaml.
