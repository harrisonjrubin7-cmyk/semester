# Operating plan object 11: measurement plan.
# Every metric carries the reporting rule's seven fields. Owner and source are
# roles or systems; a field marked TBD is not yet measurable.
measurement:
  metrics:
    adoption:
      definition: Eligible cohort members who reach the first meaningful readiness action, reported alongside eligibility and authentication context.
      numerator: cohort members who reached first meaningful readiness action
      denominator: eligible cohort members
      observation_period: TBD
      scope: approved cohort only
      source: readiness event stream (event schema not yet written)
      owner: semester_product_owner
      limitations: [cohort_definition, authentication_context_reported_separately]

    completion:
      definition: Requests reaching a student-visible outcome with an available safe next step. Report each outcome state separately.
      numerator: requests reaching a student-visible outcome with a safe next step, per outcome state
      denominator: all submitted evaluation requests in the cohort and observation period (not partitioned by outcome)
      observation_period: TBD
      scope: approved cohort only
      source: workflow state records
      owner: semester_product_owner
      limitations: [source_outages, stale_source_periods]

    understanding:
      definition: Student evidence that the outcome and next step were understood, through a short in-context prompt or structured feedback.
      numerator: responses reporting the outcome and next step were understood
      denominator: students shown the prompt
      observation_period: TBD
      scope: approved cohort only
      source: in-context prompt (not yet built)
      owner: semester_product_owner
      limitations: [response_rate, self_report]

    operational_load:
      definition: Staff handoffs, support cases, reconciliation cases, and resolution patterns by outcome state.
      numerator: handoffs, cases, and reconciliation cases, counted by outcome state
      denominator: none; reported as counts
      observation_period: TBD
      scope: approved cohort and approved offices
      source: staff queue and audit history
      owner: semester_operations_owner
      limitations: [queue_routing_rules, staff_availability]

    reconciliation:
      definition: Cases where the outcome Semester presented and the institution's official record disagree or need checking, and how each case was resolved. Feeds the reconciliation_rate_and_resolution_pattern decision indicator in success-plan.yaml.
      cohort: reconciliation cases opened in the observation period; the same cohort supplies both terms of the rate
      numerator: cohort cases in a resolution state at the stated cutoff
      denominator: cohort cases opened in the observation period
      cutoff: TBD (one evaluation date, stated with every report)
      resolution_pattern: distribution of cohort cases by resolution state and resolution code at the cutoff, reported alongside the rate
      observation_period: TBD
      scope: approved cohort and approved offices
      source: reconciliation cases in the staff queue and audit history
      owner: semester_operations_owner
      limitations: [official_record_timing, resolution_code_consistency]

    escalation_outcomes:
      definition: Staff escalations by recorded outcome (resolved, routed, unresolved, reopened) and time to close. Answers whether staff can operate exceptions.
      numerator: escalations reaching a recorded outcome in the observation period
      denominator: escalations opened in the observation period
      observation_period: TBD
      scope: approved offices only
      source: escalation records in the staff queue and audit history
      owner: semester_operations_owner
      limitations: [queue_routing_rules, escalation_coding_consistency]

    runbook_use:
      definition: Runbook steps executed by pilot staff, and whether each step was completed without engineering help. Answers whether staff can operate exceptions.
      numerator: runbook steps completed by pilot staff without engineering help
      denominator: runbook steps executed by pilot staff in drills and live exceptions
      observation_period: TBD
      scope: approved offices only
      source: drill records (EVD-FAILURE-DRILLS-001) and escalation records
      owner: semester_operations_owner
      limitations: [drill_realism, staff_turnover]

    time_to_triage:
      definition: Elapsed time from case opened to first triage action, reported as median and 90th percentile in minutes.
      numerator: none; median and p90 of opened-to-triaged durations for triaged cases, plus the untriaged count and the age of each untriaged case at cutoff
      denominator: all cases opened in the observation period
      observation_period: TBD
      scope: approved offices only
      source: audit events case_opened and triaged_at_audit_event (staff-workflow.yaml)
      owner: semester_operations_owner
      limitations: [queue_routing_rules, weekend_coverage]

    reliability:
      definition: Connector freshness, workflow completion, safe-state activation, incident count, and time to containment.
      numerator: "per sub-measure: connector refreshes within expected window; workflow requests completed; safe-state activations that succeeded; incidents contained within target"
      denominator: "per sub-measure: connector refreshes attempted; workflow requests submitted; safe-state activations attempted; incidents opened"
      observation_period: TBD
      scope: per sub-measure; connector refresh on the approved source, workflow completion on the approved cohort, safe-state activation and incidents on the whole pilot
      source: connector health records, workflow state records, safe-state activation records, and the incident log
      owner: semester_operations_owner
      limitations: [freshness_thresholds_TBD, source_outages]

    trust:
      definition: Open controls, accessibility issues, privacy or security issues, and institution review feedback. Reported as status, not a single score.
      numerator: none; reported as status per category
      denominator: none
      observation_period: TBD
      scope: whole pilot
      source: control register (not yet written), accessibility evidence, institution review
      owner: semester_engineering_or_security_owner
      limitations: [control_register_missing, no_composite_score]

  required_limitations:
    - cohort_definition
    - data_gaps
    - source_outages
    - scope_exclusions
    - changes_during_pilot
    - unvalidated_claims
