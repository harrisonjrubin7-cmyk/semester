# Controlled-action pattern (artifact 11). Staff actions that affect routing,
# exceptions, or source state are previewed, reasoned, approved where required,
# audited, and receipted. Self-approval is blocked.
controlled_action:
  stages:
    - identify_authorized_actor
    - load_current_state
    - show_consequence_preview
    - require_reason
    - evaluate_policy
    - require_second_approver_when_configured
    - execute_command
    - create_audit_record
    - issue_receipt
    - show_reversible_or_escalation_path

example:
  action: readiness.override.request
  actor: registrar
  rule:
    requester_cannot_approve: true
    approval_roles:
      - senior_registrar
      - designated_institution_approver
  required_reason: true
  receipt:
    visible_to:
      - requester
      - approver
      - affected_student_when_institution_policy_allows
    language: "An exception request was recorded. It does not change your enrollment."
