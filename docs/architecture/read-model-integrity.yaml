# docs/architecture/read-model-integrity.yaml
# Status: specified. Guard and metadata check implemented in
# app/src/lib/readmodel/integrity.ts (canUseProjectionForOutcome, missingProjectionMetadata).

read_model:
  principles:
    - "Write models record authoritative state for their bounded domain."
    - "Read models are rebuildable projections."
    - "A projected value includes projection time and source authority."
    - "Lag changes what the interface may allow or claim."
    - "A stale projection cannot support a definitive consequential outcome."

  required_metadata:
    - projection_name
    - source_event_id
    - aggregate_version
    - projected_at
    - source_observed_at
    - freshness_state
    - tenant_id
    - schema_version

  recovery:
    - pause_affected_projection
    - preserve_offset_or_checkpoint
    - identify_affected_tenants_and_records
    - rebuild_or_replay_from_safe_checkpoint
    - compare_expected_and_actual_counts
    - re-enable_only_after_verification

  guard: |
    export function canUseProjectionForOutcome(input: {
      freshnessState: "current" | "updating" | "stale" | "unknown" | "failed";
      projectionLagSeconds: number;
      maximumLagSeconds: number;
      outcomeType: "informational" | "derived" | "consequential";
    }): boolean {
      if (input.outcomeType === "informational") return true;
      if (input.freshnessState !== "current") return false;
      return input.projectionLagSeconds <= input.maximumLagSeconds;
    }
    # Implemented version also rejects a lag that is NaN, infinite or negative.
