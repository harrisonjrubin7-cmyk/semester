<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Semester architecture dashboard</title><style>
:root{--bg:#f4f1ea;--panel:#fbf9f4;--fg:#1b1a17;--line:#9ca3b2;--blue:#416180}body.dark{--bg:#090a0e;--panel:#12141a;--fg:#eceef2;--line:#4c5561;--blue:#94bce3;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Arial,sans-serif}header{background:#090a0e;color:#eceef2;padding:18px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:100%}button{cursor:pointer}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr)}aside{padding:18px;border-right:1px solid var(--line);max-height:88vh;overflow:auto}main{padding:24px;min-width:0}input{width:100%}nav button{width:100%;text-align:left;margin:5px 0;overflow-wrap:anywhere}nav button[aria-current=true]{border-left:4px solid var(--blue)}.notice{padding:12px 18px;border-bottom:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{padding:18px;border:1px solid var(--line);background:var(--panel);border-radius:6px;margin-bottom:18px;min-width:0}h1,code,p,li{overflow-wrap:anywhere}.region{padding:14px;border:1px dashed var(--line);margin:10px 0}details{margin:10px 0}summary{cursor:pointer;padding:8px}a{color:var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap}.skip{position:absolute;top:-70px;background:var(--panel);padding:10px}.skip:focus{top:0}@media(max-width:800px){.layout,.grid{grid-template-columns:1fr}aside{max-height:280px;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}}@media print{header,aside,.notice,.actions{display:none}.layout,.grid{display:block}body{background:white;color:black}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><a class="skip" id="skip" href="#main">Skip to architecture</a><header><strong>SEMESTER</strong><span>Public architecture dashboard</span><button id="theme">Dark theme</button><button id="export">Export route spec</button></header><div class="notice">Architecture review preview. 44 route patterns; ten map to existing design pages. No identity, record, payment, email or enrollment operations. Proposed trees and layouts are not production implementation evidence.</div><div class="layout"><aside><label for="search">Find route, page or region</label><input id="search" type="search"><p id="count" aria-live="polite"></p><nav id="nav" aria-label="Route map"></nav></aside><main id="main" tabindex="-1"></main></div><script id="data" type="application/json">[["/","Home","hero,source demo,product jobs,status disclosure,trust,CTA",1],["/about","About","mission,principles,status,contact",1],["/team","Team","approved biographies,roles,contact",0],["/contact","Contact","routing,local inquiry,privacy,receipt",1],["/product","Product","OS overview,role paths,modules,boundaries,CTA",1],["/product/:slug","Product detail","purpose,workflow,authority,maturity,related",0],["/students","Students","daily loop,sources,privacy,first action,FAQ",1],["/institutions","Institutions","office jobs,authority,review status,pilot,FAQ",1],["/pilot","Pilot proposal","scope,non goals,baseline,gates,owners,inquiry",1],["/solutions","Solutions","audiences,shared foundation,CTA",0],["/solutions/students","Student solutions","Today,learning,registration,privacy",0],["/solutions/faculty","Faculty solutions","authoring,accessibility,submission,release",0],["/solutions/advisors","Advisor solutions","caseload,sharing,handoff,follow up",0],["/solutions/registrars","Registrar solutions","readiness,holds,exceptions,reconciliation",0],["/solutions/institutions","Institution solutions","tenant,roles,integrations,rollout",0],["/solutions/:audience","Audience detail","purpose,workflow,authority,CTA",0],["/pricing","Pricing","posture,scope,entitlements,quote",1],["/pricing/quote","Quote request","scope,local form,consent,receipt",0],["/demo","Demo request","synthetic boundary,local form,receipt",0],["/demo/tour","Tour","Today,sources,privacy,action example,CTA",0],["/resources","Resources","approved index,filters,accessible formats",0],["/resources/:slug","Resource detail","author,version,content,sources,alternatives",0],["/trust","Trust","status,privacy,security,accessibility,AI,reliability",1],["/trust/security","Security","scope,review status,evidence,report path",0],["/trust/privacy","Privacy","purpose,sharing,rights,retention",0],["/trust/accessibility","Accessibility","target,review,barrier report,alternatives",0],["/trust/ai","AI governance","scope,gateway,sources,policy,human authority",0],["/trust/subprocessors","Subprocessors","purpose,region,classification,retention,status",0],["/legal","Legal index","documents,draft status,authority,contact",1],["/legal/terms","Terms draft","control header,purpose,rules,exceptions,history",0],["/legal/privacy","Privacy draft","control header,purpose,sharing,rights,history",0],["/legal/cookies","Cookie draft","control header,categories,consent,withdrawal",0],["/legal/community","Community draft","control header,conduct,reporting,appeal",0],["/legal/accessibility","Accessibility draft","control header,target,status,barrier report",0],["/status","Status","source,services,incidents,unavailable",0],["/auth/signup","Signup entry","purpose,terms,identity handoff,privacy",0],["/auth/signin","Sign in entry","provider,recovery,session boundary",0],["/join","Join entry","invite,institution,membership vs grant,handoff",0],["/open","App handoff","transaction,expiry,account match,claim,receipt",0],["/download","Download entry","verified distribution,availability,web fallback",0],["/partners","Partners","types,data boundary,local inquiry",0],["/careers","Careers","approved roles,principles,accessible application",0],["/careers/:slug","Job detail","summary,90 days,requirements,approved compensation",0],["/404","Not found","explanation,safe navigation",0]]</script><script>
const routes=JSON.parse(document.getElementById('data').textContent).map(([route,title,regions,seen])=>({route,title,regions:regions.split(','),status:seen?'prototype mapping; clean URL proposed':'proposed extension',components:['SiteShell','SiteHeader','PageHero','RegionGrid','PrimaryCTA','SiteFooter'],gates:['approved claims','accessible behavior','actual server adapter if needed','exact scope publication approval']})),$=x=>document.getElementById(x);let selected=routes[0];
function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
function section(title){const n=node('section');n.className='card';n.append(node('h2',title));return n;}
function choose(route,focus=false){selected=routes.find(x=>x.route===route)||routes.find(x=>x.route==='/404');history.replaceState(null,'','#'+encodeURIComponent(selected.route));render();list();if(focus)$('main').focus();}
function list(){const q=$('search').value.toLowerCase(),filtered=routes.filter(r=>[r.route,r.title,...r.regions].join(' ').toLowerCase().includes(q));$('nav').replaceChildren();$('count').textContent=filtered.length+' of '+routes.length+' routes';filtered.forEach(r=>{const b=node('button',r.route+' — '+r.title);b.setAttribute('aria-current',String(r.route===selected.route));b.onclick=()=>choose(r.route,true);$('nav').append(b);});if(!filtered.length)$('nav').append(node('p','No matching routes. Clear the search.'));}
function render(){const r=selected,m=$('main');m.replaceChildren(node('p',r.route+' · '+r.status),node('h1',r.title));const action=node('div');action.className='actions';const print=node('button','Print this page');print.onclick=()=>window.print();action.append(print);const label=node('label','Preview viewport '),select=node('select');select.setAttribute('aria-label','Wireframe viewport');['desktop','mobile'].forEach(v=>{const o=node('option',v);o.value=v;select.append(o);});label.append(select);action.append(label);m.append(action);const grid=node('div');grid.className='grid';const wire=section('Interactive page wireframe');wire.id='wire';const top=node('div','SiteHeader / labelled navigation');top.className='region';wire.append(top);r.regions.forEach((name,i)=>{const d=node('details');d.open=true;const s=node('summary',name);d.append(s,node('p','Region '+(i+1)+' · reviewed content and accessible alternatives required.'));wire.append(d);});const foot=node('div','PrimaryCTA / SiteFooter / legal and trust');foot.className='region';wire.append(foot);select.onchange=()=>{wire.style.maxWidth=select.value==='mobile'?'390px':'none';};const tree=section('Component tree');tree.append(node('p','Proposed page composition; map to canonical components before implementation.'));const root=node('details');root.open=true;root.append(node('summary','SiteShell'));const ul=node('ul');r.components.filter(c=>c!=='SiteShell').forEach(c=>{const li=node('li');const d=node('details');d.open=true;d.append(node('summary',c));if(c==='RegionGrid'){const sub=node('ul');r.regions.forEach(x=>sub.append(node('li',x)));d.append(sub);}li.append(d);ul.append(li);});root.append(ul);tree.append(root);grid.append(wire,tree);m.append(grid);const gates=section('Publication and authority gates');const ol=node('ul');r.gates.forEach(x=>ol.append(node('li',x)));gates.append(ol,node('p','Designed, implemented, tested, deployed, institution-authorized and production-enabled remain separate evidence facts.'));m.append(gates);}
$('search').oninput=list;$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Light theme':'Dark theme';};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({status:'proposed architecture; not release approval',routes},null,2)],{type:'application/json'});const a=node('a');a.href=URL.createObjectURL(blob);a.download='semester-public-architecture.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);};document.getElementById('skip').onclick=e=>{e.preventDefault();$('main').focus();};let route='/';try{route=decodeURIComponent(location.hash.slice(1))||'/';}catch(e){route='/404';}choose(route);
</script></body></html>
