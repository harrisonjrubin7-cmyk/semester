# docs/drills/DRILL-REGISTER-2026-10.yaml
# Register of the nine operational drills required before activation.
# Every drill is NOT RUN. A drill passes only when a staging run produces an evidence bundle.
# Status vocabulary: not_run | passed | failed_with_corrective_action | passed_after_retest

