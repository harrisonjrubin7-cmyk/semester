secrets_management:
  principles:
    - "No secrets in source control, client bundles, fixtures, screenshots, or production exports."
    - "Every secret is owned, scoped, rotated, and auditable."
    - "Production secrets are unavailable to preview and local environments."
    - "Connector credentials are tenant-scoped where technically possible."
  secret_classes:
    - database_credentials
    - signing_keys
    - connector_credentials
    - webhook_signing_secrets
    - payment_provider_keys
    - email_and_notification_credentials
    - AI_provider_credentials
    - emergency_break_glass_credentials
  required_metadata:
    - secret_id
    - owner
    - environment
    - tenant_scope_if_applicable
    - purpose
    - rotation_cadence
    - last_rotated_at
    - emergency_revocation_procedure
  incident_triggers:
    - suspected_exposure
    - unauthorized_use
    - employee_or_vendor_access_change
    - connector_compromise
# Shape of a secret reference (TypeScript contract, for reviewers):
#   type SecretReference = {
#     id: string;
#     environment: "local" | "preview" | "staging" | "production";
#     owner: string;
#     purpose: string;
#     tenantId?: string;
#     rotation: {
#       required: boolean;
#       cadence: "institution_agreed" | "provider_required" | "incident_triggered";
#       lastRotatedAt?: string;
#     };
#   };
