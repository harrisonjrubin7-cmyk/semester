                  - $ref: '#/components/schemas/IntelligenceError'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '429':
          description: Flat intelligence refusal budget-exhausted, or the error envelope rate_limited.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '503':
