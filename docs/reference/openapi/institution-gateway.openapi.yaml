        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
      responses:
        '200':
          description: The group with its new membership.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroupResource'
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '413':
          $ref: '#/components/responses/ScimError'
