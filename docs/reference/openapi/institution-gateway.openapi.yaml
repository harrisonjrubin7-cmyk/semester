        '503':
          $ref: '#/components/responses/ScimError'
    patch:
      tags: [scim]
      operationId: scimPatchGroup
      summary: Applies operations whose path is one of displayName, externalId, members.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/scim+json:
