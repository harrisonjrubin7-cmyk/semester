        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Supabase Auth access token. The gateway validates it over the network on every request.
    scimBearer:
      type: http
      scheme: bearer
      description: "A SCIM credential: the credential id (a UUID), a dot, then a secret of at least 32 characters from A-Z a-z 0-9 underscore hyphen."
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: 8 to 128 characters from A-Z a-z 0-9 dot underscore colon hyphen. Echoed on the response. A fresh UUID is minted when absent or malformed.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every SCIM request that is not a GET. At most 300 characters. It is the request id the audit row is keyed on.
      schema:
        type: string
        maxLength: 300
    ScimFilter:
      name: filter
      in: query
      required: false
      description: 'Only: userName eq "value" or externalId eq "value". Anything else is a 400.'
      schema:
        type: string
        maxLength: 640
    ScimStartIndex:
      name: startIndex
      in: query
      required: false
      description: One-based. An invalid value becomes 1.
      schema:
        type: integer
        minimum: 1
    ScimCount:
      name: count
      in: query
      required: false
      description: Default 100, at most 200. An invalid value becomes 100.
      schema:
        type: integer
        minimum: 0
        maximum: 200
  responses:
    Envelope:
      description: The error envelope. error.code is one of the codes in ERRORS.md.
      headers:
        X-Request-Id:
          schema:
            type: string
        X-Correlation-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IntelligenceRefusal:
      description: The flat intelligence refusal {code, message}. The code is one of the intelligence codes in ERRORS.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntelligenceError'
    ScimError:
      description: A SCIM error message. There is no machine-readable code; the status and the detail sentence are the contract.
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimErrorBody'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error, message]
      properties:
        error:
          type: object
          required: [code, message, correlation_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
            retryable:
              type: boolean
              description: True only for 429 and 503.
            user_action:
              $ref: '#/components/schemas/UserAction'
        message:
          type: string
          description: The same sentence as error.message, for clients written before the envelope.
    UserAction:
      type: object
      required: [label, kind]
      properties:
        label:
          type: string
        kind:
          type: string
          enum: [external_link, open_screen, retry_later, contact_support]
        href:
          type: string
    IntelligenceError:
      type: object
      required: [code, message]
      description: The flat body the intelligence service returns. It is not wrapped in the envelope.
      properties:
        code:
          type: string
        message:
          type: string
    EntryError:
      type: object
      required: [error]
      description: The flat body the Vercel entry and start.ts return themselves, before or around the gateway.
      properties:
        error:
          type: string
    HealthLive:
      type: object
      required: [service, version, status]
      properties:
        service:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [live]
    Health:
      type: object
      required: [service, version, status, adapters, intelligence, readOnly]
      properties:
        service:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [ready, unavailable]
        adapters:
          type: integer
          description: How many adapters are installed. Not how many are healthy.
        intelligence:
          type: string
          enum: [policy-disabled, configured-sandbox, configured-production]
        readOnly:
          type: boolean
    SsoConfig:
      oneOf:
        - type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              enum: [false]
        - type: object
          required: [enabled, label, domain]
          properties:
            enabled:
              type: boolean
              enum: [true]
            label:
              type: string
            domain:
              type: string
    UniversityArea:
      type: string
      enum: [courses, assignments, assessments, grades, email, registration, advising, billing, aid, dining, housing, mailroom, transport, library, athletics, recreation, clubs, career, alumni, abroad, forms, records, admissions, orientation, graduate, research, international, accessibility, appeals, directory, graduation, family, support, health, safety, identity, admin]
    UniversityRole:
      type: string
      enum: [student, faculty, teaching_assistant, advisor, admin, staff, applicant, payer, family, alumni]
    ConnectionStatus:
      type: object
      required: [area, state, provider, canRead, canWrite, lastSyncAt, permissions, message]
      properties:
        area:
          $ref: '#/components/schemas/UniversityArea'
        state:
          type: string
          enum: [not-configured, connected, error, disconnected]
        provider:
          type: string
        canRead:
          type: boolean
        canWrite:
          type: boolean
        lastSyncAt:
          type: [string, 'null']
        permissions:
          type: array
          items:
            type: string
        message:
          type: string
    InstitutionStatus:
      type: object
      required: [version, institutionId, institutionName, roles, connections]
      properties:
        version:
          type: integer
        institutionId:
          type: string
        institutionName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UniversityRole'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionStatus'
    ActionField:
      type: object
      required: [id, label, kind, required]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [text, textarea, date, datetime-local, email, number, select]
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
    RecordAction:
      type: object
      required: [id, label, fields]
      properties:
        id:
          type: string
        label:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ActionField'
    UniversityRecord:
      type: object
      required: [id, area, title, summary, status, version, updatedAt, details, actions]
      properties:
        id:
          type: string
        area:
          $ref: '#/components/schemas/UniversityArea'
        title:
          type: string
        summary:
          type: string
        status:
          type: string
        version:
          type: string
          description: Send it back with any action on the record. A moved version is a 409 record_changed.
        updatedAt:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/LabelValue'
        dates:
          type: array
          items:
            type: object
            required: [at, what]
            properties:
              at:
                type: string
              what:
                type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/RecordAction'
    LabelValue:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
    RecordPage:
      type: object
      required: [records, nextCursor, fetchedAt]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/UniversityRecord'
        nextCursor:
          type: [string, 'null']
        fetchedAt:
          type: string
    ActionInput:
      type: object
      required: [area, recordId, version, actionId, fields]
      properties:
        area:
          $ref: '#/components/schemas/UniversityArea'
        recordId:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          minLength: 1
          maxLength: 200
        actionId:
          type: string
          minLength: 1
          maxLength: 200
        fields:
          type: object
          description: At most 30 entries. Keys match ^[a-zA-Z][a-zA-Z0-9_-]{0,63}$. Values are strings of at most 20000 characters. Every key must be a field of the action.
          additionalProperties:
            type: string
            maxLength: 20000
    Review:
      type: object
      required: [id, title, details, expiresAt]
      properties:
        id:
          type: string
        title:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/LabelValue'
        expiresAt:
          type: string
    CommitRequest:
      type: object
      required: [reviewId, confirmed]
      properties:
        reviewId:
          type: string
        confirmed:
          type: boolean
          enum: [true]
          description: Only the JSON value true counts.
    ReconcileRequest:
      type: object
      required: [reviewId]
      properties:
        reviewId:
          type: string
    Receipt:
      type: object
      required: [id, status, message, recordedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [completed, pending]
        message:
          type: string
        recordedAt:
          type: string
    IntelligencePolicy:
      type: object
      required: [state, allowedModes]
      properties:
        state:
          type: string
          enum: [off, preview, sandbox, production]
        allowedModes:
          type: array
          items:
            $ref: '#/components/schemas/IntelligenceMode'
    IntelligenceMode:
      type: string
      enum: [explain, hint, practice, review, draft]
    IntelligenceAction:
      type: object
      required: [id, label, effect, target, class, reversible, evidenceIds]
      properties:
        id:
          type: string
        label:
          type: string
        effect:
          type: string
        target:
          type: string
        class:
          type: string
          enum: [prepare, internal-write, consequential]
        reversible:
          type: boolean
        evidenceIds:
          type: array
          items:
            type: string
        preparedAt:
          type: string
        expiresAt:
          type: string
    IntelligenceRequest:
      type: object
      required: [version, clientState, tenantId, personId, question, mode, category, sourceIds, evidenceIds, proposedActions]
      properties:
        version:
          type: integer
          enum: [1]
        clientState:
          type: string
          enum: [off, preview, sandbox, production]
          description: Informational. The gateway always loads the policy on the server.
        tenantId:
          type: string
        personId:
          type: string
        question:
          type: string
          maxLength: 10000
        mode:
          $ref: '#/components/schemas/IntelligenceMode'
        category:
          type: string
        agent:
          type: string
          enum: [assistant, advisor, tutor, course-guide]
        courseId:
          type: string
        term:
          type: string
          pattern: '^[0-9]{4}(FA|SP|SU)$'
        sourceIds:
          type: array
          maxItems: 100
          items:
            type: string
        evidenceIds:
          type: array
          maxItems: 200
          items:
            type: string
        proposedActions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/IntelligenceAction'
    IntelligenceResponse:
      type: object
      required: [version, text, agent, sourceIds, evidenceIds, mode, route, usage, actions]
      properties:
        version:
          type: integer
        text:
          type: string
        agent:
          type: string
        sourceIds:
          type: array
          items:
            type: string
        evidenceIds:
          type: array
          items:
            type: string
        mode:
          $ref: '#/components/schemas/IntelligenceMode'
        route:
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
        usage:
          type: object
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer
            estimatedCents:
              type: number
        actions:
          type: array
          items:
            $ref: '#/components/schemas/IntelligenceAction'
    IntelligenceConfirm:
      type: object
      required: [confirmed, at]
      properties:
        confirmed:
          type: boolean
          enum: [true]
        at:
          type: string
          description: ISO time of the confirmation. It must be no more than five minutes old and not in the future.
    ActionReceipt:
      type: object
      required: [id, actionId, status, message, recordedAt, authoritative]
      properties:
        id:
          type: string
        actionId:
          type: string
        status:
          type: string
          enum: [completed, pending]
        message:
          type: string
        recordedAt:
          type: string
        authoritative:
          type: boolean
          enum: [true]
    ScimErrorBody:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items:
            type: string
        status:
          type: string
          description: The HTTP status as a string.
        detail:
          type: string
    ScimUser:
      type: object
      required: [schemas, userName]
      properties:
        schemas:
          type: array
          items:
            type: string
        externalId:
          type: string
          maxLength: 300
        userName:
          type: string
          maxLength: 300
        displayName:
          type: string
          maxLength: 300
        active:
          type: boolean
          description: Defaults to true when omitted.
    ScimUserResource:
      type: object
      required: [schemas, id, userName, active, meta]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        externalId:
          type: string
        userName:
          type: string
        displayName:
          type: string
        active:
          type: boolean
        meta:
          $ref: '#/components/schemas/ScimMeta'
    ScimMember:
      type: object
      required: [value]
      properties:
        value:
          type: string
        display:
          type: string
    ScimGroup:
      type: object
      required: [schemas, displayName]
      properties:
        schemas:
          type: array
          items:
            type: string
        externalId:
          type: string
        displayName:
          type: string
        members:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ScimMember'
    ScimGroupResource:
      type: object
      required: [schemas, id, displayName, members, meta]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        externalId:
          type: string
        displayName:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/ScimMember'
        meta:
          $ref: '#/components/schemas/ScimMeta'
    ScimMeta:
      type: object
      properties:
        resourceType:
          type: string
        created:
          type: string
        lastModified:
          type: string
        location:
          type: string
    ScimPatch:
      type: object
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
        Operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [op, path]
            properties:
              op:
                type: string
                enum: [add, replace, remove]
              path:
                type: string
                enum: [active, userName, displayName, externalId, members]
              value: {}
    ScimList:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            type: object

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: A completed outcome receipt, including an exact durable replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationReadinessReceipt'
        '202':
          description: The durable receipt when evaluation remains in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationReadinessReceipt'
        '400':
          $ref: '#/components/responses/Envelope'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          $ref: '#/components/responses/Envelope'
        '404':
          $ref: '#/components/responses/Envelope'
        '409':
          $ref: '#/components/responses/Envelope'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '422':
          $ref: '#/components/responses/Envelope'
        '429':
          $ref: '#/components/responses/Envelope'
        '503':
          $ref: '#/components/responses/Envelope'
  /v1/intelligence/policy:
    get:
      tags: [intelligence]
      operationId: getIntelligencePolicy
      summary: The caller's Semester Intelligence policy state. Policy-disabled unless server-side provider requirements are all configured.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The tenant policy state and the allowed modes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligencePolicy'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          description: Either the error envelope (identity) or the flat intelligence refusal (policy).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '429':
          $ref: '#/components/responses/Envelope'
        '503':
          description: Either the error envelope (no intelligence service configured) or the flat refusal ai-generation-killed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
  /v1/intelligence/respond:
