# Hand-checked description of the institution gateway: app/server/institution/gateway.ts,
# app/server/institution/scim.ts and the Vercel entry app/api/institution/[...path].ts.
# app/src/lib/docs/gateway-reference.test.ts holds this file to the code: its route set,
# its error codes and every $ref. It uses a deliberately small YAML subset (block
# mappings and sequences, short flow lists, quoted strings) so that the test can read it
# without a dependency.
openapi: 3.1.0
info:
  title: Semester institution gateway
  version: '1'
  description: "Status MOCK_DEMO. The shipped adapter registry is empty, so every service that needs an adapter answers 503 adapter_not_configured. The sandbox adapters answer only when the server is started with SEMESTER_SANDBOX_INSTITUTION=1. Routes under /scim/v2 exist only when SEMESTER_SCIM=on on the Vercel runtime. OPTIONS on any path answers 204 with the CORS headers. Methods other than GET, POST and OPTIONS answer 405. The Vercel entry itself, before the gateway runs, answers 413 and 503 with a flat body {error: string} that is not the envelope described here."
servers:
  - url: /api/institution
    description: The Vercel entry. The entry strips this prefix before the gateway routes the request.
  - url: http://127.0.0.1:8787
    description: The standalone process started by app/server/institution/start.ts. The port is SEMESTER_GATEWAY_PORT.
tags:
  - name: health
  - name: records
  - name: actions
  - name: intelligence
  - name: registration-readiness
  - name: scim
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: Liveness. Answers 200 without touching any dependency.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
        '403':
          $ref: '#/components/responses/Envelope'
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Readiness. 200 when ready, 503 when not. Same handler as /health/ready.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready. The body is the health body with status unavailable, not the error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Envelope'
  /health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Readiness. Same handler as /health.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready. The body is the health body with status unavailable, not the error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Envelope'
  /v1/auth/config:
    get:
      tags: [health]
      operationId: getAuthConfig
      summary: Whether single sign-on is offered, and its label. No token needed.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: "{enabled: false} when no provider is configured or the lookup fails."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoConfig'
        '403':
          $ref: '#/components/responses/Envelope'
  /status:
    get:
      tags: [records]
      operationId: getStatus
      summary: The connection state of all 37 service areas for the caller's institution.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: One connection per area, in the order of UNIVERSITY_AREAS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionStatus'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          $ref: '#/components/responses/Envelope'
        '429':
          $ref: '#/components/responses/Envelope'
        '503':
          $ref: '#/components/responses/Envelope'
  /records:
    get:
      tags: [records]
      operationId: listRecords
      summary: One page of records for one service area.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: area
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UniversityArea'
        - name: search
          in: query
          required: false
          description: Free text. Truncated to 200 characters.
          schema:
            type: string
            maxLength: 200
        - name: cursor
          in: query
          required: false
          description: The nextCursor of the previous page. Truncated to 500 characters.
          schema:
            type: string
            maxLength: 500
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPage'
        '400':
          $ref: '#/components/responses/Envelope'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          $ref: '#/components/responses/Envelope'
        '429':
          $ref: '#/components/responses/Envelope'
        '503':
          $ref: '#/components/responses/Envelope'
  /actions/prepare:
    post:
      tags: [actions]
      operationId: prepareAction
      summary: Phase one. Returns a review and changes nothing at the institution.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionInput'
      responses:
        '200':
          description: A review that expires in ten minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/Envelope'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          $ref: '#/components/responses/Envelope'
        '404':
          $ref: '#/components/responses/Envelope'
        '409':
          $ref: '#/components/responses/Envelope'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '429':
          $ref: '#/components/responses/Envelope'
        '503':
          $ref: '#/components/responses/Envelope'
  /actions/commit:
    post:
      tags: [actions]
      operationId: commitAction
      summary: Phase two. Needs the review id and confirmed true. Replays a stored receipt for a completed or pending review.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: A receipt, completed or pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/Envelope'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          $ref: '#/components/responses/Envelope'
        '404':
          $ref: '#/components/responses/Envelope'
        '409':
          $ref: '#/components/responses/Envelope'
        '410':
          $ref: '#/components/responses/Envelope'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '429':
          $ref: '#/components/responses/Envelope'
        '502':
          description: The institution may have acted. Not retryable. Call /actions/reconcile.
          $ref: '#/components/responses/Envelope'
        '503':
          $ref: '#/components/responses/Envelope'
  /actions/reconcile:
    post:
      tags: [actions]
      operationId: reconcileAction
      summary: Asks the institution what happened to an action whose outcome is unknown. Never performs the action again. Still available in read-only mode.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '200':
          description: The receipt the institution reported, or the stored receipt of a completed review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/Envelope'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          $ref: '#/components/responses/Envelope'
        '404':
          $ref: '#/components/responses/Envelope'
        '409':
          $ref: '#/components/responses/Envelope'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '429':
          $ref: '#/components/responses/Envelope'
        '503':
          $ref: '#/components/responses/Envelope'
  /v1/registration-readiness/evaluations:
    post:
      tags: [registration-readiness]
      operationId: startRegistrationReadinessEvaluation
      summary: Starts a durable registration-readiness evaluation for the current student's own term.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [termId]
              additionalProperties: false
              properties:
                termId:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}
    get:
      tags: [intelligence]
      operationId: getIntelligencePolicy
      summary: The caller's Semester Intelligence policy state. Policy-disabled unless server-side provider requirements are all configured.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The tenant policy state and the allowed modes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligencePolicy'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          description: Either the error envelope (identity) or the flat intelligence refusal (policy).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '429':
          $ref: '#/components/responses/Envelope'
        '503':
          description: Either the error envelope (no intelligence service configured) or the flat refusal ai-generation-killed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
  /v1/intelligence/respond:
    post:
      tags: [intelligence]
      operationId: respondIntelligence
      summary: A governed model response over institution-approved sources. Refused unless the server policy allows it.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntelligenceRequest'
      responses:
        '200':
          description: The answer, its cited sources, its cost and the proposed actions it prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceResponse'
        '400':
          description: Flat intelligence refusal (invalid-request) or the error envelope (invalid JSON).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          description: Flat intelligence refusal, or the error envelope (identity).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '429':
          description: Flat intelligence refusal budget-exhausted, or the error envelope rate_limited.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '503':
          description: Flat intelligence refusal, or the error envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
  /v1/intelligence/actions/{id}/confirm:
    post:
      tags: [intelligence]
      operationId: confirmIntelligenceAction
      summary: Confirms an action proposed by /v1/intelligence/respond. In the shipped runtime it can never produce a receipt.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntelligenceConfirm'
      responses:
        '200':
          description: An authoritative receipt. The shipped runtime never reaches this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionReceipt'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          description: Flat intelligence refusal scope-refused, or the error envelope (identity).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '404':
          $ref: '#/components/responses/IntelligenceRefusal'
        '409':
          $ref: '#/components/responses/IntelligenceRefusal'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '429':
          $ref: '#/components/responses/Envelope'
        '502':
          $ref: '#/components/responses/IntelligenceRefusal'
        '503':
          $ref: '#/components/responses/Envelope'
  /scim/v2/ServiceProviderConfig:
    get:
      tags: [scim]
      operationId: scimGetServiceProviderConfig
      summary: SCIM discovery. Patch yes, bulk no, filter yes (200), sort no, etag no, change password no.
      security:
        - scimBearer: []
      responses:
        '200':
          description: The fixed service provider configuration.
          content:
            application/scim+json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
  /scim/v2/Schemas:
    get:
      tags: [scim]
      operationId: scimListSchemas
      summary: SCIM discovery. Lists the two schema ids as bare ids.
      security:
        - scimBearer: []
      responses:
        '200':
          description: A ListResponse of two ids.
          content:
            application/scim+json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
  /scim/v2/ResourceTypes:
    get:
      tags: [scim]
      operationId: scimListResourceTypes
      summary: SCIM discovery. Lists User and Group.
      security:
        - scimBearer: []
      responses:
        '200':
          description: A ListResponse of two resource types.
          content:
            application/scim+json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
  /scim/v2/Users:
    get:
      tags: [scim]
      operationId: scimListUsers
      summary: Lists users of the credential's tenant. Optional filter on userName or externalId with eq only.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/ScimFilter'
        - $ref: '#/components/parameters/ScimStartIndex'
        - $ref: '#/components/parameters/ScimCount'
      responses:
        '200':
          description: A ListResponse of User resources.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimList'
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
    post:
      tags: [scim]
      operationId: scimCreateUser
      summary: Creates a user. Needs an Idempotency-Key header and an externalId.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUser'
      responses:
        '201':
          description: The created user.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserResource'
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '413':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
  /scim/v2/Users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [scim]
      operationId: scimGetUser
      summary: Reads one user.
      security:
        - scimBearer: []
      responses:
        '200':
          description: The user.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserResource'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
    put:
      tags: [scim]
      operationId: scimReplaceUser
      summary: Replaces a user. active defaults to true when omitted. The externalId cannot change.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUser'
      responses:
        '200':
          description: The replaced user.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserResource'
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '413':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
    patch:
      tags: [scim]
      operationId: scimPatchUser
      summary: Applies add, replace and remove operations whose path is one of active, userName, displayName, externalId.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatch'
      responses:
        '200':
          description: The patched user.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserResource'
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '413':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
    delete:
      tags: [scim]
      operationId: scimDeactivateUser
      summary: Deactivates the user. Never hard-deletes.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deactivated. No body.
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
  /scim/v2/Groups:
    get:
      tags: [scim]
      operationId: scimListGroups
      summary: Lists the tenant's active group mappings as groups. Only an externalId filter matches anything.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/ScimFilter'
        - $ref: '#/components/parameters/ScimStartIndex'
        - $ref: '#/components/parameters/ScimCount'
      responses:
        '200':
          description: A ListResponse of Group resources.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimList'
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
    post:
      tags: [scim]
      operationId: scimCreateGroup
      summary: Sets the membership of a group the university administrator already mapped. Creates no new mapping.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
      responses:
        '201':
          description: The group with its new membership.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroupResource'
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '413':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
  /scim/v2/Groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [scim]
      operationId: scimGetGroup
      summary: Reads one group.
      security:
        - scimBearer: []
      responses:
        '200':
          description: The group.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroupResource'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
    put:
      tags: [scim]
      operationId: scimReplaceGroup
      summary: Replaces the membership of a group. The externalId cannot change.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
      responses:
        '200':
          description: The group with its new membership.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroupResource'
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '413':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
    patch:
      tags: [scim]
      operationId: scimPatchGroup
      summary: Applies operations whose path is one of displayName, externalId, members.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatch'
      responses:
        '200':
          description: The group with its new membership.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroupResource'
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '413':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
    delete:
      tags: [scim]
      operationId: scimEmptyGroup
      summary: Empties the group's membership. The administrator's mapping stays.
      security:
        - scimBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Emptied. No body.
        '400':
          $ref: '#/components/responses/ScimError'
        '401':
          $ref: '#/components/responses/ScimError'
        '404':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Supabase Auth access token. The gateway validates it over the network on every request.
    scimBearer:
      type: http
      scheme: bearer
      description: "A SCIM credential: the credential id (a UUID), a dot, then a secret of at least 32 characters from A-Z a-z 0-9 underscore hyphen."
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: 8 to 128 characters from A-Z a-z 0-9 dot underscore colon hyphen. Echoed on the response. A fresh UUID is minted when absent or malformed.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on registration-readiness commands and every SCIM request that is not a GET. At most 300 characters; an exact retry replays the durable receipt.
      schema:
        type: string
        maxLength: 300
    ScimFilter:
      name: filter
      in: query
      required: false
      description: 'Only: userName eq "value" or externalId eq "value". Anything else is a 400.'
      schema:
        type: string
        maxLength: 640
    ScimStartIndex:
      name: startIndex
      in: query
      required: false
      description: One-based. An invalid value becomes 1.
      schema:
        type: integer
        minimum: 1
    ScimCount:
      name: count
      in: query
      required: false
      description: Default 100, at most 200. An invalid value becomes 100.
      schema:
        type: integer
        minimum: 0
        maximum: 200
  responses:
    Envelope:
      description: The error envelope. error.code is one of the codes in ERRORS.md.
      headers:
        X-Request-Id:
          schema:
            type: string
        X-Correlation-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IntelligenceRefusal:
      description: The flat intelligence refusal {code, message}. The code is one of the intelligence codes in ERRORS.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntelligenceError'
    ScimError:
      description: A SCIM error message. There is no machine-readable code; the status and the detail sentence are the contract.
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimErrorBody'
  schemas:
    RegistrationReadinessReceipt:
      type: object
      required: [id, status, state, recordVersion, recordedAt, correlationId]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, completed]
        state:
          type: string
          enum: [requested, evaluating, ready, blocked, needs_review, unknown, stale, reconciling]
        recordVersion:
          type: integer
          minimum: 1
        recordedAt:
          type: string
          format: date-time
        correlationId:
          type: string
    ErrorEnvelope:
      type: object
      required: [error, message]
      properties:
        error:
          type: object
          required: [code, message, correlation_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
            retryable:
              type: boolean
              description: True only for 429 and 503.
            user_action:
              $ref: '#/components/schemas/UserAction'
        message:
          type: string
          description: The same sentence as error.message, for clients written before the envelope.
    UserAction:
      type: object
      required: [label, kind]
      properties:
        label:
          type: string
        kind:
          type: string
          enum: [external_link, open_screen, retry_later, contact_support]
        href:
          type: string
    IntelligenceError:
      type: object
      required: [code, message]
      description: The flat body the intelligence service returns. It is not wrapped in the envelope.
      properties:
        code:
          type: string
        message:
          type: string
    EntryError:
      type: object
      required: [error]
      description: The flat body the Vercel entry and start.ts return themselves, before or around the gateway.
      properties:
        error:
          type: string
    HealthLive:
      type: object
      required: [service, version, status]
      properties:
        service:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [live]
    Health:
      type: object
      required: [service, version, status, adapters, intelligence, readOnly]
      properties:
        service:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [ready, unavailable]
        adapters:
          type: integer
          description: How many adapters are installed. Not how many are healthy.
        intelligence:
          type: string
          enum: [policy-disabled, configured-sandbox, configured-production]
        readOnly:
          type: boolean
    SsoConfig:
      oneOf:
        - type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              enum: [false]
        - type: object
          required: [enabled, label, domain]
          properties:
            enabled:
              type: boolean
              enum: [true]
            label:
              type: string
            domain:
              type: string
    UniversityArea:
      type: string
      enum: [courses, assignments, assessments, grades, email, registration, advising, billing, aid, dining, housing, mailroom, transport, library, athletics, recreation, clubs, career, alumni, abroad, forms, records, admissions, orientation, graduate, research, international, accessibility, appeals, directory, graduation, family, support, health, safety, identity, admin]
    UniversityRole:
      type: string
      enum: [student, faculty, teaching_assistant, advisor, admin, staff, applicant, payer, family, alumni]
    ConnectionStatus:
      type: object
      required: [area, state, provider, canRead, canWrite, lastSyncAt, permissions, message]
      properties:
        area:
          $ref: '#/components/schemas/UniversityArea'
        state:
          type: string
          enum: [not-configured, connected, error, disconnected]
        provider:
          type: string
        canRead:
          type: boolean
        canWrite:
          type: boolean
        lastSyncAt:
          type: [string, 'null']
        permissions:
          type: array
          items:
            type: string
        message:
          type: string
    InstitutionStatus:
      type: object
      required: [version, institutionId, institutionName, roles, connections]
      properties:
        version:
          type: integer
        institutionId:
          type: string
        institutionName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UniversityRole'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionStatus'
    ActionField:
      type: object
      required: [id, label, kind, required]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [text, textarea, date, datetime-local, email, number, select]
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
    RecordAction:
      type: object
      required: [id, label, fields]
      properties:
        id:
          type: string
        label:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ActionField'
    UniversityRecord:
      type: object
      required: [id, area, title, summary, status, version, updatedAt, details, actions]
      properties:
        id:
          type: string
        area:
          $ref: '#/components/schemas/UniversityArea'
        title:
          type: string
        summary:
          type: string
        status:
          type: string
        version:
          type: string
          description: Send it back with any action on the record. A moved version is a 409 record_changed.
        updatedAt:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/LabelValue'
        dates:
          type: array
          items:
            type: object
            required: [at, what]
            properties:
              at:
                type: string
              what:
                type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/RecordAction'
    LabelValue:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
    RecordPage:
      type: object
      required: [records, nextCursor, fetchedAt]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/UniversityRecord'
        nextCursor:
          type: [string, 'null']
        fetchedAt:
          type: string
    ActionInput:
      type: object
      required: [area, recordId, version, actionId, fields]
      properties:
        area:
          $ref: '#/components/schemas/UniversityArea'
        recordId:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          minLength: 1
          maxLength: 200
        actionId:
          type: string
          minLength: 1
          maxLength: 200
        fields:
          type: object
          description: At most 30 entries. Keys match ^[a-zA-Z][a-zA-Z0-9_-]{0,63}$. Values are strings of at most 20000 characters. Every key must be a field of the action.
          additionalProperties:
            type: string
            maxLength: 20000
    Review:
      type: object
      required: [id, title, details, expiresAt]
      properties:
        id:
          type: string
        title:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/LabelValue'
        expiresAt:
          type: string
    CommitRequest:
      type: object
      required: [reviewId, confirmed]
      properties:
        reviewId:
          type: string
        confirmed:
          type: boolean
          enum: [true]
          description: Only the JSON value true counts.
    ReconcileRequest:
      type: object
      required: [reviewId]
      properties:
        reviewId:
          type: string
    Receipt:
      type: object
      required: [id, status, message, recordedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [completed, pending]
        message:
          type: string
        recordedAt:
          type: string
    IntelligencePolicy:
      type: object
      required: [state, allowedModes]
      properties:
        state:
          type: string
          enum: [off, preview, sandbox, production]
        allowedModes:
          type: array
          items:
            $ref: '#/components/schemas/IntelligenceMode'
    IntelligenceMode:
      type: string
      enum: [explain, hint, practice, review, draft]
    IntelligenceAction:
      type: object
      required: [id, label, effect, target, class, reversible, evidenceIds]
      properties:
        id:
          type: string
        label:
          type: string
        effect:
          type: string
        target:
          type: string
        class:
          type: string
          enum: [prepare, internal-write, consequential]
        reversible:
          type: boolean
        evidenceIds:
          type: array
          items:
            type: string
        preparedAt:
          type: string
        expiresAt:
          type: string
    IntelligenceRequest:
      type: object
      required: [version, clientState, tenantId, personId, question, mode, category, sourceIds, evidenceIds, proposedActions]
      properties:
        version:
          type: integer
          enum: [1]
        clientState:
          type: string
          enum: [off, preview, sandbox, production]
          description: Informational. The gateway always loads the policy on the server.
        tenantId:
          type: string
        personId:
          type: string
        question:
          type: string
          maxLength: 10000
        mode:
          $ref: '#/components/schemas/IntelligenceMode'
        category:
          type: string
        agent:
          type: string
          enum: [assistant, advisor, tutor, course-guide]
        courseId:
          type: string
        term:
          type: string
          pattern: '^[0-9]{4}(FA|SP|SU)$'
        sourceIds:
          type: array
          maxItems: 100
          items:
            type: string
        evidenceIds:
          type: array
          maxItems: 200
          items:
            type: string
        proposedActions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/IntelligenceAction'
    IntelligenceResponse:
      type: object
      required: [version, text, agent, sourceIds, evidenceIds, mode, route, usage, actions]
      properties:
        version:
          type: integer
        text:
          type: string
        agent:
          type: string
        sourceIds:
          type: array
          items:
            type: string
        evidenceIds:
          type: array
          items:
            type: string
        mode:
          $ref: '#/components/schemas/IntelligenceMode'
        route:
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
        usage:
          type: object
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer
            estimatedCents:
              type: number
        actions:
          type: array
          items:
            $ref: '#/components/schemas/IntelligenceAction'
    IntelligenceConfirm:
      type: object
      required: [confirmed, at]
      properties:
        confirmed:
          type: boolean
          enum: [true]
        at:
          type: string
          description: ISO time of the confirmation. It must be no more than five minutes old and not in the future.
    ActionReceipt:
      type: object
      required: [id, actionId, status, message, recordedAt, authoritative]
      properties:
        id:
          type: string
        actionId:
          type: string
        status:
          type: string
          enum: [completed, pending]
        message:
          type: string
        recordedAt:
          type: string
        authoritative:
          type: boolean
          enum: [true]
    ScimErrorBody:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items:
            type: string
        status:
          type: string
          description: The HTTP status as a string.
        detail:
          type: string
    ScimUser:
      type: object
      required: [schemas, userName]
      properties:
        schemas:
          type: array
          items:
            type: string
        externalId:
          type: string
          maxLength: 300
        userName:
          type: string
          maxLength: 300
        displayName:
          type: string
          maxLength: 300
        active:
          type: boolean
          description: Defaults to true when omitted.
    ScimUserResource:
      type: object
      required: [schemas, id, userName, active, meta]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        externalId:
          type: string
        userName:
          type: string
        displayName:
          type: string
        active:
          type: boolean
        meta:
          $ref: '#/components/schemas/ScimMeta'
    ScimMember:
      type: object
      required: [value]
      properties:
        value:
          type: string
        display:
          type: string
    ScimGroup:
      type: object
      required: [schemas, displayName]
      properties:
        schemas:
          type: array
          items:
            type: string
        externalId:
          type: string
        displayName:
          type: string
        members:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ScimMember'
    ScimGroupResource:
      type: object
      required: [schemas, id, displayName, members, meta]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        externalId:
          type: string
        displayName:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/ScimMember'
        meta:
          $ref: '#/components/schemas/ScimMeta'
    ScimMeta:
      type: object
      properties:
        resourceType:
          type: string
        created:
          type: string
        lastModified:
          type: string
        location:
          type: string
    ScimPatch:
      type: object
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
        Operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [op, path]
            properties:
              op:
                type: string
                enum: [add, replace, remove]
              path:
                type: string
                enum: [active, userName, displayName, externalId, members]
              value: {}
    ScimList:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            type: object

      responses:
        '202':
          description: The durable requested receipt, or the same receipt for an exact retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationReadinessReceipt'
        '400':
          $ref: '#/components/responses/Envelope'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          $ref: '#/components/responses/Envelope'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '422':
          $ref: '#/components/responses/Envelope'
        '429':
          $ref: '#/components/responses/Envelope'
        '503':
          $ref: '#/components/responses/Envelope'
  /v1/registration-readiness/evaluations/{id}/evaluate:
    post:
      tags: [registration-readiness]
      operationId: evaluateRegistrationReadiness
      summary: Evaluates approved evidence for the current student's durable evaluation.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}
    get:
      tags: [intelligence]
      operationId: getIntelligencePolicy
      summary: The caller's Semester Intelligence policy state. Policy-disabled unless server-side provider requirements are all configured.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The tenant policy state and the allowed modes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligencePolicy'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          description: Either the error envelope (identity) or the flat intelligence refusal (policy).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '429':
          $ref: '#/components/responses/Envelope'
        '503':
          description: Either the error envelope (no intelligence service configured) or the flat refusal ai-generation-killed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
  /v1/intelligence/respond:
    post:
      tags: [intelligence]
      operationId: respondIntelligence
      summary: A governed model response over institution-approved sources. Refused unless the server policy allows it.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntelligenceRequest'
      responses:
        '200':
          description: The answer, its cited sources, its cost and the proposed actions it prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceResponse'
        '400':
          description: Flat intelligence refusal (invalid-request) or the error envelope (invalid JSON).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          description: Flat intelligence refusal, or the error envelope (identity).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '429':
          description: Flat intelligence refusal budget-exhausted, or the error envelope rate_limited.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '503':
          description: Flat intelligence refusal, or the error envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
  /v1/intelligence/actions/{id}/confirm:
    post:
      tags: [intelligence]
      operationId: confirmIntelligenceAction
      summary: Confirms an action proposed by /v1/intelligence/respond. In the shipped runtime it can never produce a receipt.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntelligenceConfirm'
      responses:
        '200':
          description: An authoritative receipt. The shipped runtime never reaches this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionReceipt'
        '401':
          $ref: '#/components/responses/Envelope'
        '403':
          description: Flat intelligence refusal scope-refused, or the error envelope (identity).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/IntelligenceError'
        '404':
          $ref: '#/components/responses/IntelligenceRefusal'
        '409':
          $ref: '#/components/responses/IntelligenceRefusal'
        '413':
          $ref: '#/components/responses/Envelope'
        '415':
          $ref: '#/components/responses/Envelope'
        '429':
          $ref: '#/components/responses/Envelope'
        '502':
          $ref: '#/components/responses/IntelligenceRefusal'
        '503':
          $ref: '#/components/responses/Envelope'
  /scim/v2/ServiceProviderConfig:
    get:
      tags: [scim]
      operationId: scimGetServiceProviderConfig
      summary: SCIM discovery. Patch yes, bulk no, filter yes (200), sort no, etag no, change password no.
      security:
        - scimBearer: []
      responses:
        '200':
          description: The fixed service provider configuration.
          content:
            application/scim+json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
  /scim/v2/Schemas:
    get:
      tags: [scim]
      operationId: scimListSchemas
      summary: SCIM discovery. Lists the two schema ids as bare ids.
      security:
        - scimBearer: []
      responses:
        '200':
          description: A ListResponse of two ids.
          content:
            application/scim+json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/ScimError'
        '429':
          $ref: '#/components/responses/ScimError'
        '503':
          $ref: '#/components/responses/ScimError'
  /scim/v2/ResourceTypes:
    get:
      tags: [scim]
      operationId: scimListResourceTypes
      summary: SCIM discovery. Lists User and Group.
      security:
        - scimBearer: []
      responses:
        '200':
