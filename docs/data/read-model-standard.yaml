# Read-model governance: no screen may present a stale projection as live authority.
read_models:
  requirements:
    - every_projection_has_source_version
    - every_projection_has_observed_at
    - every_projection_has_freshness_state
    - every_projection_has_tenant_id
    - every_projection_has_correlation_id
    - every_projection_has_rebuild_strategy
    - every_projection_has_authority_descriptor

  # Two stored vocabularies exist. Do not assume one is universal.
  #   Console runtime (app/src/lib/console/client.ts): fresh, stale, failed, unknown.
  #     Any other value is read as unknown.
  #   Registration readiness (packages/institution/src/readiness.ts): current,
  #     updating, blocked, degraded, reconciling, stale.
  # Crosswalk, PROPOSED and not yet approved. A screen must map a value explicitly
  # before it renders that value. `updating` is never a stored console value; it is
  # a UI overlay.
  readiness_crosswalk:
    status: proposed
    mapping:
      current: fresh
      stale: stale
      blocked: failed
      degraded: stale
    overlay:
      updating_overlay:
        from: [updating, reconciling]
  UI_rules:
    fresh:
      behavior: show_available_action_when_policy_allows
    updating_overlay:
      behavior: show_updating_state_and_prevent_unsafe_assumption
    stale:
      behavior: show_stale_state_and_block_definitive_outcome
    failed:
      behavior: show_safe_fallback_and_handoff
    unknown:
      behavior: avoid_claim_and_offer_review_or_refresh

  rebuild:
    requirements:
      - replay_safe
      - idempotent
      - tenant_scoped
      - auditable
      - reconciliation_after_rebuild
