 const ac=LS('sem-acad');if(ac){(ac.orders||[]).filter(o=>o.st!=='Sent').forEach(o=>add('student','Transcript '+o.id+' — '+o.st,'Records','/app/today',['student',2]));(ac.exc||[]).filter(x=>x.st==='Pending registrar').forEach(x=>add('registrar','Exception: '+x.t,'Awaiting registrar decision','/registrar',['registrar',1]))}

 const r51=LS('sem-roles51');if(r51&&(r51.pending||[]).length)add('institution',r51.pending.length+' permission change(s) need a second approver','Roles & access','/console',['institution',1]);
 const pl=LS('sem-pilot-launch');if(pl){const req=Object.entries(pl.act||{}).filter(([,a])=>a.st==='requested');req.forEach(([k])=>add('operations','Activation of '+k+' awaits second approver','Pilot launch control','/ops',['operations',3]))}
 const sl=LS('sem-slack-mock');if(sl&&sl.req&&sl.req.st==='pending')add('registrar','Grade release GR-2210 awaiting approval','Faculty request (also in Slack)','/registrar',['registrar',0]);
 add('operations','11 shared blockers open','Completion kit','/ops',['operations',5]);
 return out}
function acDraw(){const it=acItems();document.getElementById('acn').textContent=it.length;const l=document.getElementById('acl');if(!l)return;l.innerHTML=it.length?it.map((x,i)=>'<button class="btn" data-ac="'+i+'" style="display:grid;gap:2px;width:100%;box-sizing:border-box;margin-bottom:6px;text-align:left"><b style="font-size:13px">'+esc(x.t)+'</b><span class="muted" style="font-size:12px">'+esc(WS.find(w=>w[0]===x.ws)[1])+' · '+esc(x.why)+'</span></button>').join(''):'<div class="muted">Nothing needs you right now.</div>';l.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{const x=it[+b.dataset.ac];S.sub[x.sub[0]]=x.sub[1];save();document.getElementById('aco').style.display='none';if(location.hash.slice(1)===x.h)draw();else location.hash=x.h})}
function gsIndex(){const out=[];WS.forEach(w=>{if(!granted(w[0]))return;out.push({t:w[1],s:'Workspace',h:w[2],off:!enabled(w[0])});w[4].forEach((x,i)=>out.push({t:x[0],s:w[1],h:w[2],sub:[w[0],i],off:!enabled(w[0])}))});if(granted('library')&&LIB)LIB.forEach(c=>out.push({t:c.name,s:'Library · '+c.group,h:'/library/'+c.path}));return out}
let GSel=0;function gsOpen(){if(granted('library')&&!LIB)fetch('../../_ds_manifest.json').then(r=>r.json()).then(m=>{LIB=m.cards.filter(c=>!/index-standalone/.test(c.path));gsRun()}).catch(()=>{});const o=document.getElementById('gso');o.style.display='block';const i=document.getElementById('gsi');i.value='';GSel=0;gsRun();i.focus()}
function gsClose(){document.getElementById('gso').style.display='none';document.getElementById('gsb').focus()}
function gsRun(){const q=document.getElementById('gsi').value.toLowerCase().trim();const R=gsIndex().filter(x=>!q||(x.t+' '+x.s).toLowerCase().includes(q)).slice(0,40);GSel=Math.min(GSel,Math.max(0,R.length-1));document.getElementById('gsr').innerHTML=R.length?R.map((x,i)=>'<div role="option" aria-selected="'+(i===GSel)+'" data-gi="'+i+'" style="padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;'+(i===GSel?'background:var(--surface-raised)':'')+'"><b style="font-size:14px">'+esc(x.t)+'</b><span class="muted" style="font-size:12px">'+esc(x.s)+(x.off?' · not enabled here':'')+'</span></div>').join(''):'<div class="muted" style="padding:12px">Nothing you can open matches.</div>';document.querySelectorAll('[data-gi]').forEach(e=>e.onclick=()=>gsGo(R[+e.dataset.gi]));window.__gsR=R}
function gsGo(x){if(!x)return;if(x.sub)S.sub[x.sub[0]]=x.sub[1];save();gsClose();if(location.hash.slice(1)===x.h)draw();else location.hash=x.h}
document.getElementById('gsb').onclick=gsOpen;document.getElementById('acb').onclick=()=>{acDraw();document.getElementById('aco').style.display='block';document.getElementById('acx').focus()};document.getElementById('acx').onclick=()=>{document.getElementById('aco').style.display='none';document.getElementById('acb').focus()};window.addEventListener('storage',acDraw);document.getElementById('gsi').oninput=()=>{GSel=0;gsRun()};document.getElementById('gsi').onkeydown=e=>{const R=window.__gsR||[];if(e.key==='ArrowDown'){e.preventDefault();GSel=Math.min(R.length-1,GSel+1);gsRun()}else if(e.key==='ArrowUp'){e.preventDefault();GSel=Math.max(0,GSel-1);gsRun()}else if(e.key==='Enter'){gsGo(R[GSel])}else if(e.key==='Escape')gsClose()};document.getElementById('gso').onclick=e=>{if(e.target.id==='gso')gsClose()};window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();gsOpen()}});
document.getElementById('lvb').onclick=()=>window.SEM_LIVE_OPEN();
window.addEventListener('sem-live',()=>{const L=window.SEM_LIVE,b=document.getElementById('lvb');b.textContent=L.on?'Live: '+L.user.email:'Live: off';b.className='btn'+(L.on?' p':'');document.getElementById('who').disabled=!!L.on;if(typeof draw==='function'){const hm=home();if(decodeURIComponent(location.hash.slice(1))===hm)draw();else location.hash=hm}});
window.addEventListener('hashchange',draw);if(!location.hash)location.hash=home();else draw();
</script></body></html>
