<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester platform</title>
<style>html,body{height:100%}body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.shell{display:grid;grid-template-rows:auto auto 1fr;height:100vh}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--surface-base);border-bottom:1px solid var(--border-subtle)}.brand{font-weight:700;font-size:17px;font-family:var(--font-display,inherit)}.ws{display:flex;gap:2px;flex:1 1 100%;order:2;flex-wrap:nowrap;overflow-x:auto}.ws a{padding:7px 11px;border-radius:6px;font-size:13px;text-decoration:none;color:var(--text-primary);white-space:nowrap}.bar label.f:first-of-type{margin-left:auto}.ws a[aria-current=page]{background:var(--surface-raised);font-weight:600}.ws a:focus-visible,.btn:focus-visible,.sub a:focus-visible{outline:2px solid var(--action-primary)}select,input{font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:2px;font-size:11px;color:var(--text-secondary)}.sub{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:6px 16px;border-bottom:1px solid var(--border-subtle);background:var(--surface-canvas);font-size:13px}.sub a{padding:4px 10px;border-radius:5px;text-decoration:none;color:var(--text-secondary)}.sub a[aria-current=true]{background:var(--action-primary);color:var(--text-on-action,#fff)}.route{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);margin-left:auto;display:flex;gap:6px;align-items:center}.route input{font-family:var(--font-mono);width:220px}.frame{border:0;width:100%;height:100%;display:block;background:var(--surface-canvas)}.state{max-width:620px;margin:48px auto;padding:24px;display:grid;gap:12px;text-align:center}.state h1{margin:0;font-size:24px}.muted{color:var(--text-secondary);font-size:13px}.btn{all:unset;cursor:pointer;padding:7px 14px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base);justify-self:center}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.demo{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--status-pending);color:#fff}.page{max-width:1200px;margin:0 auto;padding:20px 24px 48px;display:grid;gap:14px;overflow:auto}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px}table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.main{min-height:0;overflow:auto}</style></head>
<body><div class="shell"><div class="bar"><span class="brand">Semester</span><nav class="ws" id="ws" aria-label="Workspaces"></nav><label class="f">Institution<select id="ten"></select></label><label class="f">Term<select id="term"><option>Fall 2026</option><option>Spring 2027</option></select></label><label class="f">Signed in as <span class="demo">demo · non-production</span><select id="who"></select></label></div><div class="sub" id="sub"></div><div class="main" id="main"></div></div>
<script>
const K='../';
// workspace registry — single source for nav AND route gate
const WS=[
['public','Public web','/','—',[['Company site',K+'company-site/index.html'],['Create a Semester Account',K+'semester-account/index.html']],'Marketing','pilot'],
['student','Student OS','/app/today','workspace.student',[['Student app',K+'student/index.html'],['My courses',K+'course-workspace/index.html'],['Grades, degree & transcripts',K+'academic-records/index.html'],['Account & Mail',K+'semester-account/index.html'],['Marketplace, alumni, family, careers',K+'network/index.html'],['Study studio',K+'study-studio/index.html'],['Registration readiness',K+'readiness-pilot/index.html'],['Mobile',K+'mobile/index.html']],'Student product','pilot'],
['faculty','Faculty OS','/teach','workspace.faculty',[['Course Studio',K+'course-studio/index.html'],['Grading',K+'faculty-grading/index.html'],['Gradebook',K+'academic-records/index.html']],'Faculty product','controlled'],
['advisor','Advisor OS','/advise','workspace.advisor',[['Advisor workspace',K+'role-workspaces/index.html'],['Degree audit',K+'academic-records/index.html'],['Staff workspaces',K+'staff/index.html']],'Advising product','controlled'],
['registrar','Registrar OS','/registrar','workspace.registrar',[['Readiness console',K+'registrar-console/index.html'],['Records & transcripts',K+'academic-records/index.html']],'Registrar product','pilot'],
['finance','Finance OS','/finance','workspace.finance',[['Finance platform',K+'native-finance/index.html']],'Finance product','later'],
['student_affairs','Student Affairs OS','/support','workspace.student_affairs',[['Staff workspaces',K+'staff/index.html'],['Role workspaces',K+'role-workspaces/index.html'],['Student lifecycle',K+'student-lifecycle/index.html']],'Student affairs product','later'],
['institution','Institution console','/console','workspace.institution',[['Console',K+'console/index.html'],['Roles & access',K+'roles-access/index.html'],['Governance backbone',K+'governance-backbone/index.html'],['Control register','../../docs/drafts-review/controls.html'],['Audit workbench','../../docs/drafts-review/audit.html'],['Security Assurance Manual',K+'security-assurance/index.html']],'Platform','pilot'],
['company','Company OS','/company','workspace.company',[['Company console',K+'company-os/index.html'],['Business workspace',K+'business/index.html'],['Company workflows',K+'company-workflows/index.html'],['Company OS map',K+'company-os-map/index.html'],['Investor & board portal',K+'investor-portal/index.html']],'Founder','pilot-internal'],
['operations','Operations OS','/ops','workspace.operations',[['Operations inbox',K+'ops-inbox/index.html'],['Security Assurance Manual',K+'security-assurance/index.html'],['Operations consoles',K+'ops/index.html'],['Pilot launch control',K+'pilot-launch/index.html'],['Agent operations',K+'agent-ops/index.html'],['Completion register',K+'completion-register/index.html'],['Phase one',K+'phase-one/index.html'],['Capability blueprint',K+'capability-blueprint/index.html']],'Platform operations','pilot-internal'],
['external','External portals','/portal','workspace.external',[['External audiences',K+'external/index.html'],['Family, alumni, employers',K+'network/index.html'],['Board portal',K+'investor-portal/index.html']],'Partnerships','later'],
['developer','Developer portal','/developers','workspace.developer',[['Architecture',K+'architecture/index.html'],['Capability registry',K+'capability-registry/index.html'],['Data model',K+'data-model/index.html'],['Workflow runner',K+'workflow-runner/index.html'],['Native platform',K+'native-platform/index.html'],['Course Studio reference (Python)','../../handoff/developer-integration-pack/README.md'],['API catalog (14 observed routes)','../../handoff/launch-control-review/sortable-api-catalog.html'],['Launch control guide (patch)','../../handoff/launch-control-review/docs/launch-control-guide/README.md'],['Production integration review (patch)','../../handoff/production-integration-review/docs/production-integration/README.md'],['Slack app (sample)',K+'slack-integration/index.html'],['Governed workspace model',K+'governed-workspace/index.html']],'Platform','later'],
['community','Community & marketplace','/community','workspace.community',[['Community',K+'community/index.html'],['Marketplace & network',K+'network/index.html']],'Trust & safety','later'],
['library','Semester library','/library','internal.library',[],'Product + design','internal']];
const TEN={vu:['Vanderbilt University (pilot in discussion)',['public','student','faculty','advisor','registrar','institution','company','operations','external','community','library']],sandbox:['Semester Demo University (sandbox)',WS.map(w=>w[0])]};
// seeded personas: [key, name, role, grants]
const P=[['maya','Maya Chen','Student',['public','student','community']],['ortiz','Dr. R. Ortiz','Faculty',['public','faculty']],['brown','K. Brown','Academic advisor',['public','advisor']],['park','L. Park','Registrar staff',['public','registrar']],['singh','R. Singh','Student accounts staff',['public','finance']],['okafor','J. Okafor','Student affairs staff',['public','student_affairs']],['novak','D. Novak','Institutional IT',['public','institution']],['founder','Founder','Semester executive',['public','company','operations','library']],['rivera','A. Rivera','Semester support operator',['public','operations','library']],['dana','Dana Chen','Family/guardian',['public','external']],['dev','Priya Dev','Developer/partner',['public','developer','library']],['board','Board member','Investor / board',['public','external']],['anon','Not signed in','Visitor',['public']],['team','Semester team (design review)','Internal — every workspace',WS.map(w=>w[0])]];
const HOME=['student','faculty','advisor','registrar','finance','student_affairs','institution','operations','company','external','developer','community','library','public'];
const KEY='sem-platform';let S={who:'team',ten:'vu',sub:{},...JSON.parse(localStorage.getItem(KEY)||'{}')};const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const per=()=>P.find(p=>p[0]===S.who);const granted=k=>per()[3].includes(k);const enabled=k=>TEN[S.ten][1].includes(k);
const byRoute=r=>WS.slice().sort((a,b)=>b[2].length-a[2].length).find(w=>w[2]==='/'?r==='/':r===w[2]||r.startsWith(w[2]+'/'));
const home=()=>{const k=HOME.find(k=>granted(k)&&enabled(k)&&k!=='public')||'public';return WS.find(w=>w[0]===k)[2]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function route(){return decodeURIComponent(location.hash.replace(/^#/,''))||home()}
function draw(){const r=route();const w=r==='/routes'?null:byRoute(r);
 document.getElementById('who').innerHTML=P.map(p=>'<option value="'+p[0]+'"'+(p[0]===S.who?' selected':'')+'>'+p[1]+' — '+p[2]+'</option>').join('');
 document.getElementById('ten').innerHTML=Object.entries(TEN).map(([k,v])=>'<option value="'+k+'"'+(k===S.ten?' selected':'')+'>'+v[0]+'</option>').join('');
 document.getElementById('ws').innerHTML=WS.filter(x=>granted(x[0])).map(x=>'<a href="#'+x[2]+'"'+(w&&w[0]===x[0]?' aria-current="page"':'')+'>'+x[1]+(enabled(x[0])?'':' <span class="chip">off</span>')+'</a>').join('')+'<a href="#/routes"'+(r==='/routes'?' aria-current="page"':'')+'>Route registry</a>';
 const sub=document.getElementById('sub'),main=document.getElementById('main');
 const routeBox='<span class="route"><label for="ri">Route</label><input id="ri" value="'+esc(r)+'"><button class="btn" id="rg" style="padding:3px 10px">Go</button></span>';
 if(w&&w[0]==='library'&&granted('library')&&enabled('library')){sub.innerHTML='<b style="margin-right:6px">Semester library</b><span class="muted">Design specs, prototypes, documents and evidence — presence here doesn’t mean built or live.</span>'+routeBox;const path=r.replace(/^\/library\/?/,'');if(path){main.innerHTML='<iframe class="frame" title="Library: '+esc(path)+'" src="../../'+esc(path)+'"></iframe>';bindR();save();return}main.innerHTML='<div class="page" id="lib"><div class="muted">Loading…</div></div>';lib();bindR();save();return}
 if(r==='/routes'){sub.innerHTML=routeBox;main.innerHTML=vRoutes();bindR();save();return}
 if(!w){sub.innerHTML=routeBox;main.innerHTML='<div class="state"><h1>Page not found</h1><p class="muted">No workspace owns '+esc(r)+'.</p><a class="btn p" href="#'+home()+'">Go to your home</a></div>';bindR();return}
 if(!granted(w[0])){sub.innerHTML=routeBox;main.innerHTML='<div class="state"><span class="chip bad" style="justify-self:center">403 · blocked on the server</span><h1>You don’t have access to '+esc(w[1])+'</h1><p class="muted">'+esc(per()[1])+' ('+esc(per()[2])+') has no live grant for <span class="mono">'+w[3]+'</span>. Nothing from this workspace was loaded. Ask your institution administrator if you think you need it.</p><a class="btn p" href="#'+home()+'">Go to your home</a></div>';bindR();return}
 if(!enabled(w[0])){sub.innerHTML=routeBox;main.innerHTML='<div class="state"><span class="chip warn" style="justify-self:center">Not enabled</span><h1>'+esc(w[1])+' isn’t enabled for '+esc(TEN[S.ten][0].replace(/ \(.*\)/,''))+'</h1><p class="muted">Your access is fine; this institution hasn’t turned the workspace on. No sample data is shown in its place.</p><p class="muted">Rollout state: '+w[6]+' · owner: '+w[5]+'</p><a class="btn" href="#'+home()+'">Back to your home</a></div>';bindR();return}
 const i=Math.min(S.sub[w[0]]||0,w[4].length-1);sub.innerHTML='<b style="margin-right:6px">'+w[1]+'</b>'+w[4].map((s,k)=>'<a href="#'+w[2]+'" data-s="'+k+'" aria-current="'+(k===i)+'">'+s[0]+'</a>').join('')+'<span class="chip" style="margin-left:8px">'+({pilot:'Pilot','pilot-internal':'Pilot · internal',controlled:'Controlled expansion',later:'Later',internal:'Internal'})[w[6]]+'</span>'+routeBox;
 main.innerHTML='<iframe class="frame" title="'+esc(w[1]+' — '+w[4][i][0])+'" src="'+w[4][i][1]+'"></iframe>';
 document.querySelectorAll('[data-s]').forEach(a=>a.onclick=e=>{e.preventDefault();S.sub[w[0]]=+a.dataset.s;draw()});bindR();save()}
let LIB=null;const SEC=['Start here','Foundations','Components & patterns','Product domains','Roles & journeys','Screens & atlas','Architecture & data','Governance & trust','Company & operations','Documents & templates','Engineering & tooling','Delivery & maturity'];
function lib(){const go=()=>{const q=(S.lq||'').toLowerCase();const el=document.getElementById('lib');if(!el)return;const cards=LIB.filter(c=>!q||(c.name+' '+(c.subtitle||'')+' '+c.group).toLowerCase().includes(q));el.innerHTML='<div class="card"><div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap;justify-content:space-between"><div><h2 style="margin:0">Semester library</h2><div class="muted">'+LIB.length+' records in 12 sections · one canonical home each</div></div><label class="f">Search<input id="lq" value="'+esc(S.lq||'')+'" placeholder="e.g. registrar, consent, runway"></label></div></div>'+SEC.map(s=>{const cs=cards.filter(c=>c.group.split(' · ')[0]===s);return cs.length?'<div class="card"><h3 style="margin:0">'+s+' <span class="muted">· '+cs.length+'</span></h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">'+cs.map(c=>'<a href="#/library/'+encodeURI(c.path)+'" style="text-decoration:none;color:inherit;border:1px solid var(--border-subtle);border-radius:6px;padding:8px 10px;display:grid;gap:2px"><b style="font-size:13px">'+esc(c.name)+'</b>'+(c.group.includes(' · ')?'<span class="muted" style="font-size:11px">'+esc(c.group.split(' · ')[1])+'</span>':'')+'<span class="muted" style="font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(c.subtitle||'')+'</span></a>').join('')+'</div></div>':''}).join('')+(cards.length?'':'<div class="card muted">No records match.</div>');const i=document.getElementById('lq');i.oninput=()=>{S.lq=i.value;save();go();const j=document.getElementById('lq');j.focus();j.setSelectionRange(j.value.length,j.value.length)}};if(LIB)return go();fetch('../../_ds_manifest.json').then(r=>r.json()).then(m=>{LIB=m.cards.filter(c=>!/index-standalone/.test(c.path));go()}).catch(()=>{const el=document.getElementById('lib');if(el)el.innerHTML='<div class="state"><h1>Library index unavailable</h1><p class="muted">Couldn’t read the library manifest.</p></div>'})}
function vRoutes(){const rows=WS.map(w=>{const nav=granted(w[0]);const srv=granted(w[0]);return '<tr><td><b>'+w[1]+'</b><div class="muted mono">'+w[0]+'</div></td><td class="mono">'+w[2]+'</td><td class="mono">'+w[3]+'</td><td>'+w[5]+'</td><td>'+w[6]+'</td><td>'+(enabled(w[0])?'<span class="chip ok">on</span>':'<span class="chip">off</span>')+'</td><td>'+(srv?'<span class="chip ok">allow</span>':'<span class="chip bad">deny</span>')+'</td><td>'+(nav===srv?'✓':'<span class="chip bad">mismatch</span>')+'</td></tr>'}).join('');
 let checks=0,fails=0;P.forEach(p=>WS.forEach(w=>{checks++;const nav=p[3].includes(w[0]),srv=p[3].includes(w[0]);if(nav!==srv)fails++}));
 return '<div class="page"><div class="card"><h2 style="margin:0">Workspace route registry</h2><p class="muted" style="margin:0">One registry drives both the switcher and the route gate, so a link can’t appear for a workspace the server would refuse. Columns reflect '+esc(per()[1])+' at '+esc(TEN[S.ten][0])+'.</p><table><thead><tr><th>Workspace</th><th>Route</th><th>Permission</th><th>Owner</th><th>Rollout</th><th>Tenant</th><th>Server gate</th><th>Nav = gate</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="card"><h3 style="margin:0">verify-workspace-routes</h3><div class="'+(fails?'bad':'ok')+'">'+checks+' persona × workspace checks · '+fails+' mismatches</div><span class="muted">Demo personas are seeded for non-production only. In production, grants come from memberships and are re-checked on every request.</span></div></div>'}
function bindR(){const g=document.getElementById('rg'),i=document.getElementById('ri');if(g)g.onclick=()=>{location.hash=i.value.trim()||'/'};if(i)i.onkeydown=e=>{if(e.key==='Enter')location.hash=i.value.trim()||'/'}}
document.getElementById('who').onchange=e=>{S.who=e.target.value;save();const hm=home();if(decodeURIComponent(location.hash.slice(1))===hm)draw();else location.hash=hm};
document.getElementById('ten').onchange=e=>{S.ten=e.target.value;save();draw()};
window.addEventListener('hashchange',draw);if(!location.hash)location.hash=home();else draw();
</script></body></html>
