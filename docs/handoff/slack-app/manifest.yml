display_information:
  name: Semester
  description: Deadlines, approvals and alerts from Semester. Semester stays the system of record.
  background_color: "#416180"
features:
  bot_user:
    display_name: Semester
    always_online: false
  slash_commands:
    - command: /semester
      url: https://YOUR-HOST/slack/events
      description: Look up your deadlines, holds and requests (answers privately)
      usage_hint: "due | holds | requests | link | help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR-HOST/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
