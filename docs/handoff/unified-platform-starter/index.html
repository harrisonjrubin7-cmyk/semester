<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semester | Local platform starter</title>
<style>:root{--ink:#090a0e;--paper:#f4f1ea;--blue:#416180}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#20242b;font:16px/1.55 system-ui}header{background:var(--ink);color:white;padding:16px 24px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,input,textarea,select{font:inherit;border:1px solid #88939f;border-radius:6px;padding:10px}button{background:var(--blue);color:white;cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #416180;outline-offset:3px}main{max-width:1150px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:#fbf9f4;border:1px solid #b8b7b2;border-radius:6px;padding:20px;margin-bottom:16px}label{display:block;margin:14px 0}input:not([type=checkbox]),textarea{display:block;width:100%;background:white}textarea{min-height:110px}.tag{font-size:13px;border:1px solid #a0a3a9;padding:3px 6px}.notice{border-left:4px solid #416180;padding:12px;background:#e5eaf0}.metric{font-size:30px}#message{min-height:30px}@media(max-width:600px){main{padding:14px}nav button{flex:1}header{padding:14px}}
</style><header>SEMESTER · One connected workspace <span class="tag">Local sample demo</span><nav id="nav"></nav></header><main><p class="notice">Not a production service. No identity, tenant isolation, OS permission control, official records or real AI. Do not enter sensitive data.</p><div id="message" role="status" aria-live="polite"></div><section id="view"></section></main>
<script>const token='__TOKEN__';let state,page='Command center';const pages=['Command center','Course Studio','Device & privacy','Board update'];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const amount=x=>x===null?'Not supplied':new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(x);async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Demo-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error);return d}async function command(action,payload){try{state=await request('/api/command',{action,payload});render();document.querySelector('#message').textContent='Saved locally. Not transmitted to an institution.'}catch(e){document.querySelector('#message').textContent=e.message}}
function field(id,title,value,type='text'){return `<label>${title}<input id="${id}" type="${type}" value="${esc(value)}"></label>`}function render(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button data-page="${p}" aria-current="${p===page?'page':'false'}">${p}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});let h=`<h1>${page}</h1>`;
if(page==='Command center'){h+='<p>One shell; distinct personal, institution and company contexts. Context separation is illustrative here, not authorization.</p><div class="grid">';for(const t of state.tasks)h+=`<article class="card"><span class="tag">${esc(t.context)} · Sample</span><h2>${esc(t.title)}</h2><p>${esc(t.status)}</p>${t.status==='open'?`<button data-task="${t.id}">Complete sample task</button>`:''}</article>`;h+='</div><article class="card"><h2>Recent local events</h2>'+state.audit.map(a=>`<p>${esc(a.action)} · ${esc(a.time)}</p>`).join('')+'</article>'}
if(page==='Course Studio'){const c=state.course;h+=`<p>Faculty authoring demo · Student preview · no submissions or official gradebook.</p><article class="card"><span class="tag">Sample · ${esc(c.status)} · version ${c.version}</span>${field('title','Course title',c.title)}${field('assignment','Assignment title',c.assignment)}<label>Course AI rule<textarea id="ai">${esc(c.ai_policy)}</textarea></label><button id="save-course">Save draft</button> <button id="publish">Publish sample course</button></article><article class="card"><h2>Student preview</h2><p>${c.status==='published'?esc(c.assignment):'No published assignment in this sample course.'}</p><p>Publication changes only the local demo. Real release requires audience, timing, accessibility and policy checks.</p></article>`}
if(page==='Device & privacy'){h+='<article class="card"><h2>Local preference controls</h2>';for(const [k,label] of [['notifications','Notification preference'],['location','Location preference'],['family_sharing','Family-sharing preference']])h+=`<label><input id="${k}" type="checkbox" ${state.privacy[k]?'checked':''}> ${label}</label>`;h+='<button id="save-privacy">Save local preferences</button><p>These switches do not request browser/OS permissions, share records, or revoke real sessions. Production consent and permission controls are specified in the README.</p></article>'}
if(page==='Board update'){const b=state.board;h+=`<article class="card">${field('period','Reporting period',b.period)}<label>Management narrative<textarea id="summary">${esc(b.summary)}</textarea></label>${field('cash','Unrestricted cash — unverified input',b.cash,'number')}${field('burn','Historical monthly net operating burn',b.burn,'number')}${field('reserve','Minimum operating reserve',b.reserve,'number')}<button id="save-board">Save reporting draft</button> <button id="print">Print briefing</button></article><div class="grid"><article class="card"><h2>Cash</h2><p class="metric">${amount(b.cash)}</p></article><article class="card"><h2>Static runway</h2><p>${b.cash===null||b.burn===null?'Not supplied':b.burn<=0?'Not meaningful':(b.cash/b.burn).toFixed(1)+' months'}</p><p>Historical estimate; not a forward forecast.</p></article></div><article class="card"><h2>Sample risks</h2>${state.risks.map(r=>`<p>${esc(r.title)} · score ${r.likelihood*r.impact} · ${esc(r.owner)} · Sample</p>`).join('')}</article>`}
document.querySelector('#view').innerHTML=h;document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>command('task.complete',{id:b.dataset.task}));const val=id=>document.getElementById(id).value;
if(page==='Course Studio'){document.querySelector('#save-course').onclick=()=>command('course.save',{title:val('title'),assignment:val('assignment'),ai_policy:val('ai')});document.querySelector('#publish').onclick=()=>{if(confirm('Publish the saved sample course locally? Unsaved edits are not included.'))command('course.publish',{version:state.course.version})}}
if(page==='Device & privacy')document.querySelector('#save-privacy').onclick=()=>command('privacy.save',Object.fromEntries(['notifications','location','family_sharing'].map(k=>[k,document.getElementById(k).checked])));
if(page==='Board update'){document.querySelector('#save-board').onclick=()=>command('board.save',{period:val('period'),summary:val('summary'),...Object.fromEntries(['cash','burn','reserve'].map(k=>[k,val(k)===''?null:Number(val(k))]))});document.querySelector('#print').onclick=()=>window.print()}}
request('/api/state').then(s=>{state=s;render()}).catch(e=>document.querySelector('#message').textContent=e.message);</script></html>
