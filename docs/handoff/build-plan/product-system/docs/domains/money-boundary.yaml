money:
  phase_1: {placement: embedded, features: [institution_billing_summary_when_approved, due_date_reminders, official_payment_portal_handoff, payment_receipt_link]}
  phase_2: {placement: native_or_adapter_backed, features: [payment_initiation, payment_status_receipts, refunds_workflow, finance_reconciliation, plan_and_subscription_billing_for_semester_customers]}
  hard_boundaries:
    - Semester does not determine financial aid eligibility.
    - Semester does not alter an institutional student-account balance without an approved command path.
    - Payment status distinguishes pending, authorized, settled, failed, refunded and disputed.
  payment_states: [created, awaiting_customer_action, authorized, settling, settled, failed, refunding, refunded, disputed, cancelled]
  refund_rule: only from settled
  note: campus-services prototype already models confirmation, settlement and ledger posting as separate facts
