<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semester staff wireframe</title><style>body{margin:0;font:16px system-ui;background:#f4f5f7;color:#17212b}header{padding:18px;background:white;border-bottom:1px solid #ddd}aside{padding:20px;background:#152331;color:white;width:230px}main{padding:28px;flex:1;min-width:0}.shell{display:flex;min-height:90vh}button,select{font:inherit;padding:10px;margin:5px;border:1px solid #aaa;border-radius:6px;cursor:pointer}aside button{display:block;width:100%;text-align:left}article{background:white;padding:20px;margin:18px 0;border:1px solid #ddd;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}small{display:block}.muted{color:#52616e}button:disabled{cursor:not-allowed} @media(max-width:700px){.shell{display:block}aside{width:auto}main{padding:15px}}</style><header>SEMESTER · Demo institution · Demo term <small>Local simulation only. All six roles are seeded demo grants; no real authorization or student data.</small></header><div class="shell"><aside><label for="role">Acting workspace</label><select id="role"></select><div id="nav"></div></aside><main id="main"></main></div><script>const roles={"Faculty": {"nav": ["Overview", "Courses", "Roster", "Grading", "Release center"], "task": "Review assessment results", "flow": ["Draft", "Faculty review", "Ready", "Released"]}, "TA": {"nav": ["Overview", "Assigned sections", "Submissions", "Questions"], "task": "Review delegated submissions", "flow": ["Assigned", "Draft feedback", "Faculty review", "Completed"]}, "Advisor": {"nav": ["Overview", "Caseload", "Plans", "Appointments"], "task": "Review student progression plan", "flow": ["Draft", "Student review", "Agreed", "Follow-up"]}, "Registrar": {"nav": ["Overview", "Records", "Holds", "Exceptions", "Publication"], "task": "Review registrar-owned hold", "flow": ["Active", "Evidence review", "Approved", "Released"]}, "Finance": {"nav": ["Overview", "Accounts", "Adjustments", "Refunds"], "task": "Review account adjustment", "flow": ["Draft", "Submitted", "Approved", "Posted"]}, "Student Affairs": {"nav": ["Overview", "Intake", "My cases", "Referrals", "Appointments"], "task": "Coordinate support referral", "flow": ["Intake", "Triage", "Assigned", "Active support", "Resolved"]}};let role='Student Affairs',page='Overview',state='default',step=0,escalation='Draft';const select=document.querySelector('#role');Object.keys(roles).forEach(r=>select.add(new Option(r,r)));select.value=role;select.onchange=()=>{role=select.value;page='Overview';step=0;state='default';render()};const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);function render(){const r=roles[role];document.querySelector('#nav').replaceChildren();r.nav.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{page=n;render()};document.querySelector('#nav').append(b)});document.querySelector('#main').innerHTML=`<h1>${esc(role)} / ${esc(page)}</h1><p class="muted">Scope: demo assigned records. Switch roles to inspect different navigation and authority.</p><label>Screen state <select id="state">${['default','loading','empty','error','forbidden','offline'].map(s=>`<option ${s===state?'selected':''}>${s}</option>`).join('')}</select></label><article id="record"></article><article><h2>Permission matrix</h2><table><tr><th>Role</th><th>Record scope</th><th>Consequential action</th></tr>${Object.keys(roles).map(k=>`<tr><td>${k}</td><td>${k==='Registrar'?'Authorized academic records':k==='Finance'?'Assigned accounts':k==='Student Affairs'?'Assigned cases':k==='Advisor'?'Assigned caseload':'Assigned courses / sections'}</td><td>${k==='TA'?'Draft only; escalate to Faculty':'Separate approval capability required'}</td></tr>`).join('')}</table></article><article><h2>Access escalation</h2><p id="esc">${escalation}</p><button id="request">Advance simulated request</button><small>Draft → Submitted → Manager review → Data-owner review → Approved → Active → Expired. No actual grant is created.</small></article>`;document.querySelector('#state').onchange=e=>{state=e.target.value;render()};const record=document.querySelector('#record');if(state==='default'){record.innerHTML=`<h2>${r.task}</h2><p>Demo record · No personal information</p><p>Workflow: ${r.flow.join(' → ')}</p><p>Current stage: ${r.flow[step]}</p><button id="advance" ${step===r.flow.length-1?'disabled':''}>${role==='TA'?'Advance delegated task':'Advance simulated workflow'}</button>`;document.querySelector('#advance').onclick=()=>{step++;render()}}else{record.textContent={loading:'Loading permitted records…',empty:'No assigned work. Check your assignment scope.',error:'Unable to load records. Retry by selecting default.',forbidden:'Access unavailable. Request scoped access below.',offline:'Offline. Changes are disabled; no sensitive records cached.'}[state]}document.querySelector('#request').onclick=()=>{const stages=['Draft','Submitted','Manager review','Data-owner review','Approved','Active','Expired'];escalation=stages[(stages.indexOf(escalation)+1)%stages.length];render()}}render();</script></html>
