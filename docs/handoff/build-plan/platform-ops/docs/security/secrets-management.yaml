secrets_management:
  principles:
    - No secrets in source control, client bundles, fixtures, screenshots or production logs.
    - Every secret is owned, scoped, rotated and auditable.
    - Production secrets are unavailable to preview and local environments.
    - Connector credentials are tenant-scoped where technically possible.
    - The Supabase service-role key exists only in server/edge-function secrets (the platform shell refuses it).
  secret_classes: [database_credentials, signing_keys, connector_credentials, webhook_signing_secrets, payment_provider_keys, email_and_notification_credentials, AI_provider_credentials, emergency_break_glass_credentials]
  required_metadata: [secret_id, owner, environment, tenant_scope_if_applicable, purpose, rotation_cadence, last_rotated_at, emergency_revocation_procedure]
  incident_trigger: [suspected_exposure, unauthorized_use, employee_or_vendor_access_change, connector_compromise]
  inventory_now: handoff/live-integration README lists SEMESTER_ALLOWED_ORIGINS, SEMESTER_APP_ORIGIN, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, POSTMARK_SERVER_TOKEN, SEMESTER_MAIL_FROM, per-connector secret_ref
