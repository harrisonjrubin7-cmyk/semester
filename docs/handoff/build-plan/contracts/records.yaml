      requires_audit: true
    source_requirements: [source_type, source_ref, observed_at, freshness_state]
    retention: { class: institution_policy_required, deletion: subject_to_legal_hold_and_contract }
  readiness_receipts:
    domain: registration_readiness
    owner: registrar_product
    authority: semester
    source_of_truth: workflow_receipt
    sensitivity: high
    tenant_scoped: true
    immutable: true
    allowed_roles:
      student: own_only
      registrar: tenant_scope
      operations: no_student_content
    write_path:
      commands: [readiness.evaluate, readiness.refresh, referral.create]
      client_writes: none        # all writes via command functions
      requires_policy: true
      requires_audit: true
    source_requirements: []
    retention: { class: institution_policy_required, deletion: subject_to_legal_hold_and_contract }
    required_copy:
      - "This receipt records your readiness check."
      - "It is not confirmation that you are enrolled."
  holds:
