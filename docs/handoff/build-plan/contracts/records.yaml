# records.yaml — record passports. Every pilot record needs owner, authority, sensitivity, readers, write path, source rules, retention.
records:
  readiness_cases:
    domain: registration_readiness
    owner: registrar_product
    authority: semester
    source_of_truth: derived_from_institution_sources
    sensitivity: high
    tenant_scoped: true
    immutable: false
    allowed_roles:
      student: own_only
      advisor: assigned_caseload_only
      registrar: tenant_scope
      institution_admin: audited_read
      operations: no_student_content
    write_path:
      commands: [readiness.evaluate, readiness.case.route, readiness.case.refresh]
      client_writes: none        # all writes via command functions
      requires_policy: true
      requires_audit: true
    source_requirements: [source_type, source_ref, observed_at, freshness_state]
    retention: { class: institution_policy_required, deletion: subject_to_legal_hold_and_contract }
  readiness_checks:
    domain: registration_readiness
    owner: registrar_product
    authority: semester
    source_of_truth: derived_from_institution_sources
    sensitivity: high
    tenant_scoped: true
    immutable: false
    allowed_roles:
      student: own_only
      advisor: assigned_caseload_only
      registrar: tenant_scope
      operations: no_student_content
    write_path:
