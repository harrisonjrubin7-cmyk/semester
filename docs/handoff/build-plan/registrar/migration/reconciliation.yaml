steps:
  - { id: R1, name: Freeze comparison scope, record: [institution, terms_and_historical_range, student_cohort_inclusion, object_types, source_snapshot_checkpoint, mapping_version, candidate_and_config, expected_exclusions] }
  - { id: R2, name: Verify source integrity, do: [confirm_extract_authorization, record_manifest_and_checksums, verify_extraction_time_and_completeness, validate_code_dictionaries, identify_missing_files_or_tables] }
  - { id: R3, name: Resolve identity, do: [preserve_source_lineage, match_authoritative_identifiers, validate_namespace, quarantine_ambiguous_links, inactive_historical_students_get_no_active_access, review_merges_and_splits] }
  - { id: R4, name: Validate relationships, check: [course_to_version, section_to_term_course, student_to_academic_context, enrollment_to_student_section, grade_to_course_attempt, program_to_catalog], pass: "Zero unexplained orphaned required relationships" }
  - { id: R5, name: Compare semantic records, compare: [enrollment_status_and_effective_date, grade_mode, attempted_earned_credits, official_grades_and_corrections, repeat_treatment, program_catalog_assignment, transfer_awards, credential_decisions], rule: "Normalized values, not raw formatting" }
  - { id: R6, name: Compare derived outputs, compare: [gpa, academic_standing, degree_audit_results, transcript_representation, enrollment_eligibility], rule: "A mismatch can be a mapping, policy, source or Semester defect — route to the owner" }
  - { id: R7, name: Verify access, as_real_roles: [correct_student, different_student, assigned_faculty, unassigned_faculty, registrar_specialist, company_operator, revoked_membership, different_institution], rule: "A privileged query returning correct counts doesn't prove RLS isolation" }
  - { id: R8, name: Resolve exceptions, each_records: [class_and_severity, affected_records, source_and_candidate_values, owner, permitted_repair, reviewer_decision, retest_result], rule: "Don't close a discrepancy because it's hard to explain" }
  - { id: R9, name: Catch up incrementally, do: [apply_changes_after_baseline, detect_duplicates_gaps_out_of_order, reconcile_changed_records, establish_final_handover_checkpoint] }
  - { id: R10, name: Obtain acceptance, by: registrar_and_data_owners, accepts: [scoped_reconciliation_report, exclusions, remaining_approved_exceptions, authority_transfer] }
