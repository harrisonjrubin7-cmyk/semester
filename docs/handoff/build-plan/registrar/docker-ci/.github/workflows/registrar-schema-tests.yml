name: Registrar schema regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registrar-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Run schema regression suite
        run: |
          set -o pipefail
          python -m unittest -v test_registrar_schemas.py 2>&1 | tee schema-tests.log
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --tag semester-registrar-schema:test .
      - name: Run isolated container tests
        run: >-
          docker run --rm --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          semester-registrar-schema:test
