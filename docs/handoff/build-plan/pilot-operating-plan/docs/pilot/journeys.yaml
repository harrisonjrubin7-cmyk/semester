student_journey:
  1_entry: {sees: [institution_context, term_context, clear_pilot_boundary, privacy_or_source_explanation], can: [begin_readiness_check, leave_and_return_later]}
  2_request: {sees: [selected_term_and_goal, request_explanation, not_enrollment_notice], can: [submit_one_scoped_evaluation]}
  3_evaluation: {sees: [checking_status, source_status_when_available, expected_next_step]}
  4_outcome: [ready, blocked, needs_review, unknown, stale, failed, cancelled]
  5_next_step: {ready: review_official_registration_process, blocked: view_blocker_and_route_to_correct_office, needs_review: confirm_handoff_or_wait_for_review, unknown: refresh_or_request_support, stale: refresh_or_check_institution_source, failed: retry_or_request_support, cancelled: restart_when_ready}
  6_receipt: [request_identifier, term_and_goal, outcome, source_and_freshness_context, timestamp, next_step, not_enrollment_statement]
  copy:   # passes the status-sentence lint (true · means · do)
    ready: "Ready to continue. The available institution information supports the next step shown here. This is not enrollment or confirmation of a seat. Review the institution's registration process before taking action."
    needs_review: "Needs review. We could not safely determine this result from the available information. Your request can be reviewed by the appropriate office."
    stale: "This information may be out of date. The source has not updated within its expected window. Refresh the connection, or check the institution's official page."
staff_workflow:
  queue_item: [case_id, student_identifier_as_authorized, cohort_and_term, evaluation_state, source_and_freshness_status, blocker_category_when_available, prior_student_actions, required_next_decision, SLA_or_review_target, audit_history]
  allow: [review, route, request_information, record_institutional_resolution_reference, mark_reconciled_when_authorized]
  do_not_allow: [impersonate_student, execute_enrollment, change_official_record, bypass_scope, close_without_reason, publish_unreviewed_outreach]
  completion_requires: [reason_or_resolution_code, next_step_for_student, actor_and_timestamp, linked_official_reference_when_available, audit_receipt]
