# registry/boundaries/capability-placement.yaml — generated from ui_kits/scale-system/scale-data.js (2026-10-14)
# Levels: 0 Framed · 1 Designed · 2 Contracted · 3 Built · 4 Verified · 5 Operated · 6 Repeatable · 7 Scalable
placement_options:
  native: "Semester owns the experience, workflow, record model, policy enforcement, audit and operational responsibility."
  connected: "Another system stays authoritative; Semester uses a versioned, governed connector and shows source authority."
  embedded: "Semester provides the entry point and continuity; the action is completed in an approved external experience."
  external: "Semester neither stores nor mediates the process beyond an optional non-authoritative link or explanation."
capabilities:
