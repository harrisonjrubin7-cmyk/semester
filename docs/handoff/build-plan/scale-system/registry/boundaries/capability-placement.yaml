    semester_may_not: "Claim readiness equals enrollment; override a hold"
    evidence: "Contracts, policies and acceptance tests drafted (handoff/build-plan/wave-1, pilot assurance); repo has server code not release-ready"
    next_proof: "Approved schemas + source-authority register signed by registrar"
