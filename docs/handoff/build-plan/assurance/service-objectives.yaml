# Internal operating targets, not external guarantees. Targets are set per tenant/source and recorded with the approval.
service_objectives:
  - { id: SLO-READINESS-001, service: readiness_evaluation, measure: "Requests ending in a receipt or safe review state", target: tenant_approved_target, window: rolling_30_days, exclusions: [institution_planned_maintenance, approved_cohort_blackout] }
  - { id: SLO-SOURCE-001, service: source_freshness, measure: "Source-backed facts inside their approved freshness window", target: tenant_and_source_specific, window: rolling_7_days, on_breach: [show_stale_state, block_definitive_derived_outcome, notify_integration_owner, open_reconciliation_case_when_required] }
  - { id: SLO-WORKFLOW-001, service: durable_workflows, measure: "Jobs completed, safely reviewed or quarantined", target: internal_operating_target, window: rolling_30_days, on_breach: [alert_on_call, investigate_dead_letter_queue, assess_cohort_impact] }
  - { id: SLO-SUPPORT-001, service: support_handoff, measure: "High-priority pilot cases acknowledged via the agreed route", target: pilot_agreed_target, window: rolling_30_days, on_breach: [escalate_to_pilot_owner, review_staffing_and_routing] }
  - { id: SLO-ACCESS-001, service: authorization, measure: "Confirmed unauthorized restricted-record disclosures", target: 0, window: continuous, on_breach: [invoke_security_incident_process, suspend_affected_path_if_necessary] }
error_budget_policy:
  rule: "Over budget or repeatedly blocked → expansion pauses until the owner records diagnosis, remediation, test evidence and approval to resume."
  prohibited: ["Raise the target to close the issue", "Hide stale or unknown data to protect completion metrics", "Expand a cohort with critical findings open"]
