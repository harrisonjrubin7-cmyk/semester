# Partner and developer platform: open access only after internal contracts,
# tenant isolation, observability, revocation, and connector certification are stable.
developer_platform:
  stage_0_internal_only:
    items:
      - internal_contract_lab
      - synthetic_sandbox
      - API_schema_validation
      - internal_event_catalog

  stage_1_design_partners:
    requires_stage: stage_0_internal_only
    requires_all_of_stage_0: true
    items:
      - named_partner_agreement
      - scoped_sandbox_credential
      - approved_use_case
      - manual_access_review
      - audit_and_rate_limit_controls

  stage_2_limited_external:
    requires_stage: stage_1_design_partners
    requires_all_of_stage_1: true
    additional_requirements:
      - tenant_isolation_tests_passing
      - observability_active
      - connector_certification_at_validated_or_above
      - partner_agreement_per_application
      - approved_use_case_per_application
      - access_review_per_application
      - audit_controls_active
    # Production access needs every item in docs/PARTNER-AND-DEVELOPER-PROGRAM.md
    # "Production approval", recorded with evidence. Stage 2 is not sandbox-only.
    production_access: blocked_until_production_approval
    production_approval:
      - security_review
      - privacy_review
      - tenant_authorization_by_data_owning_institution
      - consent_model_if_data_class_requires_one
      - api_conformance_tests_passing
      - revocation_test
      - observability_and_rate_limits
    items:
      - self_service_documentation
      - scoped_application_registration
      - test_tenant
      - versioned_API
      - webhook_verification
      - revocation_and_support_process
    # Proposed default, not yet approved: these stay out of stage 2 entirely.
    still_forbidden_at_stage_2:
      - production_self_service_keys
      - unrestricted_event_subscriptions
      - access_to_restricted_student_data

  forbidden_before_stage_2:
    - production_self_service_keys
    - unrestricted_event_subscriptions
    - access_to_restricted_student_data
    - unreviewed_partner_apps
