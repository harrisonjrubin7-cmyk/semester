# Static analysis (SAST) of the TypeScript and JavaScript this repository ships.
#
# Everything else in CI asks whether the code does what its author meant:
# `tsc`, the suite, the SQL policy checks. None of it asks whether the code can
# be made to do something its author did not mean — an injection, an unsafe
# redirect, a regular expression an attacker can stall, a value from the
# request reaching a query. That is a different question and CodeQL is the
# tool asking it. HawkScan (`hawkscan.yml`) asks the matching question of the
# running app; this one asks it of the source, including the Edge Functions
# and the gateway that no browser-driven scan reaches.
#
# ## Where it runs, and why it can be skipped
#
# Code scanning uploads to the repository's Security tab, which GitHub offers
# free on public repositories and to private ones only with GitHub Advanced
# Security. On a plan without it the upload step fails, and a failure on every
# push would turn `main` red for a reason that is about billing and not code.
# So the job runs when the repository is public, or when the owner has set the
# Actions variable `CODEQL_ENABLED` to `true` after enabling it. Skipped is
# visible as skipped; it is not reported as a pass anywhere in `docs/`.
#
# ## What it is not
#
# It is not a penetration test and not an independent assessment, and a clean
# run says "CodeQL's default query suite found nothing it recognises" and no
# more. `docs/security/SECURITY-PROGRAM.md` holds the claim ceiling.

name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # A weekly run on main, because new queries ship without any commit here.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Read the code, and write results to the Security tab. Nothing else.
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          # `security-extended` adds the lower-precision security queries to
          # the default set. More to read, and the right trade for a codebase
          # that holds students' records.
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
