# Publish the app to GitHub Pages, so it is a real address on a phone rather
# than a dev server on a laptop.
#
# The site lands at https://<user>.github.io/<repo>/ — a subpath, not a root,
# which is why the build is given VITE_BASE and why nothing in the app reads a
# leading-slash path directly (see app/src/lib/asset.ts).
#
# It ships the audio too: ~200 MB of lessons and podcast editions, well inside
# the 1 GB Pages limit. The upload is the slow part of this job.

name: Deploy to Pages

# Only what CI has passed reaches students.
#
# This used to be `on: push: branches: [main]`, which is the same trigger CI
# has — two workflows watching one event, neither aware of the other. A commit
# that failed `tsc`, failed the suite or failed the policy checks deployed
# anyway, at the same moment CI was going red about it, and the site was live
# with it before anybody read the email. That is the whole of "we push straight
# to production": not the absence of a staging URL, but the absence of a gate.
#
# `workflow_run` is that gate. This waits for the CI run on `main` to finish
# and deploys only if it succeeded, so main's green tick is what publishes
# rather than the push. A red CI now means the last good deploy stays up.
#
# The cost is one indirection worth knowing about: a `workflow_run` job checks
# out the *default branch head* by default, not the commit that triggered it,
# so a deploy racing another merge would ship a different tree than the one CI
# checked. `head_sha` below pins it to the commit that actually passed.
#
# `workflow_dispatch` is unchanged and still deploys whatever is on main — the
# escape hatch for a deploy-only fix, and the reason the job's `if` names both.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']
  # So a deploy can be re-run without an empty commit, and so a deploy can be
  # forced past a red CI when somebody has decided to.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-way: an interrupted deploy
# can leave the site serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A completed CI run that failed still fires `workflow_run`, so the
    # conclusion is checked rather than the event. A hand-started deploy
    # carries no `workflow_run` at all, hence the first clause.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The commit CI passed, not whatever main has drifted to since. On a
      # `workflow_dispatch` there is no triggering run and this is empty,
      # which checks out the default branch — the intended behaviour for a
      # hand-started deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Pages has to be switched on by a person, once: Settings → Pages →
      # Build and deployment → Source: GitHub Actions. A workflow token is not
      # allowed to create the site ("Resource not accessible by integration"),
      # so asking it to would only fail on every run.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # Every setting this app reads at build time, offered to the deploy.
      #
      # For most of its life this step carried three of them — the Supabase
      # pair and the push key — and the other twelve had no way in at all. The
      # app reads all fifteen, `app/.env.example` documents them, and two of
      # those entries say in so many words that they are what a *deployed* copy
      # uses: the ICS forwarder ("a deployment points it at anything serving
      # the same one route") and the assistant proxy ("unlike it, it survives a
      # build, so this is the field a deployed copy uses"). Neither could be
      # set. The documentation described a configuration the deploy had no way
      # to apply.
      #
      # It went unnoticed because nothing breaks. Every one of them degrades
      # politely: no gateway and the University screen says no approved
      # connection has been configured; no client IDs and Connect offers the
      # file route instead of a sign-in; no TURN and the call screen says
      # plainly that some networks will refuse. A deployed copy therefore looks
      # like a working app with features switched off, which is exactly what it
      # would look like if somebody had switched them off on purpose.
      #
      # A repository *variable* wins over a *secret* of the same name, matching
      # the two that were already here. None of these is a secret in the strict
      # sense — anything named VITE_… is compiled into the page and handed to
      # everyone who loads the site — but Actions hides a secret's value in the
      # log, and a TURN credential is worth that even though the page carries
      # it anyway. The real secrets have no VITE_ prefix and are not here: the
      # Anthropic key belongs to whatever proxy VITE_CLAUDE_PROXY names, and
      # the private half of the VAPID pair belongs to the Edge Function.
      - name: Check the build inputs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY || secrets.VITE_SUPABASE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY || secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_UNIVERSITY_GATEWAY_URL: ${{ vars.VITE_UNIVERSITY_GATEWAY_URL || secrets.VITE_UNIVERSITY_GATEWAY_URL }}
          VITE_INSTITUTIONAL_PREVIEW: ${{ vars.VITE_INSTITUTIONAL_PREVIEW || secrets.VITE_INSTITUTIONAL_PREVIEW }}
          VITE_SEMESTER_INTELLIGENCE: ${{ vars.VITE_SEMESTER_INTELLIGENCE || secrets.VITE_SEMESTER_INTELLIGENCE }}
          VITE_JOURNEY_NAVIGATION: ${{ vars.VITE_JOURNEY_NAVIGATION || secrets.VITE_JOURNEY_NAVIGATION }}
          VITE_ADAPTIVE_LEARNING: ${{ vars.VITE_ADAPTIVE_LEARNING || secrets.VITE_ADAPTIVE_LEARNING }}
          VITE_CAREER_SKILLS_GRAPH: ${{ vars.VITE_CAREER_SKILLS_GRAPH || secrets.VITE_CAREER_SKILLS_GRAPH }}
          VITE_MULTIMODAL_CAPTURE: ${{ vars.VITE_MULTIMODAL_CAPTURE || secrets.VITE_MULTIMODAL_CAPTURE }}
          VITE_UNIVERSITY_CONTROL_PLANE: ${{ vars.VITE_UNIVERSITY_CONTROL_PLANE || secrets.VITE_UNIVERSITY_CONTROL_PLANE }}
          VITE_SUPPORT_TICKETS: ${{ vars.VITE_SUPPORT_TICKETS || secrets.VITE_SUPPORT_TICKETS }}
          # Read-only mode (docs/FEATURE-FLAG-REGISTRY.md): exactly `true` stops every push and shows the banner.
          VITE_READ_ONLY: ${{ vars.VITE_READ_ONLY || secrets.VITE_READ_ONLY }}
          # The environment word the operations console shows (lib/environment.ts): `staging` makes a build say so; anything else is production.
          VITE_DEPLOY_ENVIRONMENT: ${{ vars.VITE_DEPLOY_ENVIRONMENT || secrets.VITE_DEPLOY_ENVIRONMENT }}
          VITE_TODAY_ACTION_CENTER: ${{ vars.VITE_TODAY_ACTION_CENTER || secrets.VITE_TODAY_ACTION_CENTER }}
          VITE_REGISTRATION_DAY_MODE: ${{ vars.VITE_REGISTRATION_DAY_MODE || secrets.VITE_REGISTRATION_DAY_MODE }}
          VITE_GRADUATION_SIMULATOR: ${{ vars.VITE_GRADUATION_SIMULATOR || secrets.VITE_GRADUATION_SIMULATOR }}
          VITE_COST_PLANNER: ${{ vars.VITE_COST_PLANNER || secrets.VITE_COST_PLANNER }}
          VITE_ACADEMIC_LIFE_BALANCE: ${{ vars.VITE_ACADEMIC_LIFE_BALANCE || secrets.VITE_ACADEMIC_LIFE_BALANCE }}
          VITE_CRUNCH_WEEK_FORECAST: ${{ vars.VITE_CRUNCH_WEEK_FORECAST || secrets.VITE_CRUNCH_WEEK_FORECAST }}
          VITE_COURSE_DETAIL_V2: ${{ vars.VITE_COURSE_DETAIL_V2 || secrets.VITE_COURSE_DETAIL_V2 }}
          VITE_ADVISOR_MEETING_MODE: ${{ vars.VITE_ADVISOR_MEETING_MODE || secrets.VITE_ADVISOR_MEETING_MODE }}
          VITE_STUDY_READINESS: ${{ vars.VITE_STUDY_READINESS || secrets.VITE_STUDY_READINESS }}
          VITE_SOURCE_LOCKER: ${{ vars.VITE_SOURCE_LOCKER || secrets.VITE_SOURCE_LOCKER }}
          VITE_CAREER_EVIDENCE: ${{ vars.VITE_CAREER_EVIDENCE || secrets.VITE_CAREER_EVIDENCE }}
          VITE_OFFICE_ACTION_FEED: ${{ vars.VITE_OFFICE_ACTION_FEED || secrets.VITE_OFFICE_ACTION_FEED }}
          VITE_DEMAND_FORECASTING: ${{ vars.VITE_DEMAND_FORECASTING || secrets.VITE_DEMAND_FORECASTING }}
          VITE_SEMESTER_WRAPPED: ${{ vars.VITE_SEMESTER_WRAPPED || secrets.VITE_SEMESTER_WRAPPED }}
          VITE_OFFLINE_MODE: ${{ vars.VITE_OFFLINE_MODE || secrets.VITE_OFFLINE_MODE }}
          VITE_TRUST_CENTER: ${{ vars.VITE_TRUST_CENTER || secrets.VITE_TRUST_CENTER }}
          VITE_COURSE_STUDIO: ${{ vars.VITE_COURSE_STUDIO || secrets.VITE_COURSE_STUDIO }}
          VITE_PRIVATE_BETA: ${{ vars.VITE_PRIVATE_BETA || secrets.VITE_PRIVATE_BETA }}
          # The AI Toolkit's flags (app/src/lib/toolkit/flags.ts). Unset means off;
          # VITE_AI_TOOLKIT=off is the kill switch for all of them.
          VITE_AI_TOOLKIT: ${{ vars.VITE_AI_TOOLKIT || secrets.VITE_AI_TOOLKIT }}
          VITE_TOOLKIT_RESEARCH: ${{ vars.VITE_TOOLKIT_RESEARCH || secrets.VITE_TOOLKIT_RESEARCH }}
          VITE_TOOLKIT_DATA: ${{ vars.VITE_TOOLKIT_DATA || secrets.VITE_TOOLKIT_DATA }}
          VITE_TOOLKIT_DATA_UPLOAD: ${{ vars.VITE_TOOLKIT_DATA_UPLOAD || secrets.VITE_TOOLKIT_DATA_UPLOAD }}
          VITE_TOOLKIT_WORKBENCHES: ${{ vars.VITE_TOOLKIT_WORKBENCHES || secrets.VITE_TOOLKIT_WORKBENCHES }}
          VITE_TOOLKIT_DISCLOSURE: ${{ vars.VITE_TOOLKIT_DISCLOSURE || secrets.VITE_TOOLKIT_DISCLOSURE }}
          VITE_HUMAN_HELP: ${{ vars.VITE_HUMAN_HELP || secrets.VITE_HUMAN_HELP }}
          VITE_INTEGRATION_DASHBOARD: ${{ vars.VITE_INTEGRATION_DASHBOARD || secrets.VITE_INTEGRATION_DASHBOARD }}
          VITE_INSTITUTIONAL_OPERATIONS: ${{ vars.VITE_INSTITUTIONAL_OPERATIONS || secrets.VITE_INSTITUTIONAL_OPERATIONS }}
          # Whether a student may choose how dates and numbers are written (lib/locale.ts). Absent is off.
          VITE_ME_LANGUAGE: ${{ vars.VITE_ME_LANGUAGE || secrets.VITE_ME_LANGUAGE }}
          # Whether Pathway offers learner pathways and Registration offers when/format filters (lib/learner-pathways.ts). Absent is off.
          VITE_PATH_LEARNER_PATHWAYS: ${{ vars.VITE_PATH_LEARNER_PATHWAYS || secrets.VITE_PATH_LEARNER_PATHWAYS }}
          # Whether Behind offers "If something has changed" (lib/lifeevents.ts). Kept on the device, sent nowhere. Absent is off.
          VITE_ME_LIFE_EVENTS: ${{ vars.VITE_ME_LIFE_EVENTS || secrets.VITE_ME_LIFE_EVENTS }}
          # Whether optional one-question prompts are asked after a few moments, and What's new shows the "You said, we changed" panel (lib/momentfeedback.ts). Answers stay on the device. Absent is off.
          VITE_ME_MOMENT_FEEDBACK: ${{ vars.VITE_ME_MOMENT_FEEDBACK || secrets.VITE_ME_MOMENT_FEEDBACK }}
          VITE_COMMUNITY_FEED: ${{ vars.VITE_COMMUNITY_FEED || secrets.VITE_COMMUNITY_FEED }}
          VITE_COMMUNITY_REPORTING: ${{ vars.VITE_COMMUNITY_REPORTING || secrets.VITE_COMMUNITY_REPORTING }}
          VITE_MODERATION_CONSOLE: ${{ vars.VITE_MODERATION_CONSOLE || secrets.VITE_MODERATION_CONSOLE }}
          VITE_INSTITUTION_ESCALATION: ${{ vars.VITE_INSTITUTION_ESCALATION || secrets.VITE_INSTITUTION_ESCALATION }}
          VITE_VOLUNTEER_MODERATION: ${{ vars.VITE_VOLUNTEER_MODERATION || secrets.VITE_VOLUNTEER_MODERATION }}
          VITE_SCOPED_PSEUDONYMITY: ${{ vars.VITE_SCOPED_PSEUDONYMITY || secrets.VITE_SCOPED_PSEUDONYMITY }}
          # Whether Today runs the domain layer beside the Action Center and warns in the console where they differ (composition/shadow.ts). Draws nothing, changes nothing, sends nothing. Absent is off.
          VITE_TODAY_SHADOW: ${{ vars.VITE_TODAY_SHADOW || secrets.VITE_TODAY_SHADOW }}
          VITE_ACCOUNT_SAFETY_STATE: ${{ vars.VITE_ACCOUNT_SAFETY_STATE || secrets.VITE_ACCOUNT_SAFETY_STATE }}
          VITE_COMMUNITY_IMAGES: ${{ vars.VITE_COMMUNITY_IMAGES || secrets.VITE_COMMUNITY_IMAGES }}
          VITE_CAMPAIGN_MANAGER: ${{ vars.VITE_CAMPAIGN_MANAGER || secrets.VITE_CAMPAIGN_MANAGER }}
          VITE_MIGRATION_CENTER: ${{ vars.VITE_MIGRATION_CENTER || secrets.VITE_MIGRATION_CENTER }}
          VITE_WORKFLOW_BUILDER: ${{ vars.VITE_WORKFLOW_BUILDER || secrets.VITE_WORKFLOW_BUILDER }}
          VITE_CONFIGURATION_STUDIO: ${{ vars.VITE_CONFIGURATION_STUDIO || secrets.VITE_CONFIGURATION_STUDIO }}
          VITE_RECORD_LEDGER: ${{ vars.VITE_RECORD_LEDGER || secrets.VITE_RECORD_LEDGER }}
          VITE_STUDENT_ACCOUNTS: ${{ vars.VITE_STUDENT_ACCOUNTS || secrets.VITE_STUDENT_ACCOUNTS }}
          VITE_DOMAIN_TASKS: ${{ vars.VITE_DOMAIN_TASKS || secrets.VITE_DOMAIN_TASKS }}
          VITE_CLAUDE_PROXY: ${{ vars.VITE_CLAUDE_PROXY || secrets.VITE_CLAUDE_PROXY }}
          VITE_ICS_PROXY: ${{ vars.VITE_ICS_PROXY || secrets.VITE_ICS_PROXY }}
          # The shared key's monthly allowance, as the app *says* it. The cap
          # itself is MONTHLY_CALL_LIMIT on the Edge Function; this is the
          # number onboarding quotes, and `lib/allowance.test.ts` fails if the
          # two defaults drift. A deploy that raises one raises both.
          VITE_MONTHLY_CALL_LIMIT: ${{ vars.VITE_MONTHLY_CALL_LIMIT || secrets.VITE_MONTHLY_CALL_LIMIT }}
          VITE_OAUTH_PROXY: ${{ vars.VITE_OAUTH_PROXY || secrets.VITE_OAUTH_PROXY }}
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID || secrets.VITE_MS_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ZOOM_CLIENT_ID: ${{ vars.VITE_ZOOM_CLIENT_ID || secrets.VITE_ZOOM_CLIENT_ID }}
          VITE_APPLE_CLIENT_ID: ${{ vars.VITE_APPLE_CLIENT_ID || secrets.VITE_APPLE_CLIENT_ID }}
          VITE_STUN_URLS: ${{ vars.VITE_STUN_URLS || secrets.VITE_STUN_URLS }}
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL || secrets.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ vars.VITE_TURN_USER || secrets.VITE_TURN_USER }}
          VITE_TURN_PASS: ${{ vars.VITE_TURN_PASS || secrets.VITE_TURN_PASS }}
        run: |
          # Notices and warnings surface as run annotations, which are visible
          # without opening the log — and readable through the API, so a
          # misconfigured deploy can be diagnosed rather than guessed at.
          # Lengths, never values: "url: 0 chars" is the whole diagnosis when
          # the deployed app claims it has no account service, and it gives
          # away nothing that the page does not already carry.
          names="VITE_SUPABASE_URL VITE_SUPABASE_KEY VITE_VAPID_PUBLIC_KEY
                 VITE_UNIVERSITY_GATEWAY_URL VITE_INSTITUTIONAL_PREVIEW
                 VITE_SEMESTER_INTELLIGENCE VITE_JOURNEY_NAVIGATION
                 VITE_ADAPTIVE_LEARNING VITE_CAREER_SKILLS_GRAPH
                 VITE_MULTIMODAL_CAPTURE VITE_UNIVERSITY_CONTROL_PLANE
                 VITE_TODAY_ACTION_CENTER VITE_REGISTRATION_DAY_MODE VITE_GRADUATION_SIMULATOR
                 VITE_COST_PLANNER VITE_ACADEMIC_LIFE_BALANCE VITE_CRUNCH_WEEK_FORECAST
                 VITE_COURSE_DETAIL_V2
                 VITE_ADVISOR_MEETING_MODE VITE_STUDY_READINESS VITE_SOURCE_LOCKER
                 VITE_CAREER_EVIDENCE VITE_OFFICE_ACTION_FEED VITE_DEMAND_FORECASTING
                 VITE_SEMESTER_WRAPPED VITE_OFFLINE_MODE VITE_TRUST_CENTER
                 VITE_COURSE_STUDIO
                 VITE_AI_TOOLKIT VITE_TOOLKIT_RESEARCH VITE_TOOLKIT_DATA
                 VITE_TOOLKIT_DATA_UPLOAD VITE_TOOLKIT_WORKBENCHES VITE_TOOLKIT_DISCLOSURE
                 VITE_HUMAN_HELP
                 VITE_INTEGRATION_DASHBOARD VITE_INSTITUTIONAL_OPERATIONS
                 VITE_ME_LANGUAGE VITE_PATH_LEARNER_PATHWAYS
                 VITE_ME_LIFE_EVENTS VITE_ME_MOMENT_FEEDBACK
                 VITE_COMMUNITY_FEED VITE_COMMUNITY_REPORTING
                 VITE_MODERATION_CONSOLE VITE_INSTITUTION_ESCALATION
                 VITE_VOLUNTEER_MODERATION VITE_SCOPED_PSEUDONYMITY VITE_TODAY_SHADOW
                 VITE_ACCOUNT_SAFETY_STATE VITE_COMMUNITY_IMAGES VITE_PRIVATE_BETA VITE_SUPPORT_TICKETS VITE_READ_ONLY VITE_DEPLOY_ENVIRONMENT
                 VITE_CAMPAIGN_MANAGER VITE_MIGRATION_CENTER VITE_CONFIGURATION_STUDIO VITE_WORKFLOW_BUILDER VITE_RECORD_LEDGER VITE_STUDENT_ACCOUNTS VITE_DOMAIN_TASKS
                 VITE_CLAUDE_PROXY VITE_ICS_PROXY
                 VITE_OAUTH_PROXY VITE_MS_CLIENT_ID VITE_GOOGLE_CLIENT_ID
                 VITE_ZOOM_CLIENT_ID VITE_APPLE_CLIENT_ID VITE_STUN_URLS
                 VITE_TURN_URL VITE_TURN_USER VITE_TURN_PASS"

          carried=""
          for name in $names; do
            value="${!name}"
            [ -z "$value" ] && continue

            # This site is the product, so the demo switch never reaches it.
            # See the note after the loop.
            [ "$name" = "VITE_INSTITUTIONAL_PREVIEW" ] && continue

            # A value with a newline in it would corrupt $GITHUB_ENV and take
            # the next variable with it. None of these is multi-line; a pasted
            # PEM or a trailing blank line is the mistake, and it is worth
            # naming rather than letting the file go strange.
            case "$value" in
              *$'\n'*)
                echo "::error title=$name::This value contains a line break. Every setting here is one line; re-paste it without the newline."
                exit 1
                ;;
            esac

            # An empty variable must not overwrite the committed default, which
            # is why the export is inside the non-empty branch.
            echo "$name=$value" >> "$GITHUB_ENV"
            carried="$carried $name(${#value})"
          done

          # A real secret pasted into a VITE_ field is the one mistake here
          # with a consequence: the page would carry it to everyone who loads
          # the site. VITE_CLAUDE_PROXY wants the address of a proxy holding
          # the key, never the key.
          case "$VITE_CLAUDE_PROXY" in
            sk-ant-*)
              echo "::error title=VITE_CLAUDE_PROXY::That is an Anthropic API key, not a proxy address. Anything named VITE_… is compiled into the page. Rotate this key at console.anthropic.com, then set this to the address of a proxy that holds it."
              exit 1
              ;;
          esac

          # The gateway's address is checked here rather than in a student's
          # browser. `app/src/lib/university.ts` refuses a non-https address,
          # and refuses userinfo, a query or a fragment, because a gateway URL
          # carrying `?token=` puts a secret into every request line and every
          # proxy log. Refused there it is a sentence on a screen after a
          # deploy has already gone out; refused here it is a failed deploy.
          gw="$VITE_UNIVERSITY_GATEWAY_URL"
          if [ -n "$gw" ]; then
            bad=""
            case "$gw" in https://*) ;; *) bad="it must start with https://" ;; esac
            rest="${gw#https://}"
            case "${rest%%/*}" in *@*) bad="it carries a username or password" ;; esac
            case "$gw" in *\?*) bad="it carries a query string" ;; esac
            case "$gw" in *\#*) bad="it carries a fragment" ;; esac
            if [ -n "$bad" ]; then
              echo "::error title=VITE_UNIVERSITY_GATEWAY_URL::The app will refuse this address, so the deploy refuses it first: $bad. See app/src/lib/university.ts."
              exit 1
            fi
            echo "::notice title=University::Gateway configured (${#gw} chars) — this build can reach a school."
          else
            echo "::notice title=University::No VITE_UNIVERSITY_GATEWAY_URL, so the University screen will say no approved connection has been configured."
          fi

          # Both halves or neither. One without the other is not a partial
          # configuration, it is a build that contradicts itself: the address
          # alone made `sharedEndpoint()` look present, so the assistant told
          # people to sign in while Classmates said there is no account
          # service to sign in to, and the Sign in button on Group work led to
          # a screen saying the same. `lib/assistant.ts` no longer reads the
          # address without the key, so the sentences are true either way —
          # this stops the half-configured build existing in the first place,
          # because it is a deploy nobody meant to make.
          if [ -n "$VITE_SUPABASE_URL" ] && [ -z "$VITE_SUPABASE_KEY" ]; then
            echo "::error title=Accounts::VITE_SUPABASE_URL is set and VITE_SUPABASE_KEY is not. Accounts and the shared key both need the pair, so this build would have neither. Set VITE_SUPABASE_KEY, or unset VITE_SUPABASE_URL to build device-only."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_KEY" ]; then
            echo "::error title=Accounts::VITE_SUPABASE_KEY is set and VITE_SUPABASE_URL is not. Set VITE_SUPABASE_URL, or unset VITE_SUPABASE_KEY to build device-only."
            exit 1
          fi
          # The relay is one setting in three parts, and a partial one is
          # worse than none: `lib/rtc.ts` would report a relay to the call
          # screens, which then tell somebody on a locked-down network that
          # the call "still works" — and TURN authenticates every allocation,
          # so an address with no credential answers and refuses. Without any
          # of the three the screens say plainly that no relay is configured,
          # which is true and useful; with one or two they say the opposite.
          turn_set=0
          for v in "$VITE_TURN_URL" "$VITE_TURN_USER" "$VITE_TURN_PASS"; do
            [ -n "$v" ] && turn_set=$((turn_set + 1))
          done
          if [ "$turn_set" -ne 0 ] && [ "$turn_set" -ne 3 ]; then
            echo "::error title=Calls::VITE_TURN_URL, VITE_TURN_USER and VITE_TURN_PASS are one setting in three parts and $turn_set of 3 are set. Set all three, or none to build without a relay."
            exit 1
          fi

          # Zoom and Apple cannot finish a sign-in from a browser: Zoom's API
          # sends no CORS headers, and Apple's client secret is a JWT signed
          # with a private key. Both exchange tokens only through the proxy.
          # A client ID set without VITE_OAUTH_PROXY builds a button that
          # sends a student to a consent screen, takes the grant, and then
          # fails on the way back. Without the ID the same panel says the
          # sign-in is not switched on and points at the .ics route, which is
          # true and needs no account — so a missing ID is the better half to
          # be missing. Microsoft and Google are absent here on purpose: both
          # are registered as single-page apps and talk to the browser direct.
          if [ -z "$VITE_OAUTH_PROXY" ]; then
            needs=""
            if [ -n "$VITE_ZOOM_CLIENT_ID" ]; then needs="$needs VITE_ZOOM_CLIENT_ID"; fi
            if [ -n "$VITE_APPLE_CLIENT_ID" ]; then needs="$needs VITE_APPLE_CLIENT_ID"; fi
            if [ -n "$needs" ]; then
              echo "::error title=Connect::$needs is set and VITE_OAUTH_PROXY is not. Those providers exchange tokens only through the proxy. Set VITE_OAUTH_PROXY, or unset them to build without that sign-in."
              exit 1
            fi
          fi

          # This workflow deploys the product: the address the company site's
          # Log in button sends people to. A demo build here wore the "Demo
          # environment" label on every screen, swapped the student's own work
          # for Northstar University fixtures and a persona switcher, and put
          # a real person arriving to sign in inside a fictional account. It
          # happened once from a repository variable set to try the preview
          # and left on, and a warning on the run did not stop it — nobody
          # reads a run that succeeded. So the switch is not carried into this
          # build at all (the loop above skips it). A demo is its own
          # deployment: "Build the demo" below builds one into /demo/, and
          # `npm run preview:institutional` runs one locally.
          if [ "$VITE_INSTITUTIONAL_PREVIEW" = "true" ]; then
            echo "::notice title=Demo switch ignored::VITE_INSTITUTIONAL_PREVIEW is set to true in the repository, and this deploy ignored it: the Pages site is the real app, never the demo. Delete the variable (Settings → Secrets and variables → Actions) to silence this."
          fi

          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_KEY" ]; then
            echo "::notice title=Accounts::Supabase configured (url ${#VITE_SUPABASE_URL} chars, key ${#VITE_SUPABASE_KEY} chars) — this build has accounts."
          else
            echo "::notice title=Accounts::No repository variables set, so the build falls back to the committed app/.env.production."
          fi

          # The push key is the *public* half of the VAPID pair and is meant to
          # be compiled into the page. The private half authorises sending and
          # belongs only in the Edge Function's secrets — if it is ever set as
          # a repository variable, rotate it.
          if [ -n "$VITE_VAPID_PUBLIC_KEY" ]; then
            echo "::notice title=Reminders::Push key present (${#VITE_VAPID_PUBLIC_KEY} chars) — this build can deliver reminders with the app shut."
          else
            echo "::notice title=Reminders::No VITE_VAPID_PUBLIC_KEY, so the push switch under Me will say the build carries no key."
          fi

          # And the whole picture in one line, because the interesting question
          # after a deploy is usually "which of these did this build get?".
          offered=$(set -- $names; echo $#)
          count=$(set -- $carried; echo $#)
          echo "::notice title=Build inputs::$count of $offered carried into this build:${carried:- none}"

      # The product: real accounts, the student's own work, no demo chrome.
      #
      # VITE_INSTITUTIONAL_PREVIEW is pinned off here rather than left to the
      # repository variable, because the address students and the company
      # site's "Log in" reach must never be a demo by accident — which is what
      # it was, for as long as that variable was set. `false` rather than
      # unset, so a value carried in from the step above cannot win.
      - name: Build
        working-directory: app
        env:
          # e.g. /semester/ — supplied by configure-pages, so a rename of the
          # repo cannot silently break every asset path.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          export VITE_INSTITUTIONAL_PREVIEW=false
          npm run build

      # The demo, as a separate site at /demo/: the "Demo environment" label,
      # the fictional Northstar fixtures and the persona switcher, for sales
      # walkthroughs and for the company site's "See the demo".
      #
      # It is built with the account service blanked, so the demo has no
      # sign-in and cannot read or write a real account however it is driven:
      # fictional data only, and no connection to production. Empty values,
      # not unset ones — Vite lets a process variable win over
      # app/.env.production, which is where the real project's address lives.
      #
      # The separate base path gives it its own service-worker scope, narrower
      # than the product's, so a device that has opened both keeps their
      # caches apart. Its routes are hashes like the product's, so Pages' one
      # root 404.html is not needed under it. The audio is copied twice
      # (~210 MB each), well inside the 1 GB Pages limit.
      - name: Build the demo
        working-directory: app
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/demo/
        run: |
          export VITE_INSTITUTIONAL_PREVIEW=true
          export VITE_SUPABASE_URL=
          export VITE_SUPABASE_KEY=
          npx vite build --outDir dist-demo
          mv dist-demo dist/demo

      # A software bill of materials for exactly what this deploy ships: the
      # production dependencies of the lockfile `npm ci` just installed, as
      # CycloneDX. It is kept with the run for 90 days, so "were we running
      # the bad version of X on the 14th?" has an answer that does not depend
      # on reconstructing a lockfile from git history under pressure. It is not
      # published with the site. `app/src/lib/supplychain.test.ts` asserts this
      # step exists, runs after the build and before the deploy.
      - name: Software bill of materials
        working-directory: app
        run: npm run --silent sbom > sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: app/sbom.cdx.json
          retention-days: 90

      # Pages serves static files, so a deep link like /semester/?screen=study
      # is fine but any unknown path 404s. Copying index.html to 404.html makes
      # the app answer those too.
      - name: Fall back to the app on unknown paths
        run: cp app/dist/index.html app/dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: app/dist

      # CI runs for nearby merges can finish out of order. Pinning checkout to
      # head_sha proves this artifact passed, but without this final check an
      # older passing artifact can still publish after a newer one and roll
      # production backwards. Check at the last possible moment, after this
      # job has cleared the deployment concurrency queue.
      - name: Refuse a stale release
        id: current
        env:
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$PASSED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "$PASSED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Stale release::CI passed $PASSED_SHA, but main is now $current. The newer commit keeps production; this artifact will not replace it."
          fi

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        if: steps.current.outputs.deploy == 'true'
        id: deployment
