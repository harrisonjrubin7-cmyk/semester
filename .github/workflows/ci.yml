# What CI is for here: catching the two kinds of breakage that are invisible
# until someone opens the app.
#
#   1. The app stops compiling or building — caught by tsc and vite.
#   2. The course data goes quietly wrong — a figure attached to the wrong unit,
#      a month written out of range, a lesson pointing at an audio file that is
#      not there. None of those are type errors and none of them throw at
#      runtime; the app just renders the wrong thing. That is what
#      pipeline/validate.mjs exists for, and why it runs here.
#
#      This used to say "a September deadline landing in October", which that
#      script cannot catch and never could: an off-by-one inside the range is
#      a valid month, and nothing in the data says which one was meant. The
#      header there now says so.
#
# Deliberately one Node version rather than a matrix: this is one person's app,
# it is not published as a library, and three parallel jobs re-downloading a
# repo with 200 MB of audio in it costs more than it tells you.

name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# A newer push to a branch makes an in-flight run of it pointless, so a pull
# request cancels its own older runs. Main does not, and the difference is the
# whole point of this block.
#
# It used to cancel everything, main included, and at the merge rate this repo
# actually runs at that meant main was mostly unverified: three pull requests
# merged inside two minutes, and each merge killed the run checking the one
# before it. The commit that shipped the arrangement work (#39) never got a
# completed run at all — cancelled, which reads as neither pass nor fail, and
# is the worst of the three because nobody notices it.
#
# Grouping main by commit rather than turning cancelling off, because
# `cancel-in-progress: false` would not have fixed it. Only one run per group
# may be pending: a third merge arriving while the second waits cancels the
# second, so a queue behind one shared group still loses the middle of a run
# of merges. A group per commit has nothing to contend with, so every commit
# on main is checked and none of them can cancel another.
#
# `push` here is only ever main — see the trigger above.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci` rather than `npm install`: it installs the lockfile exactly,
      # so CI cannot pass on a dependency tree nobody has locally.
      - name: Install
        working-directory: app
        run: npm ci

      # ── Advisories published since the lockfile was written ──────────────
      #
      # Everything else in this job asks whether the code is right. This asks
      # the one question the code cannot answer about itself: whether somebody
      # outside has since published that one of these packages is exploitable.
      # Nothing in this repository was asking it — an advisory against a
      # transitive dependency of `pdfjs-dist` or `@supabase/supabase-js` would
      # have arrived here only by the owner happening to read about it.
      #
      # `.github/dependabot.yml` is the other half and they are not a
      # duplicate: this one says a bad version is installed *now*, on this
      # branch, and Dependabot opens the pull request that replaces it.
      #
      # `--audit-level=high` rather than the default `low`, because the default
      # reports development-only advisories against build tooling that no
      # student's browser ever runs, and a step that reports something every
      # week is a step that is skimmed. High and critical are the two levels
      # that describe something exploitable.
      #
      # ## Why it cannot fail the build, when the tree is clean today
      #
      # `npm audit --audit-level=high` in `app/` reports **0 vulnerabilities**
      # as this is written, so "non-blocking until the tree is clean" is not
      # the reason — the tree is clean, and this could be made blocking by
      # deleting one line.
      #
      # The reason is that this step's input is not in the repository. An
      # advisory published overnight turns this red on a pull request about a
      # button, whose author did not introduce it and cannot fix it there;
      # they either wait or learn to merge past a red check, and the second is
      # a habit that costs more than this step is worth. Left non-blocking it
      # is an annotation in the log of every run, which is enough to be seen
      # and not enough to stop unrelated work.
      #
      # Flip it by removing `continue-on-error` — the step already exits
      # non-zero on a finding, which is what makes that a one-line change
      # rather than a rewrite.
      - name: Audit the dependency tree
        working-directory: app
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: app
        run: npx tsc -b --noEmit

      - name: Lint
        working-directory: app
        run: npm run lint

      # The half of the typecheck the build graph does not reach.
      #
      # `tsc -b` builds what `tsconfig.json` references, which is the app and
      # the Vite config. `server/institution/` is in neither, and
      # `tsconfig.university.json` — which exists to cover it, along with
      # `packages/institution/` — is referenced by nothing, so nothing ran it.
      #
      # Four of its seven files were typechecked anyway, and that is the part
      # worth stating: `src` imports `gateway.ts`, `adapter.ts` and `auth.ts`,
      # so they get pulled into the app's program and an error in them fails
      # the step above. `start.ts`, `adapters.ts` and `gateway.test.ts` are
      # imported by nothing in `src` and were checked by nothing at all —
      # measured by planting a type error in each and watching `tsc -b` stay
      # green. `start.ts` is the server's entry point.
      #
      # So the coverage that did exist was an accident of the import graph
      # rather than a decision, and a refactor that stopped `src` importing
      # the gateway would have quietly dropped three more files without
      # anything going red.
      #
      # A separate step rather than a project reference: making it one would
      # mean `composite: true` and an emit target on a config whose whole
      # point is `noEmit`, and the script it runs already exists.
      - name: Typecheck the university server
        working-directory: app
        run: npm run check:university

      # The other half the build graph does not reach, found the same way.
      #
      # `video/` is its own package with its own `tsconfig.json`, and nothing
      # referenced it, so `tsc -b` never opened it. The coverage that existed
      # was the same accident as the university server's: `app/src/lib`'s
      # guards import `captions.ts`, `fit.ts`, `shorts.ts`, `clipspend.ts` and
      # `broll.ts`, so those five are pulled into the app's program and an
      # error in them does fail the step above.
      #
      # Six of ten were checked by nothing at all — `Documentary.tsx`,
      # `Lesson.tsx`, `Short.tsx`, `Persona.tsx`, `Root.tsx` and `index.ts`,
      # which is every composition plus the entry point. Measured by planting
      # a type error in each and watching `tsc -b` stay green.
      #
      # It is not hypothetical. A reference to an undefined binding went into
      # `Documentary.tsx` and passed `tsc -b` and the lint step; the only
      # thing that caught it was rendering a frame, which CI does not do and
      # cannot afford to.
      # Its own dependencies, because typechecking a package means resolving
      # what it imports and `remotion` is not in `app/node_modules` — which is
      # the entire reason `video/` is a separate package.
      #
      # `--omit=optional` drops `@remotion/compositor-linux-x64-gnu`, 26MB of
      # platform binary that only a render needs, and `--ignore-scripts` is
      # belt and braces: this package has no install scripts today and a
      # dependency that grew one would be running it in CI for a typecheck.
      # 184MB and seven seconds, measured.
      #
      # No browser is fetched here. `video/README.md` used to say that putting
      # Remotion in `app/package.json` would make every `npm ci` download a
      # Chrome Headless Shell; it does not — Remotion fetches it lazily at
      # render time, which is why `REMOTION_BROWSER` exists. What the split
      # actually buys is that `app`'s lockfile stays small and its install
      # stays fast, which is still worth having.
      - name: Install the video package
        working-directory: video
        run: npm ci --ignore-scripts --omit=optional

      - name: Typecheck the video package
        working-directory: app
        run: npm run check:video

      - name: Test
        working-directory: app
        run: npm test

      # The same suite again, in two other timezones.
      #
      # This step exists because of a bug it would have caught. Outlook returns
      # every calendar start as a UTC instant, so an all-day event on the 20th
      # arrives as midnight UTC on the 20th — and the app read the day back
      # with local getters, which in Nashville is seven in the evening on the
      # 19th. Reading week showed a day early for everyone west of Greenwich,
      # and this suite was green the whole time, because a runner's clock is
      # UTC and UTC is the one timezone where that bug is invisible.
      #
      # Two zones rather than a matrix, for the same reason there is one Node
      # version here: the checkout and the install are the expensive parts and
      # this reuses both. Chicago is where the app is actually used and sits
      # behind UTC; Kiritimati is UTC+14, the furthest ahead any clock gets.
      # A date that survives both, and UTC above, has little room left to be
      # off by one.
      #
      # It is a separate step rather than a replacement for the one above, so
      # that a failure here names itself: green Test and red this means the
      # code is timezone-dependent, which is a different bug from a broken
      # test and wants a different fix.
      - name: Test in other timezones
        working-directory: app
        run: npm run test:zones

      # The same suite again, in a random order.
      #
      # This step exists because of nine bugs it would have caught, all of one
      # shape: a test that passed on what the test before it happened to leave
      # behind. A clock still running, a dialog still in the body, a proxy
      # stood down for the session, `#/onboarding` still in the address bar, a
      # module registry already holding the unmocked version of what a file was
      # about to replace. Every one of them was green here, on every push, for
      # as long as the file order held — and the file order is not a promise
      # anybody made. `isolate: false` made it worse by sharing a worker, but
      # none of the nine were caused by it; it only stopped hiding them.
      #
      # Shuffling is what turns that class from invisible into a red build.
      # Vitest reorders both the files and the tests inside them, so the run
      # below is a different arrangement every push, and a suite that only
      # passes in one arrangement fails here sooner or later.
      #
      # An ordering failure is reproducible, which is most of why this is a
      # step rather than a bad idea. Vitest prints the arrangement it chose —
      #
      #     Running tests with seed "1789432569705"
      #
      # and `npm run test:shuffle -- --sequence.seed=1789432569705` runs that
      # arrangement again, here or on a laptop, as many times as it takes.
      #
      # A *timing* failure is not, and that distinction was learned the hard
      # way while this step was being added: a React tree left mounted when a
      # file ended threw `ReferenceError: window is not defined` about one run
      # in ten, and replaying its seed never brought it back, because the seed
      # fixes the order and not the race. Those are found by running this a
      # dozen times, not by replaying one. `src/rootunmount.test.ts` and
      # `src/seedawait.test.ts` exist so that the two known kinds cannot come
      # back at all, and a new one would want the same treatment rather than a
      # re-run.
      #
      # A separate step, for the reason the timezone run is one: green Test and
      # red this means the tests depend on each other, which is a different
      # fault from a broken test and wants a different fix — almost always in
      # the *earlier* file, which is the one the failure does not name.
      #
      # Deliberately unseeded. A fixed seed is one more arrangement, which is
      # the thing this step exists to stop trusting.
      - name: Test in a different order
        working-directory: app
        run: npm run test:shuffle

      # `VITE_BASE` here and on the two steps below, rather than once on the
      # job: `vitest` reads the same `vite.config.ts`, so a job-wide value
      # would move `import.meta.env.BASE_URL` under every test in the suite
      # above — including the ones that pin what `lib/asset.ts` returns.
      - name: Build
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # ── Opening the app's own addresses, cold ────────────────────────────
      #
      # Everything above this line runs in jsdom or in node. Nothing in CI had
      # ever opened the built app in a browser, and one class of bug lives in
      # exactly that gap: an address that works when you walk to it and draws
      # the wrong thing when you arrive at it. `#/course/bus` shipped doing
      # that — a bookmark, a shared link or an installed copy reopening drew a
      # different course entirely and rewrote the address bar to match.
      #
      # `state/deeplink.test.tsx` holds that one bug in jsdom. This holds the
      # class, against the bundle that actually ships: the production build,
      # the base path every asset is rewritten against, and a hash present in
      # the first navigation rather than assigned to a page already mounted.
      # Reverting the fix in `state/store.tsx` takes all four courses red here
      # and names what each drew instead; the no-own-course control stays
      # green, because an empty catalogue never had the bug.
      #
      # It rides the build above rather than paying for its own runner and its
      # own `npm ci`, the way the button sweep rides the contrast one.
      #
      # `vite preview` and not `npm run dev`, which is the opposite of the
      # choice `contrast.yml` makes and for the opposite reason: that sweep
      # measures paint and was verified against the dev server, while this one
      # is about what a deploy does, so the dev server is the wrong subject.
      - name: Install playwright and a browser
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          echo '{"name":"smoke","private":true,"type":"module"}' > package.json
          npm install --no-save playwright
          npx --yes playwright install --with-deps chromium

      # ── …at the base path the deploy actually uses ───────────────────────
      #
      # The `Build` step above builds at `/`, and nothing deployed is ever
      # served from `/`. `pages.yml` passes `VITE_BASE` and the site lands at
      # `https://<user>.github.io/<repo>/`, so the bundle CI opened cold was
      # configured differently from the bundle a student loads — the one
      # property of a deploy this job exists to check, and the one it was not
      # checking.
      #
      # `vite.config.ts` reads `base` from `process.env.VITE_BASE`, and
      # `vite preview` reads the same config, so the variable has to be set for
      # both commands or the server and the bundle disagree about where they
      # are. That is why it is on the job rather than on the build step.
      #
      # The repository's own name rather than a literal `/semester/`, for the
      # reason `pages.yml` gives for taking it from `configure-pages`: a rename
      # must not be able to silently break every asset path — including here,
      # where a stale literal would quietly go back to testing a path nothing
      # ships.
      #
      # This is a coverage change, not a fix for an observed bug: no
      # subpath-only failure is open today. What it buys is that one could not
      # hide — `asset.ts` exists because an absolute path "becomes a 404 with
      # no error shown" once the app is not at the root, and until now no check
      # in this repository had ever loaded the app anywhere but the root.
      # Measured no weaker than the run it replaces: with the `state/store.tsx`
      # fix reverted, the five boots below report the same eight findings at
      # `/semester/` as at `/`, naming TEST 1010 for all four courses.
      - name: Serve the built app the way Pages serves it
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          SMOKE_PATH: /${{ github.event.repository.name }}/
        run: |
          npx vite preview --port 4173 > /tmp/preview.log 2>&1 &
          timeout 120 bash -c "until curl -sf http://localhost:4173$SMOKE_PATH >/dev/null; do sleep 1; done"
          echo "preview up at $SMOKE_PATH"

      # Exits 1 on a finding and 2 if it could not run at all — a server that
      # never came up is not a clean sweep, and the script refuses to report
      # one as though it were.
      - name: Open every address cold
        working-directory: app
        env:
          SMOKE_PLAYWRIGHT: /tmp/smoke/node_modules/playwright
          # The address the server above is actually answering on. Without this
          # the script keeps its `http://localhost:4173/` default, which is now
          # a redirect to the base rather than the app.
          SMOKE_URL: http://localhost:4173/${{ github.event.repository.name }}/
        run: npm run smoke:cold

      # Runs at the repo root and needs no dependencies of its own — it reads
      # the course modules as source.
      - name: Validate the course data
        run: node pipeline/validate.mjs

      # The row-level security policies, which nothing here used to check.
      #
      # `supabase/check.sh` applies every migration to a throwaway Postgres and
      # runs the `.check.sql` suites against it. Its own header records why
      # that matters: before it existed the only way to run a suite was to
      # paste it into a live project's SQL Editor by hand, so they were not
      # run — and two had been failing on their first block since the migration
      # that broke them. A failed block aborts the transaction, so everything
      # after it was skipped: thirteen of twenty-two checks in one file and all
      # twenty-five in another had never executed.
      #
      # Making them runnable fixed the past. It did not stop the same thing
      # happening again, because nothing ran them automatically — and the suite
      # that caught a real hole in the invite gate (a `security definer`
      # function revoked from two role names instead of from PUBLIC, leaving
      # the grant both roles inherit untouched) would not have caught it here.
      #
      # The script finds the server under /usr/lib/postgresql/<major>/bin and
      # **exits 2 if it cannot**, which is the property that makes this step
      # worth having: a check that quietly skips when its dependency is missing
      # is the exact failure this repository keeps turning out to have had. The
      # major is the one in `config.toml`, installed by the step above — see
      # its comment for why "whichever Postgres is here" was worse than none.
      # The major the live project runs, which is not the one the runner ships.
      #
      # `ubuntu-latest` carries PostgreSQL 16. `supabase/config.toml` records
      # the live project as 17. `check.sh` used to take the newest server
      # installed, so this step's absence was not a skipped check — it was a
      # check that ran, passed, and was about a database nobody is using. That
      # is the shape this repository keeps finding: not silence, but a green
      # tick for the wrong question.
      #
      # `check.sh` now reads the major from `config.toml` and refuses anything
      # else, which is what makes this step safe to depend on: if the install
      # below fails, is served a different version, or is quietly dropped, the
      # policy step goes red and names the reason. It cannot fall back to 16.
      #
      # The explicit test after the install is so that a failure names *this*
      # step. apt can succeed having installed nothing useful if the repository
      # line is wrong for the runner's release, and a missing binary reported
      # two steps later reads as a broken script rather than a missing package.
      - name: Install the PostgreSQL the live project runs
        run: |
          want=$(sed -nE 's/^[[:space:]]*major_version[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
            supabase/config.toml | head -1)
          echo "::notice title=Postgres::config.toml asks for major $want."
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y "postgresql-$want"
          if [ ! -x "/usr/lib/postgresql/$want/bin/initdb" ]; then
            echo "::error title=No PostgreSQL $want::apt reported success but /usr/lib/postgresql/$want/bin/initdb is not there."
            exit 1
          fi
          "/usr/lib/postgresql/$want/bin/pg_config" --version

      - name: Check the database policies
        run: supabase/check.sh

      # `check.sh` builds from empty; this applies the pending migrations to
      # production's recorded shape with rows in it, which is the question a
      # deploy actually asks. Production's schema deploy failed silently from
      # 18 September because nothing had ever asked it.
      - name: Rehearse the deploy against production's shape
        run: supabase/rehearse.sh

  # ── A key that got committed ────────────────────────────────────────────
  #
  # The one kind of breakage in this repository that a test cannot see and a
  # revert cannot undo. Every other failure here is about the code being
  # wrong; this is about the code being right and carrying something that has
  # to be rotated within the hour. `SECURITY.md` is the procedure for after,
  # and it opens by saying rotate before you investigate — which is a
  # commitment about mechanism, and mechanism is faster the earlier somebody
  # knows.
  #
  # Nothing here was looking. The repository has a documented list of secrets,
  # a rotation table and an incident process, and no check that would notice
  # one of them going in. GitHub's own secret scanning is a real second pair of
  # eyes and is not this: it runs after the push has landed, it covers the
  # providers it has partnered with, and it is a repository setting rather than
  # something this file can state. This runs on the pull request, before the
  # merge, and fails it.
  #
  # ## Two scans, because the action alone does not cover the branch
  #
  # This was written as one step and the first run said otherwise. On a
  # `pull_request` event `gitleaks-action` builds its own range and it is one
  # commit —
  #
  #     gitleaks detect … --log-opts=--no-merges --first-parent <sha>^..<sha>
  #     1 commits scanned.
  #     scanned ~59520 bytes (59.52 KB) in 161ms
  #
  # — so a key added in the first commit of a two-commit pull request is never
  # looked at, and 59 KB of a 206 MB repository reads as a clean sweep. The
  # comment here used to say "the whole history, which is the point", which
  # was wrong in the direction that matters: it described coverage this job
  # did not have.
  #
  # So the action keeps the job it is actually good at — the licence check,
  # the version fetch, the SARIF artifact, and the diff of what this push
  # added, which catches a key committed and then removed again within the
  # branch — and the step after it scans the **working tree**, which is every
  # file the branch would merge whichever commit put it there. Neither covers
  # the other: one sees what is gone, the other sees what is there.
  #
  # A full-history sweep is neither, and is deliberately not run on every
  # push: 430 commits in 21.8 s once, by hand, clean. It is an audit, and the
  # thing worth doing on every push is the branch in front of you.
  #
  # `fetch-depth: 0` stays because the action's range needs the parent commit
  # present, not because anything scans all of it.
  #
  # ## Why the version is pinned
  #
  # `gitleaks-action@v2` installs the version *it* pins, which was **8.24.3**
  # on this job's first run, and `.gitleaks.toml` was written against 8.28.0.
  # Two differences, both measured, both silent:
  #
  #   · **8.24.3 has no `anthropic-api-key` rule.** A full-length
  #     `sk-ant-api03-…` planted in three files was reported by 8.28.0 and by
  #     none of them on 8.24.3. For this project that is the likeliest key to
  #     leak, so the default was the wrong version to scan with.
  #   · **8.24.3 ignores the `[[allowlists]]` plural form** the current
  #     documentation shows — and takes the stock config's own allowlists with
  #     it, which turns two findings on one file into six. `.gitleaks.toml`
  #     uses the singular `[allowlist]`, checked clean on both, so the pin and
  #     the config are belt and braces rather than one load-bearing guess.
  #
  # Raising the pin is a one-line change and Dependabot will not do it: it
  # bumps the action, not the binary the action downloads. That is the cost of
  # the pin and it is the cheaper of the two.
  #
  # `gitleaks-action@v2` is free for a repository owned by a personal account —
  # the log says so in as many words, `[harrisonjrubin7-cmyk] is an individual
  # user. No license key is required.` An organisation needs
  # `GITLEAKS_LICENSE`; if this repository ever moves under one, that is the
  # line that will need adding, and the symptom will be this job failing with a
  # licence message rather than a finding.
  #
  # ## Why it is a job of its own
  #
  # The history the action's range needs makes `fetch-depth: 0` unavoidable,
  # and this repository's pack is 206 MB — mostly rendered audio — so a full
  # checkout is not free, and putting it on the `build` job above would make
  # every step in that job pay for it. As a separate job it runs beside
  # `build` rather than in front of it, so the wall clock of a run does not
  # move; what it costs is one more checkout's bandwidth. That is the opposite
  # of the trade the concurrency comment at the top of this file makes about a
  # Node matrix, and deliberately: three jobs re-downloading this repository to
  # ask the same question in three runtimes buys nothing, and this one asks a
  # question no other job here asks.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      # Read-only. The action wants `pull-requests: write` to annotate a pull
      # request with what it found, and a comment quoting a leaked key is a
      # second copy of it in a place nobody can delete — so that is off, and
      # the job log is where the finding is read. `GITLEAKS_ENABLE_COMMENTS`
      # below is the switch, set explicitly rather than left to the default.
      contents: read

    env:
      # One place, read by both scans, so they cannot drift onto different
      # binaries. See the block above for what the default cost.
      GITLEAKS_VERSION: 8.28.0

    steps:
      - uses: actions/checkout@v7
        with:
          # The action diffs against the parent commit, which a depth-1
          # checkout does not have. This is what that needs — not a full
          # history sweep, which nothing here runs.
          fetch-depth: 0

      # What this push *added*, including anything a later commit took out
      # again. Removed is not gone: it is still in the pack and still readable
      # by anyone who clones.
      - name: Scan what this branch changed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          # Off for the same reason the comments are: this repository is one
          # person's, and a summary of what was found belongs in the log
          # rather than on a page.
          GITLEAKS_ENABLE_SUMMARY: false

      # And every file the branch would merge, whichever commit put it there.
      #
      # `--exit-code 1` rather than the default 0: a scan that finds a key and
      # exits successfully is the failure this whole job exists to avoid, and
      # the flag is the difference between a check and a log line.
      #
      # No `npm ci` runs in this job, so there is no `node_modules` for this to
      # walk — the whole tree is 257 MB and 2.9 s, measured.
      - name: Scan every file the branch carries
        run: |
          cd "$(mktemp -d)"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          bin="$PWD/gitleaks"
          cd "$GITHUB_WORKSPACE"
          "$bin" version
          "$bin" dir . --no-banner --redact --config .gitleaks.toml --exit-code 1

  # ── Saying so when main is red ──────────────────────────────────────────
  #
  # A pull request that fails tells the person who opened it: the check sits
  # on their PR, and they are looking at it. Main failing tells nobody. It
  # blocks no merge, appears on no page anybody has open, and the next merge
  # is already in flight.
  #
  # That is not hypothetical. On the night this was written `tsc` went red on
  # main at 02:21 and four more merges landed on top of it — #76, #81, #87,
  # #89 — before anybody looked. CI was right every time and said so four
  # times into an empty room. The break itself was two correct pull requests
  # landing nine minutes apart: one moved a test onto `nav.ts`'s file, the
  # other removed the screen that test happened to name, and neither could
  # have conflicted with the other.
  #
  # So this job is not another check. It is the existing one, addressed to
  # somebody: an issue while main is red, closed when it goes green.
  notify:
    # `always()` because the interesting case is precisely the one where the
    # job before this failed. Push only — see the trigger at the top, which
    # makes that main.
    if: always() && github.event_name == 'push'
    needs: [build, secrets]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # A notifier that can fail is a notifier that paints main red when main is
    # green, which is worse than the silence it replaces. `build` decides the
    # colour of this run; this job never does. The cost is that a notifier
    # broken by permissions is quiet about it — if these issues stop arriving,
    # read this job's log, and check Settings → Actions → Workflow permissions
    # is "Read and write".
    continue-on-error: true
    steps:
      - uses: actions/github-script@v7
        env:
          BUILD: ${{ needs.build.result }}
          # A committed key is the failure on main that most needs somebody
          # told, so the notice covers both jobs rather than only the one it
          # was written for. Either failing is red.
          SECRETS: ${{ needs.secrets.result }}
        with:
          script: |
            const red =
              process.env.BUILD === 'failure' || process.env.SECRETS === 'failure';
            const TITLE = 'main is red';
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const at = context.sha.slice(0, 7);

            // One notice, reopened by commenting rather than replaced. A new
            // issue per failed commit would be four issues for tonight, which
            // is a different way of being ignored.
            //
            // `listForRepo` returns pull requests as issues, hence the filter.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const notice = open.find((i) => !i.pull_request && i.title === TITLE);

            if (red) {
              const body = [
                `\`main\` failed CI at ${at}.`,
                '',
                run,
                '',
                'Every branch cut from here inherits it, and every pull request',
                'that merges onto it lands on a base that was already broken —',
                'so this is worth clearing before merging anything else.',
              ].join('\n');
              if (notice) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: notice.number,
                  body: `Still red at ${at}.\n\n${run}`,
                });
              } else {
                await github.rest.issues.create({ owner, repo, title: TITLE, body });
              }
            } else if (notice) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: notice.number,
                body: `Green again at ${at}.\n\n${run}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: notice.number,
                state: 'closed',
              });
            }
