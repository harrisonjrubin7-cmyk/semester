name: HawkScan

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: hawkscan-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# HawkScan needs no GitHub write access. Scan results live in StackHawk.
permissions:
  contents: read

jobs:
  hawkscan:
    # GitHub never exposes repository secrets to a fork. Internal pull
    # requests and main must scan or fail closed; forks wait for an internal
    # branch before they can be scanned with the account key.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check HawkScan configuration
        id: config
        env:
          HAWK_API_KEY: ${{ secrets.HAWK_API_KEY }}
          STACKHAWK_APPLICATION_ID: ${{ vars.STACKHAWK_APPLICATION_ID }}
        run: |
          if [ -n "$HAWK_API_KEY" ] && [ -n "$STACKHAWK_APPLICATION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=HawkScan not configured::Add the HAWK_API_KEY Actions secret and STACKHAWK_APPLICATION_ID Actions variable, then rerun this workflow."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        if: steps.config.outputs.enabled == 'true'
        run: npm ci

      - name: Build scan target
        if: steps.config.outputs.enabled == 'true'
        working-directory: app
        run: npm run build

      - name: Start scan target
        if: steps.config.outputs.enabled == 'true'
        working-directory: app
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 --strictPort > "$RUNNER_TEMP/semester-preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/semester-preview.log"
          exit 1

      - name: Run HawkScan
        if: steps.config.outputs.enabled == 'true'
        uses: stackhawk/hawkscan-action@29a62fe1e926ea50ac87a1b64efc59b82ffd5b7d # v2.2.0
        env:
          STACKHAWK_APPLICATION_ID: ${{ vars.STACKHAWK_APPLICATION_ID }}
          APP_HOST: http://localhost:4173
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          HAWK_AGENT: Codex
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}

  company_site:
    needs: hawkscan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Check company scan configuration
        env:
          HAWK_API_KEY: ${{ secrets.HAWK_API_KEY }}
          STACKHAWK_APPLICATION_ID: ${{ vars.STACKHAWK_APPLICATION_ID }}
        run: |
          test -n "$HAWK_API_KEY" && test -n "$STACKHAWK_APPLICATION_ID"
          node --test scripts/company-site-scan.test.mjs

      - name: Start isolated company-site target with production headers
        env:
          COMPANY_SCAN_KEY: ${{ runner.temp }}/company-site-scan.key
          COMPANY_SCAN_CERT: ${{ runner.temp }}/company-site-scan.crt
          COMPANY_SCAN_EVIDENCE: ${{ runner.temp }}/company-site-responses.jsonl
          COMMIT_SHA: ${{ github.sha }}
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$COMPANY_SCAN_KEY" -out "$COMPANY_SCAN_CERT" -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          node scripts/company-site-scan-server.mjs > "$RUNNER_TEMP/company-site-target.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --cacert "$COMPANY_SCAN_CERT" https://localhost:4186/product > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/company-site-target.log"
          exit 1

      - name: Install pinned HawkScan CLI
        uses: stackhawk/hawkscan-action@29a62fe1e926ea50ac87a1b64efc59b82ffd5b7d # v2.2.0
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}
          installCLIOnly: true
          version: 6.5.0
          configurationFiles: stackhawk-company-site.yml

      - name: Install checksum-pinned HawkOp evidence CLI
        run: |
          archive="$RUNNER_TEMP/hawkop-v0.11.0-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://download.stackhawk.com/hawkop/cli/hawkop-v0.11.0-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo "8e37168b6361b39d6a67eb1426b31328b2a8bb8472a53b8c7dcffd35ffa720c3  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" hawkop
          "$RUNNER_TEMP/hawkop" --version

      - name: Validate company-site scan
        env:
          HAWK_API_KEY: ${{ secrets.HAWK_API_KEY }}
          STACKHAWK_APPLICATION_ID: ${{ vars.STACKHAWK_APPLICATION_ID }}
          APP_HOST: https://localhost:4186
        run: |
          hawk version
          hawk config --help > /dev/null
          API_KEY="$HAWK_API_KEY" hawk validate config stackhawk-company-site.yml

      - name: Run company-site HawkScan
        id: company_scan
        env:
          HAWK_API_KEY: ${{ secrets.HAWK_API_KEY }}
          STACKHAWK_APPLICATION_ID: ${{ vars.STACKHAWK_APPLICATION_ID }}
          APP_HOST: https://localhost:4186
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          HAWK_AGENT: Codex
        run: |
          echo 'StackHawk | Scanning isolated company frontend; production backends are out of scope'
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          echo "StackHawk | Actual checkout: $COMMIT_SHA"
          # Exclude target readiness probes. From here only the scanner visits it.
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/company-site-responses.jsonl', '')"
          API_KEY="$HAWK_API_KEY" hawk scan stackhawk-company-site.yml --json-output > "$RUNNER_TEMP/company-site-scan.json"

      - name: Verify company-site scan evidence
        if: always() && steps.company_scan.outcome != 'skipped' && steps.company_scan.outcome != ''
        env:
          HAWK_API_KEY: ${{ secrets.HAWK_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          scan_id=$(node scripts/company-site-scan-report.mjs id "$RUNNER_TEMP/company-site-scan.json")
          echo "StackHawk | Scan id: $scan_id"
          "$RUNNER_TEMP/hawkop" scan get "$scan_id" --detail full --format json > "$RUNNER_TEMP/company-site-findings.json"
          evidence_status=0
          # hawkop 0.11.0 --detail full requests the alert-URI API at its default
          # page size of 10 and reports that page as the whole finding. Walk
          # pageSize=100 until nextPageToken is empty before reconciliation.
          node scripts/company-site-scan-report.mjs pages "$scan_id" "$RUNNER_TEMP/company-site-findings.json" > "$RUNNER_TEMP/company-site-findings-complete.json" || evidence_status=1
          node scripts/company-site-scan-report.mjs hashes "$RUNNER_TEMP/company-site-findings-complete.json" || evidence_status=1
          node scripts/company-site-scan-report.mjs reconcile "$RUNNER_TEMP/company-site-scan.json" "$RUNNER_TEMP/company-site-findings-complete.json" || evidence_status=1
          API_KEY="$HAWK_API_KEY" hawk op scan uris "$scan_id" --format json > "$RUNNER_TEMP/company-site-uris.json"
          node scripts/company-site-scan-report.mjs verify "$RUNNER_TEMP/company-site-scan.json" "$RUNNER_TEMP/company-site-uris.json" "$RUNNER_TEMP/company-site-responses.jsonl" || evidence_status=1
          exit "$evidence_status"
