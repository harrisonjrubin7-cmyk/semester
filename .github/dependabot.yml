# What this is for: nothing in this repository notices a dependency going bad.
#
# CI checks that the app compiles, that the tests pass and that the policies
# hold. None of those questions is "is one of these packages now known to be
# exploitable", and the answer to that one arrives from outside — an advisory
# published by somebody else, days or months after the version was installed.
# Until this file existed the only way it reached this project was a person
# happening to read about it.
#
# `npm audit` in `ci.yml` asks the same question against the tree as it stands.
# The two are not a duplicate of each other: audit reports, this one opens the
# pull request that fixes the report, and a report nobody can act on in a
# minute is a report that waits.
#
# ## Why the updates are grouped, and which ones are not
#
# Ungrouped, a weekly sweep of this tree opens a pull request per package, and
# a page of eight one-line bumps is a page nobody reads — which is how a real
# one goes through with the rest. So minor and patch updates arrive as one
# pull request per ecosystem: one diff, one CI run, one decision.
#
# **Major versions are deliberately left out of the groups**, which means they
# arrive one at a time. That is the point. A major is a breaking change by
# declaration — React 19 to 20, Vite 7 to 8 — and reviewing it mixed into a
# grouped bump is reviewing it at the wrong level of attention. Dependabot
# groups only the update types a group names, so a major that lands in the same
# week as the group simply gets its own pull request alongside it.
#
# ## Which directories
#
# The root app workspace, Workflow Lab, Starter, Video, Pipeline, the workflows and every
# deployed Edge Function. Other standalone package trees remain deliberately
# out for now rather than forgotten:
#
#   · `zite/` is a source snapshot of a separately owned builder workspace;
#     repository updates do not activate the running Zite apps.
#   · `packages/*` are source-only aliases — `vite.config.ts` resolves them to
#     TypeScript in this repository, so they have no dependencies of their own.
#
# The root app and standalone Workflow Lab have documented service boundaries;
# Starter has its own policy, data-access and worker packages with dedicated CI.
# Video has a separate npm lockfile and is installed and typechecked in the main
# CI workflow. Pipeline has a separate npm lockfile for its course-production
# scripts. Those five trees receive weekly update pull requests. The
# remaining local or separately owned trees stay visible as accepted gaps.
version: 2

updates:
  # ── The app's own tree ──────────────────────────────────────────────────
  #
  # `directory: /`, the workspace root: `app/` and `packages/*` are npm
  # workspaces with one lockfile at the root, and that is where Dependabot reads
  # it. Pointed at `/app` it would find a manifest whose lockfile is two levels
  # up and, as the old comment here said of the root, say nothing about it.
  # `overrides` live in the root `package.json` too: npm ignores them in a
  # workspace member, so the two security pins (`lodash-es`, `dompurify`) are
  # there and not in `app/package.json`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      # Monday morning, in the timezone the app is actually used in — the same
      # reason `ci.yml` runs its suite in Chicago. A sweep that lands on Friday
      # evening sits over a weekend; one that lands on Monday is looked at.
      day: monday
      time: '06:00'
      timezone: America/Chicago
    # Five, so that a week of majors cannot bury the branch list. The grouped
    # pull request counts as one of them.
    open-pull-requests-limit: 5
    groups:
      # Everything that is not a major, in one pull request. `patterns: ['*']`
      # with `update-types` is what scopes it: the group takes any package, but
      # only its minor and patch bumps.
      app-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope

  # ── The standalone Workflow Lab tree ───────────────────────────────────
  #
  # Workflow Lab has its own package manifest, lockfile, CI workflow and
  # documented service boundary. It is intentionally not a member of the root
  # npm workspace, so the updater above cannot see its resolved tree.
  - package-ecosystem: npm
    directory: /workflow-lab
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      workflow-lab-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope

  # ── The standalone Starter pnpm tree ───────────────────────────────────
  #
  # Starter is an independent pnpm/Turborepo backbone with policy, data-access,
  # worker and application packages. Its lockfile and CI are separate from the
  # root npm workspace, while Dependabot's npm ecosystem supports pnpm locks.
  - package-ecosystem: npm
    directory: /starter
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      starter-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope

  # ── The standalone Video/Remotion tree ─────────────────────────────────
  #
  # Video is not part of the root npm workspace. CI installs its own lockfile
  # and typechecks the package, so updates opened here receive an executable
  # compatibility check without implying that any rendered media is deployed.
  - package-ecosystem: npm
    directory: /video
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      video-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope

  # ── The standalone course-production Pipeline tree ─────────────────────
  #
  # Pipeline is not part of the root npm workspace. It has a committed npm
  # lockfile for the SDK used by its course-production scripts. Updates opened
  # here still require repository review and do not run a pipeline, publish a
  # course or imply that generated material is approved.
  - package-ecosystem: npm
    directory: /pipeline
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      pipeline-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope

  # ── The actions the workflows pin ───────────────────────────────────────
  #
  # `directory: /` is right here and is not the trap above: the github-actions
  # ecosystem is defined as reading `.github/workflows/` from the repository
  # root, and pointing it at `.github/workflows` finds nothing.
  #
  # Worth having for a reason the npm sweep does not cover: a third-party
  # action runs with this repository's `GITHUB_TOKEN`, so a stale major is a
  # supply-chain exposure rather than a bug in something a student downloads.
  # `gitleaks-action` and `actions/checkout` are two of the four this workflow
  # trusts with that token.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope

  # ── Deno dependencies shipped by the Edge Functions ───────────────────
  #
  # Supabase deploys each function with the deno.json in that function's
  # directory. Keeping the manifests function-local preserves that isolation;
  # `directories` lets one updater cover the complete deployed set. Grouping
  # by dependency name means a Supabase client release updates all functions
  # together rather than opening eighteen nearly identical pull requests.
  - package-ecosystem: deno
    directories:
      - /supabase/functions/*
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      edge-function-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
        group-by: dependency-name
    commit-message:
      prefix: deps
      include: scope
