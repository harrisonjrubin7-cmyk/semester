# Domain entry criteria: every domain needs the same entry criteria before it
# moves from map to funded delivery.
domain_entry:
  prerequisites:
    - strategic_problem_statement
    - named_customer_or_user_need
    - authority_and_system_of_record_map
    - initial_tenant_or_design_partner
    - accountable_product_owner
    - operational_owner
    - data_classification
    - source_and_connector_feasibility
    - accessibility_requirements
    - policy_and_legal_review_need
    - safe_failure_and_support_model
    - commercial_hypothesis
    - measurable_success_definition

  scoring:
    # Each factor is scored 1 to 5. `direction` says which end is favorable.
    # Thresholds for decision_outcomes are not set: a score alone selects no
    # outcome until an owner approves them.
    direction:
      favorable_when_high: [student_or_institution_value, implementation_reuse, commercial_evidence]
      unfavorable_when_high: [authority_complexity, data_sensitivity, connector_dependency, operations_burden]
    student_or_institution_value: 1_to_5
    authority_complexity: 1_to_5
    data_sensitivity: 1_to_5
    connector_dependency: 1_to_5
    operations_burden: 1_to_5
    implementation_reuse: 1_to_5
    commercial_evidence: 1_to_5

  decision_outcomes:
    - approve_discovery
    - approve_bounded_build
    - prototype_only
    - defer
    - reject
