# ILLUSTRATIVE FIXTURE, NOT REGISTERABLE. It shows the shape of an application;
# it cannot grant access. A real application must first satisfy the contract-lab
# intake (docs/engineering/contract-lab.yaml), including owner, authority, policy,
# freshness, failure, audit, retention, tests and safe-off.
# Scopes are the allow-list;
# prohibited_scopes are denied even if requested.
api_application:
  id: APP-PARTNER-001
  registerable: false
  partner_id: PARTNER-001
  tenant_scope:
    - tenant-a

  scopes:
    - readiness.receipt.read
    - support.handoff.create

  prohibited_scopes:
    - student.record.read.all
    - institution.policy.write
    - delegation.manage
    - payment.execute

  controls:
    - credential_rotation
    - rate_limit
    - webhook_signature
    - audit_log
    - revocation_test
    - expiry_date
