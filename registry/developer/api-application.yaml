# (docs/engineering/contract-lab.yaml), including owner, authority, policy,
# freshness, failure, audit, retention, tests and safe-off.
# Scope names are proposals until reconciled with API-PLATFORM.md §1.3.
registerable: false

application:
  id: APP-PARTNER-001
  name: illustrative-partner-application
  owner_organization: PARTNER-001
  environment: sandbox           # sandbox | production
  declared_purpose: illustrative

  requested_scopes:
