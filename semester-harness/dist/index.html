<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semester curriculum preview</title><style>body{font:16px/1.6 system-ui;max-width:1100px;margin:auto;padding:24px;background:#f4f1ea;color:#1b1a17}button,input{font:inherit;padding:10px;margin:4px}button:focus-visible{outline:3px solid #245577}pre{white-space:pre-wrap;background:#151b24;color:white;padding:20px}section{background:white;padding:20px;margin:16px 0}nav{display:flex;flex-wrap:wrap}</style><h1>Semester engineering curriculum</h1><p>Local preview: no authentication, official grades or hosted learner execution. Synthetic data only.</p><nav><button id="labs">Labs</button><button id="guides">Architecture and API excerpt</button><button id="cert">Certification</button></nav><main id="main"></main><script id="data" type="application/json">{"weeks": [{"week": 1, "title": "System boundaries", "requirements": "Return private for draft, official for grade and synthetic for fixture.", "starter": "def classify_record(record):\n    \"\"\"Return private for draft, official for grade and synthetic for fixture.\"\"\"\n    raise NotImplementedError(\"Implement lab 1\")\n"}, {"week": 2, "title": "Git evidence", "requirements": "Require nonempty title, test_evidence and reviewer.", "starter": "def validate_pr(record):\n    \"\"\"Require nonempty title, test_evidence and reviewer.\"\"\"\n    raise NotImplementedError(\"Implement lab 2\")\n"}, {"week": 3, "title": "Contracts and validation", "requirements": "Require dictionary with exactly id, title, status; id/title nonempty strings, status open or completed; return False for invalid input; do not mutate.", "starter": "def validate_task(record):\n    \"\"\"Require dictionary with exactly id, title, status; id/title nonempty strings, status open or completed; return False for invalid input; do not mutate.\"\"\"\n    raise NotImplementedError(\"Implement lab 3\")\n"}, {"week": 4, "title": "API pagination", "requirements": "Return items slice for offset and limit; negative offset or limit outside 1..100 raises ValueError.", "starter": "def paginate(record):\n    \"\"\"Return items slice for offset and limit; negative offset or limit outside 1..100 raises ValueError.\"\"\"\n    raise NotImplementedError(\"Implement lab 4\")\n"}, {"week": 5, "title": "Authorization", "requirements": "Require active exactly True and tasks:read in scopes.", "starter": "def authorize(record):\n    \"\"\"Require active exactly True and tasks:read in scopes.\"\"\"\n    raise NotImplementedError(\"Implement lab 5\")\n"}, {"week": 6, "title": "Tenant isolation", "requirements": "Require nonempty matching tenant IDs, active grant and tasks:read.", "starter": "def tenant_access(record):\n    \"\"\"Require nonempty matching tenant IDs, active grant and tasks:read.\"\"\"\n    raise NotImplementedError(\"Implement lab 6\")\n"}, {"week": 7, "title": "Transactions and audit", "requirements": "Require nonempty strings actor, tenant, action, target, request_id.", "starter": "def audit_ready(record):\n    \"\"\"Require nonempty strings actor, tenant, action, target, request_id.\"\"\"\n    raise NotImplementedError(\"Implement lab 7\")\n"}, {"week": 8, "title": "Accessibility", "requirements": "Return field, message and described_by equal field + -error.", "starter": "def error_model(record):\n    \"\"\"Return field, message and described_by equal field + -error.\"\"\"\n    raise NotImplementedError(\"Implement lab 8\")\n"}, {"week": 9, "title": "Idempotency", "requirements": "Return execute for previous_digest null, replay for matching digest, conflict otherwise.", "starter": "def idempotency(record):\n    \"\"\"Return execute for previous_digest null, replay for matching digest, conflict otherwise.\"\"\"\n    raise NotImplementedError(\"Implement lab 9\")\n"}, {"week": 10, "title": "Events", "requirements": "Return unique ids preserving first-seen order.", "starter": "def deduplicate(record):\n    \"\"\"Return unique ids preserving first-seen order.\"\"\"\n    raise NotImplementedError(\"Implement lab 10\")\n"}, {"week": 11, "title": "Recovery and telemetry", "requirements": "Remove token,password,student_name,submission_body from dictionary.", "starter": "def redact(record):\n    \"\"\"Remove token,password,student_name,submission_body from dictionary.\"\"\"\n    raise NotImplementedError(\"Implement lab 11\")\n"}, {"week": 12, "title": "SDK retries", "requirements": "429 or 503, attempt below max_attempts, GET or nonempty idempotency_key.", "starter": "def retry_allowed(record):\n    \"\"\"429 or 503, attempt below max_attempts, GET or nonempty idempotency_key.\"\"\"\n    raise NotImplementedError(\"Implement lab 12\")\n"}, {"week": 13, "title": "Security", "requirements": "Literal-IP HTTPS only; global IP, no credentials, port absent or 443. DNS intentionally unsupported.", "starter": "def safe_destination(record):\n    \"\"\"Literal-IP HTTPS only; global IP, no credentials, port absent or 443. DNS intentionally unsupported.\"\"\"\n    raise NotImplementedError(\"Implement lab 13\")\n"}, {"week": 14, "title": "Certification evidence", "requirements": "Require artifact_digest,contract_version,fixture_version and passing contract,isolation,revocation,accessibility,recovery tests.", "starter": "def evidence_ready(record):\n    \"\"\"Require artifact_digest,contract_version,fixture_version and passing contract,isolation,revocation,accessibility,recovery tests.\"\"\"\n    raise NotImplementedError(\"Implement lab 14\")\n"}, {"week": 15, "title": "Pilot reconciliation", "requirements": "Return sorted missing and unexpected lists from expected/observed ids.", "starter": "def reconcile(record):\n    \"\"\"Return sorted missing and unexpected lists from expected/observed ids.\"\"\"\n    raise NotImplementedError(\"Implement lab 15\")\n"}, {"week": 16, "title": "Capstone activation", "requirements": "Require certified,institution_approved,reconciled,rollback_ready,support_ready exactly True.", "starter": "def activation_ready(record):\n    \"\"\"Require certified,institution_approved,reconciled,rollback_ready,support_ready exactly True.\"\"\"\n    raise NotImplementedError(\"Implement lab 16\")\n"}], "architecture": "Proposed architecture: shared Semester shell -> gateway -> resource policy -> tenant-scoped service -> database/audit/outbox.\nGrading plane: authenticated submission -> immutable artifact -> ephemeral isolated worker -> bounded evidence -> human review -> authorized grade publication. Static portal never executes learner code.\nControl-plane API operations are proposed, not deployed: POST /v1/apps; GET /v1/apps/{appId}; POST /v1/installations/{id}/grant-requests; POST /v1/grants/{id}/revocations; POST /v1/releases/{id}/test-runs; POST /v1/apps/{id}/certification-submissions. Require schema validation, scope AND resource policy, idempotency for writes, structured errors and audit. This excerpt is not the prior complete 67-operation contract.\nNo real student records to AI, no browser service-role keys, no automatic official grades. Isolation must cover API/database/cache/storage/search/events.\nSDK: strict TypeScript, generated types, runtime validation, cancellation, bounded safe retries, explicit environments.\nExisting workflow-lab is a router/benchmark application; curriculum integration must not overwrite benchmark workflows.\n", "steps": ["Register publisher", "Verify ownership and contacts", "Declare use case and boundaries", "Register application", "Inventory data and subprocessors", "Request least-privilege permissions", "Provision synthetic sandbox", "Run contract conformance", "Prove tenant isolation", "Review credentials and egress", "Review accessibility", "Exercise recovery and offboarding", "Freeze release and evidence", "Independent certification decision", "Institution-specific pilot approval", "Reconcile and activate"]}</script><script>const D=JSON.parse(document.getElementById('data').textContent),m=document.getElementById('main');function node(t,s){const e=document.createElement(t);e.textContent=s;return e}function labs(){m.replaceChildren();D.weeks.forEach(w=>{const s=node('section','');s.append(node('h2','Week '+w.week+': '+w.title),node('p',w.requirements));const d=node('details','');d.append(node('summary','Starter code'),node('pre',w.starter));const b=node('button','Download starter');b.onclick=()=>{const u=URL.createObjectURL(new Blob([w.starter],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download='week_'+w.week+'_starter.py';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};s.append(d,b);m.append(s)})}document.getElementById('labs').onclick=labs;document.getElementById('guides').onclick=()=>{m.replaceChildren(node('h2','Architecture and proposed API excerpt'),node('pre',D.architecture))};document.getElementById('cert').onclick=()=>{m.replaceChildren();D.steps.forEach((s,i)=>m.append(node('p',(i+1)+'. '+s)))};labs();</script></html>
