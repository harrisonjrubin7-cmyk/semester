tion records; two-tenant test available.", "failure": "Provisioning failure creates owned support task."}, {"number": 8, "title": "Run contract conformance", "owner": "Partner engineer", "action": "Test request/response schemas, errors, pagination, idempotency and event compatibility.", "evidence": "Release-linked test results and executable examples.", "gate": "Required cases pass for the submitted contract.", "failure": "Failure creates specific remediation findings."}, {"number": 9, "title": "Prove tenant and resource isolation", "owner": "Security reviewer", "action": "Test cross-user/app/tenant/environment access and property restrictions.", "evidence": "Negative tests across API, storage, database, cache and search.", "gate": "No unauthorized disclosure or mutation.", "failure": "Any leak blocks certification."}, {"number": 10, "title": "Review identity, credentials and egress", "owner": "Security reviewer", "action": "Review token validation, rotation, revocation, secret handling and destination protections.", "evidence": "Threat model and credential/SSRF test evidence.", "gate": "Critical risks resolved; residual risk documented.", "failure": "No self-approval; security exceptions need named authority."}, {"number": 11, "title": "Review accessible user workflows", "owner": "Accessibility reviewer", "action": "Test keyboard, focus, labels, errors and assistive-technology workflows.", "evidence": "Automated results plus manual review and remediation.", "gate": "Required workflows meet approved accessibility criteria.", "failure": "Untested workflows cannot receive a pass badge."}, {"number": 12, "title": "Exercise operations and offboarding", "owner": "Operations reviewer", "action": "Inject outage and duplicate events; rehearse support, export, revocation, downstream deletion and reconciliation.", "evidence": "Recovery report and offboarding acknowledgment evidence.", "gate": "Bounded recovery works; owners and limitations explicit.", "failure": "Unknown down user-scoped access, worker-only service roles and audited mutations. This pack does not establish current live repository status. No certifications or production guarantees are claimed.\n\n## 1. System and trust boundaries\nReuse the Semester account, Action Center, search, workspace and design system. The developer console is a control plane, not unrestricted database administration. Public documentation, publisher organization membership, app permissions and institutional approval are separate boundaries. Learning drafts remain private until an authorized submission; official grades require institutional authority. Native domain services own canonical entities; connector adapters carry source identifiers, freshness and reconciliation evidence.\n\n## 2. Gateway request sequence\nTLS/edge limits -> route/environment resolution -> content and size validation -> token verification -> principal/app resolution -> active installation/grant -> tenant/purpose policy -> service object/property policy -> tenant-aware transaction -> audit/outbox -> response allowlist -> redacted telemetry. Database RLS is defense in depth. Never authorize from a supplied tenant header alone. Fail closed if required policy dependencies are unavailable. Protected mutation audit metadata commits transactionally.\n\n## 3. Identity profiles\nPortal: server-managed session/BFF, secure cookies and CSRF defenses. Public native clients: authorization code with PKCE S256. Confidential clients: code/PKCE plus supported client authentication. Machine integrations: approved client-credentials profile, narrowly scoped to environment and installation. Workers: dedicated workload identity. No implicit or password grants. Validate signatures, allowed algorithms, issuer, audience, token type and time claims; ID tokens are not access tokens. Key discovery uses trusted issuer configuration, not token-supplied URLs. Publish token lifetimes and refresh/rotation rules only after review.\n\n## 4. Authorization and revocation\nEvaluate identity, app, environment, installation, active grant, tenant, purpose, resource and property policy. Scope alone is insufficient. Tenant/environment appear in cache keys, storage policy and cursor bindings. Reauthorize queued jobs, retries and replay. Revocation invalidates caches, blocks issuance/access, pauses subscriptions, stops queued work and starts offboarding. Measure propagation before adopting a target.\n\n## 5. API contract rules\nThe accompanying OpenAPI 3.1 contract proposes 70 operations. Base URLs are deliberately absent; identity.example.invalid is a placeholder. Errors carry code/message/retryable/requestId. Collections have opaque cursors bound to query and authorization context. Writes require idempotency keys bound to principal/app/tenant/environment/operation/request digest. Same key/different digest conflicts. Store result atomically with the operation. PATCH uses If-Match; successful mutable reads and writes must publish ETag in implementation. Schema fields not in the allowlist are rejected. Membership and credential changes require recent reauthentication. No public generic state setter may bypass approval workflows.\n\n## 6. Events and webhooks\nUse a transactional outbox and bounded workers. Assume duplicates and no global ordering. Envelope: eventId, type, schemaVersion, resourceId, resourceVersion, occurredAt and provenance; include minimal payload. Sign raw bytes with a reviewed signature scheme, timestamp and key identifier; recipients enforce replay windows and deduplication. Publish canonical signing rules before implementation. Constrained egress validates destination at registration and connect time, rejects internal/private/link-local/metadata destinations, handles DNS rebinding, disables redirects and bounds responses. The week-13 literal-IP drill is not a production SSRF defense.\n\n## 7. SDK design\nProposed packages: @semester/contracts, @semester/sdk, @semester/sdk-server, @semester/testing. Generate transport types from an approved contract; validate unknown network values at runtime. strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes and useUnknownInCatchVariables enabled. Branded identifiers distinguish resources but do not authorize. Browser package excludes secrets and server dependencies. Inject token providers; no automatic persistent storage. Retry only transient operations with explicit idempotency for writes, bounded attempts/elapsed time and Retry-After handling. Support cancellation and timeouts. Contract drift, type misuse and browser-bundle leakage tests gate release.\n\n## 8. Learning and grading boundary\nLearner code never executes in the portal server. Production grading requires disposable isolated workers, no credentials, network disabled by default, bounded CPU/memory/time/output, no host mounts or privileged runtime, pinned dependencies, inaccessible hidden tests and cleanup. The included grader is ONLY for trusted local exercises: a subprocess timeout is not a sandbox. Learner code can access the local account and tamper with tests; therefore results are instructional feedback, not trusted institutional assessment.\n\n## 9. AI policy\nExisting project standard says no student records to AI. Use approved documentation and synthetic fixtures only. AI cannot grant permissions, certify, publish official grades or independently change registration. Student declarations explain allowed assistance; instructor remains assessment authority.\n\n## 10. Release and recovery\nInventory current repository before introducing duplicate infrastructure. CI gates types, contracts, unit tests, RLS, negative authorization, end-to-end and accessibility. Preview/staging are not production. Evidence ties digest, environment, test version and verifier. Activation requires certification, institution decision, reconciled pilot, rollback and support. Recovery drills include connector outage, duplicate events, partial import and grant revocation. Do not promise recovery metrics until measured.\n\n## 11. Contract omissions and decisions before production\nThis control-plane contract does not implement OAuth endpoints, binary artifact uploads, marketplace billing, domain-record APIs or curriculum APIs. Evidence references artifacts provisioned by a separately reviewed artifact service. Signing algorithm, lifetimes, retention windows, rate quotas, incident timelines and legal terms remain approval decisions. Full OpenAPI semantic validation and implementation conformance are still required.\n\n## Sources\nProject: docs/platform/DEVELOPER_PLATFORM_AND_MARKETPLACE.md and docs/guides/Developer Guide.html are cited by the project brief but are not in this repository, so the project-specific claims above are not verified against them here.\nOAuth security baseline: RFC 9700 (https://www.rfc-editor.org/rfc/rfc9700.html).\nAPI risk baseline: OWASP API Security Top 10 2023 (https://owasp.org/API-Security/editions/2023/en/0x11-t10/).\nThese are references for implementation review, not claims of compliance.\n", "syllabus": "# Software engineering with Semester - 16-week syllabus\n\n## Status and prerequisites\nProposed course, subject to instructor and institutional approval. Basic programming, Git and introductory web concepts required. Suggested workload: two instructor-led sessions and 4-6 independent hours weekly; adjust for learner needs. Python 3 runs the small concept drills without third-party packages. The application capstone follows Semester's documented TypeScript direction; learners may use an instructor-approved equivalent typed stack. The Python drills do not replace full-stack labs.\n\n## Outcomes\nDesign contracts; distinguish authentication from authorization; isolate tenants; build accessible workflows; preserve audit and provenance; implement retry-safe operations; operate event delivery; produce a typed SDK; threat-model integrations; reconcile pilots; defend engineering decisions.\n\n## Capstone\nBuild a synthetic Semester planning extension with tenant-scoped tasks, shared-shell UI, typed API client, duplicate-safe events, redacted diagnostics, revocation and certification evidence. No real student data, production credentials or official-record mutations.\n\n## Weekly rhythm\nBefore class: read architecture guide and lab. First session: concepts and guided drill. Second session: capstone implementation and review. End of week: code, visible test evidence, three added boundary tests, design note and 150-250 word reflection. Instructor sets actual dates, late/resubmission rules and office hours. Each starter intentionally raises NotImplementedError.\n\n## Assessment\nWeekly labs 40%; midterm architecture review 15%; capstone 35%; peer review/reflection 10%. Weekly rubric: correctness 30, tests 25, security/privacy 20, maintainability 15, documentation/reflection 10. Automated grading computes up to 30 correctness points from visible cases; remaining 70 require instructor review. No automatic final grade.\n\nCapstone rubric: functionality 20, authorization/isolation 20, reliability/reconciliation 15, contracts/SDK 15, accessibility 10, evidence/docs 10, defense 10. Midterm rubric: boundary clarity 30, contract quality 25, threat model 25, evidence/communication 20. Peer review: actionable findings 40, justified suggestions 30, respectful collaboration 20, timeliness 10.\n\nPerformance levels: exemplary 90-100 (reproducible and justified), proficient 75-89 (complete with minor gaps), developing 60-74 (partial or weak evidence), insufficient below 60 (core requirements missing). These bands are proposed and must match institutional grading policy. Security defects block deployment regardless of academic grade. Remediation is recorded and instructor-approved.\n\n## Academic integrity and AI\nCite reused code and permitted assistance; explain understanding in reflection/defense. Never send private records or credentials to AI. Instructor defines permitted assistance for each assessment. No plagiarism allegation or final grade is issued automatically. Provide accessible alternatives and an appeal route through instructor/institution policy.\n\n## Tools and support\nLocal Python concept runner; Git; instructor-selected TypeScript toolchain and synthetic backing store for capstone. No external service account required for concept drills. Portal is a local HTML prototype with browser-local progress; it has no authentication, shared roster or official grading backend.\n\n## Safety\ngrader.py executes trusted local code only and is not a sandbox. Never run untrusted submissions on a personal or institutional host. Production runners need isolation specified in architecture-guides.md.\n", "api": {"openapi": "3.1.0", "info": {"title": "Semester Developer Console API - proposed contract", "version": "0.1.0", "description": "Design artifact, not a deployed service. Covers developer-console control-plane resources, not the entire Education OS or curriculum API. Production activation requires implementation, contract validation, security review and institutional authority. No real server URL is declared."}, "paths": {"/v1/organizations": {"get": {"operationId": "get_v1_organizations", "tags": ["Organizations"], "summary": "GET /v1/organizations", "description": "Application membership and resource policy. Tenant, environment, active installation and property policies are enforced server-side. Scope possession alone is insufficient.", "security": [{"oauth2": ["organizations:read"]}], "parameters": [{"name": "cursor", "in": "query", "schema": {"type": "string", "minLength": 1}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 25}}], "responses": {"200": {"description": "Successful authorized operation", "headers": {"X-Request-Id": {"schema": {"type": "string", "minLength": 1}}}, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "properties": {"data": {"ty let tab='curriculum', selected=1, progress={};try{progress=JSON.parse(localStorage.getItem('semester-progress-v1')||'{}')}catch{}
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}

function save(){try{localStorage.setItem('semester-progress-v1',JSON.stringify(progress));announce('Personal progress saved locally.')}catch{announce('Storage unavailable. Export progress to preserve it.')}}
function textPanel(title,text){content.append(el('h2',title),el('pre',text))}
function render(){content.replaceChildren();document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));

const n=D.weeks.filter(w=>progress[w.week]===true).length;content.append(el('p',n+' of 16 weeks marked complete. This is not assessment evidence.'));const bar=el('progress');bar.max=16;bar.value=n;bar.setAttribute('aria-label','Personal weekly completion');content.append(bar);

function fill(q=''){list.replaceChildren();D.weeks.filter(w=>(w.title+' '+w.outcome).toLowerCase().includes(q.toLowerCase())).forEach(w=>{const b=button((progress[w.week]?'✓ ':'')+'Week '+w.week+': '+w.title,()=>{selected=w.week;render();document.getElementById('lesson').focus()});b.className='week';b.setAttribute('aria-pressed',String(selected===w.week));list.append(b)})}search.oninput=()=>fill(search.value);fill();
const w=D.weeks[selected-1],detail=el('section',undefined,'card');detail.id='lesson';detail.tabIndex=-1;detail.append(el('h2','Week '+w.week+': '+w.title),el('p',w.outcome),el('h3','Concept drill'),el('p',w.requirements),el('h3','Capstone increment'),el('p',w.capstone),el('h3','Submission evidence'),el('p',w.deliverables),el('h3','Starter code'),el('pre',w.starter));const actions=el('div',undefined,'toolbar');actions.append(button('Download starter.py',()=>download('week_'+w.week+'_starter.py',w.starter)),button('Download assignment',()=>download('week_'+w.week+'_assignment.md',w.assignment)),button(progress[w.week]?'Mark incomplete':'Mark personally complete',()=>{progress[w.week]=!progress[w.week];save();render()}));detail.append(actions,el('h3','Local grading command'),el('pre','python grader.py --lab '+w.week+' --submission labs/week_'+String(w.week).padStart(2,'0')+'/starter.py --report result.json'),el('p','Use the ZIP pack for grader.py and tests. Automated cases contribute correctness evidence only; instructor review supplies the remaining rubric dimensions.'));const extra=el('details'),summary=el('summary','Full lab assignment');extra.append(summary,el('pre',w.assignment));detail.append(extra);layout.append(side,detail);content.append(layout);
}else if(tab==='syllabus')textPanel('Course syllabus',D.syllabus);
else if(tab==='architecture')textPanel('Architecture guides',D.architecture);
else if(tab==='certification'){content.append(el('h2','16-step partner certification'));D.steps.forEach(s=>{const d=el('details',undefined,'card');d.append(el('summary',s.number+'. '+s.title));for(const key of ['owner','action','evidence','gate','failure'])d.append(el('h3',key[0].toUpperCase()+key.slice(1)),el('p',s[key]));content.append(d)})}
else if(tab==='api'){content.append(el('h2','Proposed developer-console API'),el('p','70 operations, 54 paths, 56 schemas. No API backend is implemented.'),button('Download OpenAPI JSON',()=>download('developer-console.openapi.json',JSON.stringify(D.api,null,2))));const input=el('input');input.type='search';input.placeholder='Search method, path or tag';input.setAttribute('aria-label','Search API operations');content.append(input);const list=el('div');content.append(list);function fill(q=''){list.replaceChildren();Object.entries(D.api.paths).forEach(([path,methods])=>Object.entries(methods).forEach(([method,op])=>{if(!(method+' '+path+' '+op.tags.join(' ')).toLowerCase().includes(q.toLowerCase()))return;const d=el('details',undefined,'card');d.append(el('summary',method.toUpperCase()+' '+path),el('p',op.description),el('pre',JSON.stringify(op,null,2)));list.append(d)}))}input.oninput=()=>fill(input.value);fill();const d=el('details');d.append(el('summary','All request and response schemas'),el('pre',JSON.stringify(D.api.components.schemas,null,2)));content.append(d)}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();content.focus()});render();
</script></body></html>
