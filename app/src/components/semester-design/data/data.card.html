<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-canvas)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:grid;gap:16px}.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}</style></head><body><div id="root"></div>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
const cols = [{key:'name',label:'Integration'},{key:'src',label:'Source',render:r=><N.SourceBadge source={r.src}/>},{key:'st',label:'Status',render:r=><N.StatusChip status={r.st}/>},{key:'n',label:'Records',numeric:true,sortable:true},{key:'last',label:'Last sync'}];
const rows = [{id:'b',name:'Banner SIS',src:'official',st:'synced',n:41208,last:'2 min ago'},{id:'c',name:'Canvas LMS',src:'connected',st:'syncing',n:9114,last:'now'},{id:'h',name:'Housing',src:'imported',st:'sync-error',n:2032,last:null}];
function Demo(){ const [s,setS]=React.useState('ready'); return <div className="col" style={{gap:22}}>
<div><div className="lbl">DataTable · sortable, row headers, missing cells</div><N.DataTable caption="Integrations" columns={cols} rows={rows.map(r=>({...r,n:r.n}))} rowHeader="name" sortable defaultSort={{key:'n',dir:'desc'}} footnote="Records = rows read in the last sync. Housing’s last sync time wasn’t recorded."/></div>
<div><div className="lbl">States</div><div className="row" style={{marginBottom:8}}>{['ready','loading','empty','error'].map(x=><N.Button key={x} variant={s===x?'primary':undefined} onClick={()=>setS(x)}>{x}</N.Button>)}</div><N.DataTable caption="Holds" columns={[{key:'who',label:'Student'},{key:'kind',label:'Hold'},{key:'amt',label:'Balance',numeric:true}]} rows={s==='empty'?[]:[{id:1,who:'T. Brooks',kind:'Bursar',amt:'$2,140'},{id:2,who:'J. Ellis',kind:'Advising',amt:null}]} state={s==='loading'?'loading':s==='error'?'error':'ready'} emptyText="No holds on this caseload" onRetry={()=>setS('ready')} rowHeader="who"/></div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}><div><div className="lbl">Fields · empty, hint, source, copy</div><N.Fields items={[{field:'Environment',value:'Production'},{field:'Operator',value:'m.chen@northfield.edu',source:'SSO'},{field:'Correlation',value:'req_7Hk2Q9',mono:true,copy:true},{field:'Approver',value:null,hint:'Required before release'}]}/><div className="lbl" style={{marginTop:14}}>Stacked layout (narrow)</div><div style={{maxWidth:220}}><N.Fields layout="stack" items={[{field:'Catalog',value:'2025–26'},{field:'Advisor',value:'K. Lee'}]}/></div></div>
<div><div className="lbl">DecisionTrail · authority, evidence, every state</div><N.DecisionTrail items={[{title:'Request recorded',who:'M. Chen',when:'Oct 3 · 14:02',datetime:'2026-10-03T14:02'},{title:'Approved (1 of 2)',who:'R. Alvarez',authority:'Registrar delegation DEL-07',when:'Oct 3 · 15:40',evidence:'Syllabus, transcript'},{title:'Second approval',who:'Finance',state:'current'},{title:'Automated pre-check',state:'failed',detail:'Hold BUR-PD-60 still active'},{title:'Notify advisor',state:'skipped'},{title:'Action runs',state:'waiting'}]}/></div></div>
<ul style={{margin:0,paddingLeft:18,fontSize:13,lineHeight:1.5,color:'var(--text-secondary)'}}><li>Sort only columns people actually compare; rendered columns need <code>sortValue</code>.</li><li>Missing values show “—” or “Not recorded”, never blank or zero.</li><li>Trail steps always carry a state word; dots are decoration.</li></ul></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
