<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{padding:24px;background:var(--surface-canvas)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:grid;gap:16px}.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.SemesterDesignSystem_e9f3ba;

const N = NS;
function Demo(){return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
<N.ErrorState title="Canvas didn’t answer" body="Your draft is safe on this device. We’ll retry automatically." secondaryLabel="Use Canvas directly" reference="SYNC-4F2A"/>
<div className="col" style={{gap:12}}><N.SuccessState title="Registration submitted" body="The Registrar confirms within one business day." nextLabel="Review your fall schedule"/><N.OfflineStrip queued={2}/></div>
<N.ProgressState label="Importing transcript" done={64} total={100} note="Only you and your institution can see this file." onCancel={()=>{}}/>
<div className="state"><N.StepStatus steps={[{label:'Reading your sources',state:'done'},{label:'Drafting a study plan',state:'working'},{label:'Ready for review',state:'waiting'}]}/></div>
<N.PermissionNotice changed="Your advisor can now see your degree plan" why="You shared it on Oct 2. It ends when the term does." controlLabel="Manage sharing"/>
<N.EmptyState title="No tasks due this week" body="Tasks you add, and those courses publish, appear here." action={<N.Button size="sm">Add a task</N.Button>}/>
<div className="row"><N.SaveState status="saving"/><N.SaveState status="saved"/><N.SaveState status="offline"/><N.SaveState status="conflict"/></div>
<N.Notice head="Calendar">Sync is slow; times may be up to 10 minutes old.</N.Notice>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
