<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{padding:24px;background:var(--surface-canvas)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:grid;gap:16px}.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}</style></head><body><div id="root"></div>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
function Demo(){ const [open,setOpen]=React.useState(false); const [busy,setBusy]=React.useState(false); const [err,setErr]=React.useState(null); return <div className="col" style={{gap:22}}>
<N.ContextBar back={{label:'Courses',href:'#'}} kicker="Course · Fall 2026" title="CHEM 210 · Organic Chemistry I, Section 02" id="CRN 41208" source={<N.SourceBadge source="official" updated="2 h ago"/>} states={<><span className="status-chip" data-tone="pending"><span className="status-glyph">?</span>2 to grade</span></>} actions={<><N.Button variant="primary">Open gradebook</N.Button><N.Button>Message class</N.Button></>}/>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}><div className="col"><div className="lbl">ObjectCard</div><N.ObjectCard kind="Assignment" statuses={['action-required']} title="Lab report 3: Enzyme kinetics" href="#" provenance={{origin:'official',by:'BIO 210',age:'Updated today'}} explanation="Worth 12% of your grade. Methods drafted; results remain." metadata="Due Thu 9 Oct · 23:59" primary={{label:'Open draft'}} secondary={{label:'View rubric'}}/>
<N.ObjectCard kind="Registration" title="Add CHEM 2220-01" explanation="Closes your chemistry core." primary={{label:'Add to cart',disabled:true,disabledReason:'Your registration window opens Mon 2 Nov, 7:00.'}}/>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}><N.ObjectCard state="loading"/><N.ObjectCard kind="Advising note" state="unavailable" stateText="Your advisor marked this note private."/></div></div>
<div className="col"><div className="lbl">NextSteps · done, blocked, capped</div><N.NextSteps max={3} steps={[{label:'Set profile visibility',done:true},{label:'Pay fall balance',why:'A hold blocks registration on Oct 14.',icon:'costs'},{label:'Register for spring',blocked:true,blockedReason:'clear the bursar hold first',icon:'registrar'},{label:'Book advising',why:'Required before spring registration.',icon:'meet'},{label:'RSVP to welcome night',why:'Thursday, Sarratt.',icon:'today'}]}/>
<div className="lbl" style={{marginTop:8}}>Empty</div><N.NextSteps steps={[]}/></div></div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}><N.Dialog inline title="Drop CHEM 101?" confirmLabel="Drop course" destructive><N.ActionPreview subject="CHEM 101 · Section 03" says="You leave the course and its lab. Your schedule drops to 13 credits." affects="Your lab partner keeps the shared notebook." effective="Immediately; a W shows after Oct 20." doesNotChange="Your financial aid stays full-time (12+ credits)." recovery={{kind:'request',how:'ask the Registrar before Oct 20.'}} subjectTo="Subject to your school’s official records."/></N.Dialog>
<div className="col"><div className="lbl">Irreversible · type to confirm, busy, error</div><N.Button onClick={()=>{setOpen(true);setErr(null)}}>Delete portfolio project…</N.Button><N.ActionPreview says="Deletes “Buffer capacity study” and its 6 files." recovery={{}} /><div style={{fontSize:12,color:'var(--text-secondary)'}}>No recovery given, so it reads as “can’t be undone”.</div></div></div>
{open && <N.Dialog title="Delete this project?" description="This removes it for you and anyone you shared it with." destructive confirmLabel="Delete project" confirmText="Buffer capacity study" busy={busy} error={err} onCancel={()=>setOpen(false)} onConfirm={()=>{setBusy(true);setTimeout(()=>{setBusy(false);setErr('Couldn’t delete: you’re offline. Nothing was changed.')},900)}}><N.ActionPreview says="Deletes the project page and 6 files." recovery={{kind:'none'}}/></N.Dialog>}
<ul style={{margin:0,paddingLeft:18,fontSize:13,lineHeight:1.5,color:'var(--text-secondary)'}}><li>One primary per card; a disabled primary always says why.</li><li>Use Dialog only when recovery isn’t “undo”; otherwise act and show UndoToast.</li><li>Type-to-confirm only for irreversible, high-impact actions.</li></ul></div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
