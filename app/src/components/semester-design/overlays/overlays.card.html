<!-- @dsCard group="Components" viewport="900x760" name="Overlays" subtitle="Sheet + Source & details, UndoToast, FocusBar — focus trap and return, Escape, scroll lock, ≥6 s undo that pauses on hover, pause/resume" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-canvas)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:grid;gap:16px;align-content:start}.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}</style></head><body><div id="root"></div>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
function Demo(){ const [open,setOpen]=React.useState(false); const [toasts,setToasts]=React.useState([1]); const [log,setLog]=React.useState(''); const [paused,setPaused]=React.useState(false); return <div className="col" style={{gap:20}}><div style={{display:'grid',gridTemplateColumns:'1.2fr 1fr',gap:20}}>
<div className="col"><div className="lbl">Sheet · inline (in a page)</div><N.Sheet inline title="Source & details" description="Where this credit total comes from." onClose={()=>{}}><N.SourceDetails items={[{label:'Origin',value:<N.SourceBadge source="official" by="Registrar"/>},{label:'Freshness',value:'Updated 3 Oct 2026, 02:00'},{label:'Used in',value:'Today · My Path · Registration readiness'},{label:'Limitations',value:'The registrar’s audit is the official record; plans are yours until approved.'},{label:'Contact',value:null}]}/></N.Sheet>
<N.Button onClick={()=>setOpen(true)}>Open as modal sheet</N.Button><div style={{fontSize:12,color:'var(--text-secondary)'}}>Modal: focus moves in, Tab stays inside, Escape closes, focus returns to this button.</div></div>
<div className="col"><div className="lbl">UndoToast · 6 s minimum, hover to pause</div>{toasts.map(k=><N.UndoToast key={k} message="Task archived." duration={6000} onUndo={()=>setLog('Restored “Lab report 3”.')} onExpire={()=>setLog('Archive committed.')} onDismiss={()=>setLog('Dismissed; archive kept.')}/>)}<N.Button onClick={()=>setToasts(x=>[...x,Date.now()])}>Archive another</N.Button><div role="status" style={{fontSize:12,color:'var(--text-secondary)'}}>{log}</div>
<div className="lbl" style={{marginTop:8}}>FocusBar · pause/resume, End asks once if unsaved</div><N.FocusBar task="Lab report 3 · results section" remaining={paused?'18:42':'18:42'} paused={paused} onPause={()=>setPaused(true)} onResume={()=>setPaused(false)} onEnd={()=>setLog('Session ended; draft kept.')} unsaved breakDue={paused?null:'Break in 3 min'}/></div></div>
{open && <N.Sheet title="Share this plan" description="Choose who can see Plan v3." onClose={()=>setOpen(false)} closeOnScrim={false} actions={<><N.Button onClick={()=>setOpen(false)}>Cancel</N.Button><N.Button variant="primary" onClick={()=>setOpen(false)}>Share</N.Button></>}><N.Choice name="s" label="My advisor" about="Kendra Lee sees this plan." defaultChecked/><N.Choice name="s" label="Family" about="Ana Chen sees this plan." /></N.Sheet>}
<ul style={{margin:0,paddingLeft:18,fontSize:13,lineHeight:1.5,color:'var(--text-secondary)'}}><li>Set <code>closeOnScrim={'{false}'}</code> when a stray click would lose work.</li><li>Undo replaces “are you sure?” for anything reversible; irreversible actions use Dialog.</li><li>Toasts never carry the only copy of important information.</li></ul></div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
