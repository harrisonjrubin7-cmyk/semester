<!-- @dsCard group="Components" viewport="900x640" name="Queue controls" subtitle="Tabs, FilterChips, SlaTimer — arrow-key tabs with panels, single-select and empty filters, live counts, SLA from a due time" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-canvas);margin:0;font-family:var(--font-body);color:var(--text-primary)}.col{display:grid;gap:16px}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Tabs, TabPanel, FilterChips, SlaTimer } = window.SemesterDesignSystem_e9f3ba;
const now = Date.now();
function Demo(){ const [t,setT]=React.useState('mine'); const [f,setF]=React.useState(['hold']); const [sort,setSort]=React.useState(['due']); const n = 12 * (f.includes('hold')?1:0) + 4*(f.includes('override')?1:0) + 3*(f.includes('sis')?1:0); return <div className="col" style={{gap:20}}>
<div><div className="lbl">Tabs · click one, then use ← → Home End</div><Tabs idBase="q" items={[{id:'mine',label:'My work',count:7},{id:'approvals',label:'Approvals',count:2},{id:'team',label:'Team'},{id:'archived',label:'Archived',disabled:true},{id:'done',label:'Done'}]} current={t} onChange={setT} /><div style={{padding:'10px 2px',fontSize:13,color:'var(--text-secondary)'}}>{['mine','approvals','team','done'].map(id=><TabPanel key={id} idBase="q" id={id} current={t}>Panel for “{id}”. Archived is disabled and skipped by the arrows.</TabPanel>)}</div></div>
<div><div className="lbl">FilterChips · multi, live count, zero-count disabled</div><FilterChips options={[{id:'hold',label:'Holds',count:12},{id:'override',label:'Overrides',count:4},{id:'sis',label:'SIS mismatch',count:3},{id:'appeal',label:'Appeals',count:0}]} selected={f} onToggle={id=>setF(x=>x.includes(id)?x.filter(i=>i!==id):[...x,id])} onClear={()=>setF([])} resultCount={f.length?n:19} /></div>
<div><div className="lbl">Single-select (radio)</div><FilterChips single label="Sort by" options={[{id:'due',label:'Due soonest'},{id:'age',label:'Oldest'},{id:'sla',label:'SLA risk'}]} selected={sort} onToggle={id=>setSort([id])} /></div>
<div><div className="lbl">SlaTimer · given state, or computed from a due time</div><div style={{display:'flex',gap:10,flexWrap:'wrap'}}><SlaTimer remaining="3 h 10 m" target="4 h" /><SlaTimer remaining="40 m" state="soon" /><SlaTimer remaining="2 h" state="breach" /><SlaTimer met metAt="at 14:02" /><SlaTimer paused pausedReason="waiting on student" /><SlaTimer due={now+25*60000} now={now} target="1 business day" /><SlaTimer due={now-95*60000} now={now} /><SlaTimer /></div></div>
<ul style={{margin:0,paddingLeft:18,fontSize:13,lineHeight:1.5,color:'var(--text-secondary)'}}><li>Tabs switch views of one object; use FilterChips to narrow a list.</li><li>Every filter change updates a polite result count.</li><li>SLA states always carry a glyph and a word; paused says why.</li></ul></div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
