<!-- @dsCard group="Components" viewport="900x1000" name="Forms" subtitle="TextField, Select, Segmented, Choice, Switch — required in words, counters, affixes, keyboard radiogroup, disabled reasons, pending saves" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-canvas)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:grid;gap:16px}.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { TextField, Select, Segmented, Choice, Switch } = window.SemesterDesignSystem_e9f3ba;
function Demo(){const [v,setV]=React.useState('Cards');const [on,setOn]=React.useState(true);const [pend,setPend]=React.useState(false);const [vis,setVis]=React.useState('me');const [all,setAll]=React.useState([true,false]);
const toggle=(x)=>{setPend(true);setTimeout(()=>{setOn(x);setPend(false)},900)};
return <div className="col" style={{gap:22}}><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
<div className="col"><div className="lbl">TextField</div><TextField label="Preferred name" hint="Shown to classmates and instructors." defaultValue="Maya" required/><TextField label="Student ID" error="This doesn’t match your institution’s format (8 digits)." defaultValue="20419" inputMode="numeric"/><TextField label="Reflection" multiline maxLength={140} defaultValue="Titration went better once I slowed down the burette near the endpoint, which I wish I had done" optional/><TextField label="Hours this week" suffix="h" defaultValue="11.5" inputMode="decimal"/><TextField label="Catalog year" readOnly defaultValue="2025–26" hint="Set by the registrar"/></div>
<div className="col"><div className="lbl">Select</div><Select label="Term" placeholder="Choose a term" required options={['Fall 2026',{value:'s27',label:'Spring 2027'},{value:'su27',label:'Summer 2027 (not open yet)',disabled:true}]}/><Select label="Advisor office" error="Pick the office that holds your record." groups={[{label:'Arts & Science',options:['Advising Center','Pre-Health']},{label:'Engineering',options:['Undergraduate Office']}]}/>
<div className="lbl">Segmented · Tab once, then arrows</div><Segmented label="Feed layout" showLabel options={['Cards','Rows',{value:'Timeline',label:'Timeline',disabled:true,hint:'Coming soon'}]} value={v} onChange={setV}/></div></div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}><div className="col"><div className="lbl">Choice</div><Choice name="vis" label="Only me" about="Nobody else can see this note." checked={vis==='me'} onChange={()=>setVis('me')}/><Choice name="vis" label="My advisor" about="Dr. Okafor can read it during advising." checked={vis==='adv'} onChange={()=>setVis('adv')}/><Choice name="vis" label="My class" disabled disabledReason="Your instructor turned off class sharing for this course."/>
<Choice type="checkbox" label="All reminders" mixed={all.some(Boolean)&&!all.every(Boolean)} checked={all.every(Boolean)} onChange={(e)=>setAll([e.target.checked,e.target.checked])}/><div style={{paddingLeft:24}}><Choice type="checkbox" label="Deadlines" checked={all[0]} onChange={(e)=>setAll([e.target.checked,all[1]])}/><Choice type="checkbox" label="Club events" checked={all[1]} onChange={(e)=>setAll([all[0],e.target.checked])}/></div>
<Choice type="checkbox" label="I confirm this is my own work" error="Confirm before submitting."/></div>
<div className="col"><div className="lbl">Switch</div><Switch label="Share final grades with family" about="Ana Chen sees released final grades only." checked={on} pending={pend} onChange={toggle}/><Switch label="Location on posts" checked={false} disabled disabledReason="Turned off by your school for students under 18."/><Switch label="Quiet hours" onWord="Muted" offWord="Allowed" checked={true}/>
<ul style={{margin:0,paddingLeft:18,fontSize:13,lineHeight:1.5,color:'var(--text-secondary)'}}><li>Say “Required” in words; never rely on an asterisk.</li><li>Disabled controls explain why in a sentence.</li><li>Switches apply immediately; show <code>pending</code> while saving and block double toggles.</li><li>Read-only is not disabled: it stays focusable and copyable.</li></ul></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
