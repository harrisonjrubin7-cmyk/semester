# Supabase project configuration.
#
# Deliberately small. This file exists so that Supabase Branching can find the
# project at all — the GitHub integration reads it, and without one the
# `migrations/` directory beside it is never looked at. Everything it does not
# say is left at the platform's own default on purpose: a setting written here
# is a setting that silently overrides whatever is in the dashboard the next
# time a deploy runs, and a dashboard that lies to the person reading it is
# worse than a config file that is short.
#
# There is a [functions] block at the bottom, and there was deliberately not one
# until 21 September. The argument that stood here was:
#
#   > Edge Functions are deployed by `.github/workflows/functions.yml`, which
#   > deploys only the directories a push actually changed. Declaring them here
#   > as well would give one function two deploy paths that can disagree about
#   > which version is live.
#
# That is about production and it is right. What it did not say is what it
# costs staging, and a preview branch is where that bill arrives: Branching
# deploys only the functions named here, so with no block a preview branch had
# **no functions at all** — no `claude`, no `push`, nothing. Every AI feature
# and every reminder was absent from staging, in the way that looks like an app
# bug rather than a missing deploy. The branch on pull request #618 said so
# itself, in a warning nobody had read before:
#
#   > ⚠️ Only Functions declared in config.toml will be automatically deployed
#   > to branches: [functions.my-slug]
#
# So the objection is answered rather than overruled, and it turns out to be
# narrower than it read: declaring a function here does not give it a second
# deploy path to production — `functions.yml` remains the only thing that
# deploys. What this list decides is what a *branch* rebuilds from the
# repository. The one thing the two can still disagree about is a flag —
# `verify_jwt`. `lib/functionconfig.test.ts`
# reads this file and the workflow as text and goes red if the two stop
# matching, which is the instrument `lib/referral.test.ts` and
# `lib/allowance.test.ts` use for every other pair of sides that cannot import
# from each other. Undetected divergence was the fault; duplication was only
# ever the symptom.
#
# See STAGING.md for the whole of it.

project_id = "lzrqvlugnawcgywkhqlz"

[db]
# Matches the live project. A mismatch here is not cosmetic: a preview branch
# would be built on a different major than production, and the first thing you
# would learn from it is something untrue about production.
major_version = 17

# ── Edge Functions ────────────────────────────────────────────────────────
#
# Every function that exists, because every one of them is live. That was
# measured against the project rather than read off this repository, and the
# first version of this block got it wrong by trusting `DEPLOY.md`, which
# listed two and was two functions out of date. The management API lists
# `claude`, `push`, `calendar`, `fetchcal`, `canvas` and `lti`, all ACTIVE and
# all `verify_jwt` false.
#
# **Declaring them is not what deploys them.** They are already deployed, by
# `.github/workflows/functions.yml`, and that stays the deploy path. What a
# branch does with this list is narrower and is the whole reason the block
# exists: a preview branch inherits production's *build* of every function,
# and rebuilds from this repository only the ones named here. Undeclared, a
# branch runs the code production had when the branch was cut — which looks
# exactly like working, and is the worst shape a staging environment can take.
# The branch on pull request #618 shows both halves: its `claude` came back at
# version 20 with a fresh checksum, production's at 19 with the old one.
#
# `verify_jwt = false` on all six, matching the `--no-verify-jwt` that
# `functions.yml` passes to every deploy, and matching what the project
# reports for each. It is the platform's own check that is off, not
# authentication: `claude`, `fetchcal` and `canvas` verify the caller's token
# themselves and have to answer a CORS preflight, which carries no
# Authorization header at all, and `push` is called by the scheduler with a
# shared secret. DEPLOY.md argues each. Getting this flag wrong in the other
# direction is the one way the two deploy paths can hurt each other, which is
# why `lib/functionconfig.test.ts` pins it.

[functions.calendar]
verify_jwt = false

[functions.canvas]
verify_jwt = false

[functions.claude]
verify_jwt = false

[functions.fetchcal]
verify_jwt = false

[functions.lti]
verify_jwt = false

[functions.push]
verify_jwt = false
