<script src="../components/bundle.js"></script><style>body{padding:20px 24px;background:var(--surface-canvas)}.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}.col{display:grid;gap:12px;align-content:start}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.step{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13px}.num{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}</style></head><body><div id="root"></div><script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
function Demo(){const s=[['Rest',{}],['Hover',{background:'var(--action-secondary)'}],['Press',{background:'var(--action-secondary-hover)'}],['Focus',{outline:'2px solid var(--focus-color)',outlineOffset:2}],['Disabled',{opacity:.45}]];return <div className="col">
<div style={{display:'grid',gridTemplateColumns:'90px repeat(5,1fr)',gap:10,alignItems:'center'}}><span className="lbl">Secondary</span>{s.map(([n,st])=><div key={n}><button className="btn btn-sm" style={st}>{n}</button></div>)}
<span className="lbl">Primary</span>{[{},{background:'var(--action-primary-hover)'},{background:'var(--action-primary-press)'},{outline:'2px solid var(--focus-color)',outlineOffset:2},{opacity:.45}].map((st,i)=><div key={i}><button className="btn btn-sm btn-primary" style={st}>Submit</button></div>)}
<span className="lbl">Input</span>{[{},{borderColor:'var(--border-strong)'},{},{borderColor:'var(--focus-color)',outline:'2px solid var(--focus-color)',outlineOffset:0},{background:'var(--surface-sunken)',color:'var(--text-disabled)'}].map((st,i)=><div key={i}><input className="input" style={{minHeight:32,...st}} defaultValue="BIO 210"/></div>)}</div>
