<script src="../../components/bundle.js"></script><title>Semester — Workflow runner</title>
<style>html,body,#root{height:100%}body{overflow:hidden;margin:0}a{color:var(--blue-700,#416180)}a:hover{color:#1d2d3d}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1480px;margin:0 auto;padding:24px var(--page-pad) 64px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--border-subtle);margin-bottom:22px;flex-wrap:wrap}.pagehead h1{margin:4px 0 0}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px;align-content:start;min-width:0}.muted{color:var(--text-secondary);font-size:13px}.small{font-size:12.5px;line-height:1.6}.mono{font-family:var(--font-mono);font-size:11.5px}.h2{font:600 24px/1.2 var(--font-heading);margin:4px 0 0;text-wrap:pretty}.h3{font:600 17px var(--font-heading)}.run{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr) minmax(240px,300px);gap:24px}.cols{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:24px}@media(max-width:1100px){.run{grid-template-columns:minmax(200px,260px) minmax(0,1fr)}.run aside{grid-column:1/-1}}@media(max-width:760px){.run,.cols{grid-template-columns:minmax(0,1fr)}}.steps,.rolelist,.list{list-style:none;margin:0;padding:0;display:grid;gap:2px;align-content:start}.steps,.rolelist{max-height:calc(100vh - 220px);overflow:auto}.st{all:unset;box-sizing:border-box;display:flex;gap:10px;width:100%;padding:7px 10px;border-radius:3px;cursor:pointer;border-left:3px solid transparent}.st:hover{background:rgba(65,97,128,.08)}.st.on{border-left-color:var(--blue-700,#416180);background:rgba(65,97,128,.06)}.st:focus-visible{outline:2px solid var(--blue-600,#4f7397);outline-offset:2px}.st .g{width:14px;flex:none;color:var(--text-secondary);font-size:12px;padding-top:2px}.st b{display:block;font-weight:500;font-size:13.5px}.st small{display:block;color:var(--text-secondary);font-size:12px}.chip{display:inline-flex;align-items:center;border:1px solid;border-radius:3px;padding:2px 7px;font-size:12px}.frame{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);overflow:hidden}.framebar{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;background:var(--ink-bg,#090a0e);color:#eceef2;font-size:13px;flex-wrap:wrap}.framebar a{color:#94bce3}.framebar .muted{color:#a9adb6}.framebody{padding:16px}.framefoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border-subtle);flex-wrap:wrap}.framefoot .muted{flex:1;min-width:200px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.log{display:grid;gap:10px;font-size:13px;max-height:420px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:10px;align-content:start}.card summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px}.bar{height:4px;background:var(--border-subtle);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue-700,#416180)}.chain{list-style:none;margin:0;padding:0;display:grid}.chain li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--border-subtle)}.chain li b{font-weight:500}.chain li span{color:var(--text-secondary)}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:1px solid var(--border-strong);padding:6px 8px}.tbl td{border-bottom:1px solid var(--border-subtle);padding:7px 8px;vertical-align:top}</style></head>
