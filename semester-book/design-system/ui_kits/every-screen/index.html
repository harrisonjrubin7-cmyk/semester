<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--blue-700,#416180)}a:hover{color:#1d2d3d}.shell{display:grid;grid-template-columns:var(--rail-w) 260px minmax(0,1fr);height:100%}@media(max-width:1000px){.shell{grid-template-columns:var(--rail-w) minmax(0,1fr)}.shell .sub{display:none}}.sub{border-right:1px solid var(--border-subtle);background:var(--surface-base);display:flex;flex-direction:column;min-height:0}.sl{list-style:none;margin:0;padding:0 6px 24px;overflow:auto;flex:1}.si{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;border-radius:3px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent}.si:hover{background:rgba(65,97,128,.08)}.si.on{border-left-color:var(--blue-700,#416180);background:rgba(65,97,128,.06);font-weight:500}.si:focus-visible{outline:2px solid var(--blue-600,#4f7397)}.dot{color:var(--text-tertiary);font-size:11px}.main{display:flex;flex-direction:column;min-width:0;height:100%}.screen{flex:1;overflow:auto}.page{max-width:1180px;margin:0 auto;padding:24px var(--page-pad) 64px;display:grid;gap:20px}.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:4px 0 0;text-wrap:pretty}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:12px;align-content:start;min-width:0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:28px}@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.muted{color:var(--text-secondary);font-size:13px}.list{display:grid;gap:2px}.qi{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;border-radius:3px;cursor:pointer;border-left:3px solid transparent}.qi:hover{background:rgba(65,97,128,.08)}.qi.on{border-left-color:var(--blue-700,#416180);background:rgba(65,97,128,.06)}.qi b{font-weight:500}.qi small{grid-column:1;color:var(--text-secondary);font-size:12.5px}.qi .chip{grid-row:1/3;grid-column:2;align-self:center}.chip{display:inline-flex;border:1px solid var(--border-default);border-radius:3px;padding:2px 7px;font-size:12px;color:var(--text-secondary)}.setting{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border-subtle)}</style></head>
