<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--blue-700,#416180)}a:hover{color:#1d2d3d}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1180px;margin:0 auto;padding:24px var(--page-pad) 64px;display:grid;gap:28px}.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:4px 0 0}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.lead{color:var(--text-secondary);max-width:66ch;margin:6px 0 0;line-height:1.55}.row{display:flex;gap:8px;flex-wrap:wrap}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px}.stack{display:grid;gap:12px;align-content:start;min-width:0}.day{list-style:none;margin:0;padding:0;display:grid}.day li{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--border-subtle)}.mono{font-family:var(--font-mono);font-size:11.5px;color:var(--text-secondary)}.kpi{margin:0;padding-left:18px;line-height:1.8}.never li::marker{content:'⊘  '}.muted{color:var(--text-secondary);font-size:13px;margin:0}.small{font-size:13px;line-height:1.7;margin:0}.list{display:grid;gap:2px}.st{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:8px 10px;border-radius:3px;cursor:pointer}.st:hover{background:rgba(65,97,128,.08)}.st:focus-visible{outline:2px solid var(--blue-600,#4f7397);outline-offset:2px}.st b{display:block;font-weight:500;font-size:14px}.st small{display:block;color:var(--text-secondary);font-size:12px}.tag{flex:none;width:68px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);padding-top:2px}.grid
