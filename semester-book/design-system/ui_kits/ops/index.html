<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semester — Operations Consoles</title><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#eceef2;font-family:'Barlow',sans-serif;font-size:14px}a{color:#b5d9fd}a:hover{color:#eef6ff}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{width:auto;min-width:0;overflow:hidden;background:#040507;border-right:1px solid #22262f;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.rail .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}.rail .brand img{height:26px}
.rail h6{margin:14px 8px 6px;font:600 11px 'Barlow',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#98989b}
.rail button{all:unset;box-sizing:border-box;min-width:0;cursor:pointer;padding:8px 10px;border-radius:6px;color:#d4d4d7;display:flex;justify-content:space-between;gap:8px}.rail button:hover{background:#12141a}.rail button.on{background:#191c23;color:#fff;box-shadow:inset 2px 0 0 #94bce3}
.rail .ct{font-size:12px;color:#98989b}
main{display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid #22262f;flex-wrap:wrap}
header h1{margin:0;font:700 24px 'Barlow Condensed','Barlow',sans-serif;letter-spacing:.02em}header p{margin:2px 0 0;color:#98989b}
.hd-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:6px;border:1px solid #333843;color:#eceef2;font-weight:500}.btn:hover{background:#191c23}.btn.p{background:#d6ebff;color:#1d2d3d;border-color:#d6ebff}.btn.p:hover{background:#eef6ff}.btn.r{border-color:#7a2f2f;color:#f2b8b5}
.role{background:#12141a;border:1px solid #333843;color:#eceef2;border-radius:6px;padding:7px 10px;font:inherit}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid #22262f;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:12px 12px;color:#b7b7ba;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:#fff;border-color:#94bce3}
.body{padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:#12141a;border:1px solid #22262f;border-radius:8px;padding:14px}.kpi .l{color:#98989b;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.kpi .v{font:700 28px 'Barlow Condensed','Barlow',sans-serif;margin-top:4px}.kpi .d{font-size:12px;margin-top:2px}
.up{color:#9fd6a8}.dn{color:#f2b8b5}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{background:#12141a;border:1px solid #333843;color:#eceef2;border-radius:6px;padding:8px 10px;font:inherit;min-width:220px;flex:1;max-width:340px}
.chip{all:unset;cursor:pointer;padding:6px 10px;border-radius:999px;border:1px solid #333843;color:#d4d4d7;font-size:13px}.chip.on{background:#2c455d;border-color:#597ea3;color:#fff}
.tw{overflow-x:auto;border:1px solid #22262f;border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#98989b;padding:10px 12px;background:#12141a;border-bottom:1px solid #22262f}
td{padding:10px 12px;border-bottom:1px solid #191c23;vertical-align:top}tr.rw{cursor:pointer}tr.rw:hover td{background:#12141a}
.pill{display:inline-flex;gap:5px;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid #333843;white-space:nowrap}
.s-ok{color:#9fd6a8;border-color:#2f5a3a}.s-warn{color:#e9cf8f;border-color:#6b5a2a}.s-bad{color:#f2b8b5;border-color:#7a2f2f}.s-info{color:#b5d9fd;border-color:#416180}.s-ai{color:#cbbcf2;border-color:#4e4378}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:#12141a;border:1px solid #22262f;border-radius:8px;padding:16px}.panel h3{margin:0 0 12px;font:600 15px 'Barlow',sans-serif}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal .dh{font-size:12px;color:#98989b;text-transform:uppercase;padding:4px}
.cal .day{background:#12141a;border:1px solid #22262f;border-radius:6px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px}.cal .n{font-size:12px;color:#98989b}
.ev{font-size:12px;padding:3px 6px;border-radius:4px;background:#1d2d3d;color:#d6ebff;cursor:pointer}.ev.w{background:#3a321b;color:#f2e7c8}.ev.a{background:#2a2540;color:#e2d9fb}
.spark{display:flex;align-items:flex-end;gap:3px;height:80px}.spark i{flex:1;background:#597ea3;border-radius:2px 2px 0 0}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 60px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.hbar b{display:block;height:8px;border-radius:4px;background:#749dc4}
.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:#12141a;border-left:1px solid #333843;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;z-index:5}.drawer.open{transform:none}
.drawer .dh2{padding:16px 20px;border-bottom:1px solid #22262f;display:flex;justify-content:space-between;gap:12px}.drawer .dh2 h2{margin:0;font:600 18px 'Barlow',sans-serif}
.drawer .db{padding:16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;font-size:13px}.kv span:first-child{color:#98989b}
.drawer .df{padding:14px 20px;border-top:1px solid #22262f;display:flex;gap:8px;flex-wrap:wrap}
.banner{padding:10px 24px;background:#3a1a1a;color:#f8d7d5;border-bottom:1px solid #7a2f2f;display:none}.banner.on{display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#eceef2;color:#090a0e;padding:10px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.muted{color:#98989b}.lock{padding:40px;text-align:center;color:#98989b;border:1px dashed #333843;border-radius:8px}
@media(max-width:760px){.app{grid-template-columns:1fr}.rail{flex-direction:row;overflow-x:auto}.rail h6,.rail .brand{display:none}}
</style></head><body>
<div class="app"><nav class="rail" id="rail"></nav><main><div style="padding:8px 24px;background:#3a321b;color:#f2e7c8;font-size:13px;border-bottom:1px solid #6b5a2a">Illustrative sample data at scale. Semester is pre-revenue and pre-seed with one paid pilot signed, so none of these figures are real.</div><div class="banner" id="crisis">Crisis mode is on. All scheduled posts are paused and new posts need Comms Lead approval.</div><header><div><h1 id="title"></h1><p id="sub"></p></div><div class="hd-r"><select class="role" id="role"></select><span id="actions" class="hd-r"></span></div></header><div class="tabs" id="tabs"></div><div class="body" id="body"></div></main></div>
<aside class="drawer" id="drawer"><div class="dh2"><h2 id="dt"></h2><button class="btn" onclick="closeD()">Close</button></div><div class="db" id="db"></div><div class="df" id="df"></div></aside>
<div class="toast" id="toast"></div>
<script src="consoles-data.js"></script>
<script src="consoles-app.js"></script>
</body></html>
