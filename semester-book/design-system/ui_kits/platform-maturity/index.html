<!-- @dsCard group="Architecture" viewport="1440x900" name="Platform maturity program" subtitle="Becoming the education platform: three tiers, 12 pillars, 24-dimension scorecard, APIs, roadmap and the next 50 actions" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../components/bundle.js"></script><title>Semester — Platform maturity</title>
<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--blue-700,#416180)}a:hover{color:#1d2d3d}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1240px;margin:0 auto;padding:24px var(--page-pad) 64px;display:grid;gap:22px}.ph{padding-bottom:18px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:4px 0 0;text-wrap:pretty}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.lead{color:var(--text-secondary);max-width:72ch;margin:6px 0 0;line-height:1.55}.muted{color:var(--text-secondary);font-size:13px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:8px;align-content:start}.card h3{margin:0;font:600 17px var(--font-heading)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;border:1px solid var(--border-default);border-radius:3px;padding:2px 7px;font-size:12.5px}.tier{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--border-subtle)}@media(max-width:860px){.tier{grid-template-columns:minmax(0,1fr)}}.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:1px solid var(--border-strong);padding:6px 8px}.tbl td{border-bottom:1px solid var(--border-subtle);padding:8px;vertical-align:top}.score{display:flex;gap:4px}.score button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:3px;font-size:12px;font-variant-numeric:tabular-nums}.score button[aria-pressed=true]{background:var(--blue-700,#416180);border-color:var(--blue-700,#416180);color:#fff}.score button:focus-visible{outline:2px solid var(--blue-600,#4f7397);outline-offset:2px}.bar{height:6px;background:var(--border-subtle);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue-700,#416180)}.todo{list-style:none;margin:0;padding:0;display:grid}.todo label{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border-subtle);cursor:pointer}.todo input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--blue-700,#416180)}.todo .done span{text-decoration:line-through;color:var(--text-secondary)}.mono{font-family:var(--font-mono);font-size:12px}pre{margin:0;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;background:var(--surface-base);border:1px solid var(--border-subtle);border-radius:6px;padding:12px 14px;white-space:pre-wrap}.ladder{display:flex;flex-wrap:wrap;gap:6px;align-items:center}</style></head>
<body><div id="root"></div>
<script src="platform-data.js"></script>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const P = window.PLATFORM; const KEY = 'sem-platform-v1';
const LEVEL = ['None', 'Idea', 'Designed', 'Built, untested', 'In production with evidence', 'Proven at scale'];
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  const [view, setView] = React.useState(saved.view || 'overview');
  const [scores, setScores] = React.useState(saved.scores || Object.fromEntries(P.scorecard.map((r) => [r[0], r[1]])));
  const [done, setDone] = React.useState(saved.done || {});
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ view, scores, done })); const m = document.querySelector('.scroll'); if (m) m.scrollTop = 0; }, [view]);
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ view, scores, done })); }, [scores, done]);
  const avg = (Object.values(scores).reduce((a, b) => a + b, 0) / P.scorecard.length);
  const nDone = Object.values(done).filter(Boolean).length;
  const T = [['overview', 'Overview', 'hub'], ['tiers', 'Three tiers', 'pane'], ['pillars', '12 pillars', 'apps'], ['score', 'Scorecard', 'analyse'], ['compete', 'Competitive scorecard', 'star'], ['api', 'APIs', 'connect'], ['graph', 'Graph & authority', 'sources'], ['roadmap', 'Roadmap', 'runway'], ['risks', 'Moats & risks', 'spam'], ['next', 'Next 50 actions', 'check']];
  const cur = T.find((t) => t[0] === view) || T[0];
  return <div className="shell"><N.SideRail current={view} onNavigate={setView} groups={[{ label: 'Platform maturity', items: T.map(([id, label, icon]) => ({ id, label, icon })) }]} foot={<span style={{ fontSize: 12, color: 'var(--chrome-text-secondary)' }}>Score {avg.toFixed(2)} / 5 · {nDone}/50 actions</span>} />
    <div className="main"><N.SystemContextBar location={'Platform maturity · ' + cur[1]} term="Becoming the education platform" sync="device-only" />
      <div className="scroll"><div className="page">
        <div className="ph"><div className="kicker">Platform maturity program</div><h1>{view === 'overview' ? 'Preferred daily. Trusted to operate. Built on by partners.' : cur[1]}</h1>{view === 'overview' && <p className="lead">{P.principle}</p>}</div>
        {view === 'overview' && <>
          <div className="tiles"><N.MetricTile label="Readiness score" value={avg.toFixed(2)} unit="/ 5" delta="Design stage: nothing above 2 without evidence" /><N.MetricTile label="Pillars" value="12" /><N.MetricTile label="Next actions done" value={nDone + ' / 50'} /><N.MetricTile label="Expansion stage" value="1 of 7" delta="Daily student OS + registration readiness" /></div>
          <N.Notice head="Strategy">{P.conclusion}</N.Notice>
          <div className="card"><h3>Success is not more features. It is:</h3><div className="chips">{P.success.map((s) => <span className="chip" key={s}>{s}</span>)}</div></div>
          <div className="grid">{P.borrow.slice(0, 3).map(([m, b, s, x]) => <div className="card" key={m}><div className="kicker">Borrow from {m}</div><h3>{s}</h3><p className="muted"><b>Not:</b> {x}</p></div>)}</div>
        </>}
        {view === 'tiers' && <><div>{P.tiers.map(([n, d, l]) => <div className="tier" key={n}><div><h3 style={{ margin: 0, font: '600 18px var(--font-heading)' }}>{n}</h3><p className="muted" style={{ marginTop: 4 }}>{d}</p></div><div className="chips">{l.map((x) => <span className="chip" key={x}>{x}</span>)}</div></div>)}</div>
          <N.SectionLabel>What to borrow, and what not to copy</N.SectionLabel><table className="tbl"><thead><tr><th>Model</th><th>Borrow</th><th>Semester equivalent</th><th>Do not copy</th></tr></thead><tbody>{P.borrow.map((r) => <tr key={r[0]}>{r.map((c, i) => <td key={i}>{i === 0 ? <b style={{ fontWeight: 500 }}>{c}</b> : c}</td>)}</tr>)}</tbody></table></>}
        {view === 'pillars' && <div className="grid">{P.pillars.map((p, i) => <details className="card" key={p.id}><summary style={{ cursor: 'pointer' }}><span className="kicker">{String(i + 1).padStart(2, '0')}</span><h3 style={{ marginTop: 4 }}>{p.name}</h3><p className="muted" style={{ marginTop: 6 }}>{p.state}</p></summary><ul style={{ margin: 0, paddingLeft: 18, lineHeight: 1.6, fontSize: 14 }}>{p.body.map((b) => <li key={b}>{b}</li>)}</ul><N.Fields items={[{ field: 'Owners', value: p.owner.join(' · ') }, { field: 'Metrics', value: p.metrics.join('; ') }, { field: 'Launch gate', value: p.gate }, { field: 'Next action', value: p.next }, { field: 'Evidence', value: p.evidence.join(', '), mono: true }, { field: 'Doc', value: 'docs/platform/' + p.doc + '.md', mono: true }]} /></details>)}</div>}
        {view === 'score' && <><p className="muted">0 none · 1 idea · 2 designed · 3 built, untested · 4 in production with evidence · 5 proven at scale. Scores save on this device. Raise a score only with evidence.</p>
          <table className="tbl"><thead><tr><th>Dimension</th><th>Score</th><th>Level</th><th>Evidence</th></tr></thead><tbody>{P.scorecard.map(([k, , ev]) => <tr key={k}><td><b style={{ fontWeight: 500 }}>{k}</b><div className="bar" style={{ marginTop: 6 }}><i style={{ width: (scores[k] / 5 * 100) + '%' }}></i></div></td><td><div className="score" role="group" aria-label={k + ' score'}>{[0, 1, 2, 3, 4, 5].map((n) => <button key={n} aria-pressed={scores[k] === n} aria-label={n + ' — ' + LEVEL[n]} onClick={() => setScores({ ...scores, [k]: n })}>{n}</button>)}</div></td><td className="muted">{LEVEL[scores[k]]}</td><td className="muted">{ev}</td></tr>)}</tbody></table></>}
        {view === 'compete' && <><N.Notice head="Core loop">{P.coreLoop.join(' → ')}. Every feature must strengthen at least one node.</N.Notice><table className="tbl"><thead><tr><th>Dimension</th><th>0 means</th><th>5 means</th><th>Now</th></tr></thead><tbody>{P.competitive.map((r) => <tr key={r[0]}><td><b style={{ fontWeight: 500 }}>{r[0]}</b><div className="bar" style={{ marginTop: 6 }}><i style={{ width: (r[3] / 5 * 100) + '%' }}></i></div></td><td className="muted">{r[1]}</td><td className="muted">{r[2]}</td><td className="mono">{r[3]}</td></tr>)}</tbody></table><N.SectionLabel>Coherence test · release gate for any new feature</N.SectionLabel><ol style={{ margin: 0, paddingLeft: 20, lineHeight: 1.8 }}>{P.coherence.map((q) => <li key={q}>{q}</li>)}</ol><p className="muted">If the answers are unclear, the feature is not ready.</p></>}
        {view === 'api' && <><p className="muted">Organized by authority and risk, not by page. High-impact writes go through capability-checked server commands, never raw table writes from the browser.</p>
          <table className="tbl"><thead><tr><th>API</th><th>Primary resources</th><th>Write control</th></tr></thead><tbody>{P.apis.map((r) => <tr key={r[0]}><td><b style={{ fontWeight: 500 }}>{r[0]}</b></td><td>{r[1]}</td><td className="muted">{r[2]}</td></tr>)}</tbody></table>
          <N.SectionLabel>Every API answers</N.SectionLabel><div className="grid">{P.contract.map(([k, q]) => <div className="card" key={k}><div className="kicker">{k}</div><span>{q}</span></div>)}</div>
          <N.SectionLabel>Example resources</N.SectionLabel><pre>{P.endpoints.join('\n')}</pre></>}
        {view === 'graph' && <><N.SectionLabel>Every node and relationship carries</N.SectionLabel><div className="chips">{P.nodeFields.map((x) => <span className="chip" key={x}>{x}</span>)}</div>
          <N.SectionLabel>Authority categories</N.SectionLabel><table className="tbl"><thead><tr><th>Category</th><th>Example</th><th>Handling</th></tr></thead><tbody>{P.authority.map((r) => <tr key={r[0]}><td><b style={{ fontWeight: 500 }}>{r[0]}</b></td><td>{r[1]}</td><td className="muted">{r[2]}</td></tr>)}</tbody></table>
          <N.Notice head="Student agency">Private by default. The student picks recipient, category, purpose, duration and items; every access is recorded; revocation is immediate unless policy or law requires otherwise. AI receives only policy-approved context.</N.Notice></>}
        {view === 'roadmap' && <><div className="grid">{P.roadmap36.map(([w, h, l]) => <div className="card" key={w}><div className="kicker">{w}</div><h3>{h}</h3><ul style={{ margin: 0, paddingLeft: 18, lineHeight: 1.6, fontSize: 14 }}>{l.map((x) => <li key={x}>{x}</li>)}</ul></div>)}</div>
          <N.SectionLabel>Expansion stages</N.SectionLabel><N.DecisionTrail items={P.stages.map(([n, s]) => ({ title: 'Stage ' + n, detail: s, state: n === '1' ? 'current' : 'waiting' }))} />
          <N.SectionLabel>Deployment ladder</N.SectionLabel><div className="ladder">{P.ladder.map((x, i) => <React.Fragment key={x}><span className="chip">{x}</span>{i < P.ladder.length - 1 && <span className="muted">→</span>}</React.Fragment>)}</div><p className="muted">Each step requires: {P.ladderGate.join(', ')}.</p></>}
        {view === 'risks' && <div className="grid"><div className="card"><h3>Top 20 moats to build</h3><ol style={{ margin: 0, paddingLeft: 20, lineHeight: 1.7, fontSize: 14 }}>{P.moats.map((m) => <li key={m}>{m}</li>)}</ol></div><div className="card"><h3>Top 20 highest-risk gaps</h3><table className="tbl"><tbody>{P.risks.map(([r, im, p]) => <tr key={r}><td>{r}<br /><span className="muted">{im}</span></td><td className="mono">{p}</td></tr>)}</tbody></table></div></div>}
        {view === 'next' && <><div className="bar"><i style={{ width: (nDone / 50 * 100) + '%' }}></i></div><ol className="todo">{P.next50.map((a, i) => <li key={a} className={done[i] ? 'done' : ''}><label><input type="checkbox" checked={!!done[i]} onChange={(e) => setDone({ ...done, [i]: e.target.checked })} /><span><span className="mono">{String(i + 1).padStart(2, '0')}</span> {a}</span></label></li>)}</ol></>}
      </div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
