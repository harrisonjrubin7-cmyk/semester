[project]
name = "course-engine-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14", "boto3>=1.35", "celery[redis]>=5.4", "email-validator>=2.2",
  "fastapi>=0.115", "icalendar>=6.1", "jinja2>=3.1", "openpyxl>=3.1",
  "pandas>=2.2", "psutil>=6.1", "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7", "pymupdf>=1.25", "python-docx>=1.1", "python-jose[cryptography]>=3.3",
  "python-magic>=0.4", "python-multipart>=0.0.20", "python-pptx>=1.0", "reportlab>=4.2",
  "sqlalchemy>=2.0", "uvicorn[standard]>=0.34", "weasyprint>=63"
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702", "F403"]
