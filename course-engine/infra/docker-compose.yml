services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: course_engine
      POSTGRES_PASSWORD: course_engine
      POSTGRES_DB: course_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_engine"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["../apps/api:/app", "../scripts:/scripts", "../data:/data", "../benchmark:/benchmark"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file: ../.env
    volumes: ["../apps/api/app:/app/app", "../apps/worker:/app/worker", "../data:/data"]
    depends_on: [api, redis]
  dispatcher:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    command: celery -A worker.tasks.celery beat --loglevel=INFO
    env_file: ../.env
    volumes: ["../apps/api/app:/app/app", "../apps/worker:/app/worker", "../data:/data"]
    depends_on: [api, redis]
  web:
    build:
      context: ../apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    volumes: ["../apps/web:/app", "/app/node_modules", "/app/.next"]
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  minio_data:
